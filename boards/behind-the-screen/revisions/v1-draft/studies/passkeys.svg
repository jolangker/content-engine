<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="passkey-title"><title id="passkey-title">Passkey study: local biometric check and a proof sent to the website</title><style>
