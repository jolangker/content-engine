9635099999998"><span data-hf-id="hf-sjab">gerak itu mendorong tuas</span></div><div data-hf-id="hf-yxst" id="phrase-041" class="clip phrase" data-start="56.54030887" data-duration="1.4705453000000048"><span data-hf-id="hf-j0ov">melewati posisi tengahnya.</span></div><div data-hf-id="hf-k63y" id="phrase-042" class="clip phrase" data-start="58.8254375" data-duration="1.3903741499999995"><span data-hf-id="hf-esar">Pegas kemudian membantu tuas</span></div><div data-hf-id="hf-oyfa" id="phrase-043" class="clip phrase" data-start="60.21581165" data-duration="1.4921088400000002"><span data-hf-id="hf-ceae">berpindah ke posisi mati.</span></div><div data-hf-id="hf-uo06" id="phrase-044" class="clip phrase" data-start="61.70792049" data-duration="1.2208163299999981"><span data-hf-id="hf-czn5">Perhatikan batang penghubung yang</span></div><div data-hf-id="hf-wnvr" id="phrase-045" class="clip phrase" data-start="62.92873682" data-duration="0.981700680000003"><span data-hf-id="hf-mnc1">ikut bergeser.</span></div><div data-hf-id="hf-j2mm" id="phrase-046" class="clip phrase" data-start="64.6569375" data-duration="1.5354729700000007"><span data-hf-id="hf-71lu">Batang ini memisahkan kontak.</span></div><div data-hf-id="hf-rw20" id="phrase-047" class="clip phrase" data-start="66.19241047" data-duration="1.7402027100000055"><span data-hf-id="hf-9jh3">Jalur listrik terputus, sehingga</span></div><div data-hf-id="hf-c661" id="phrase-048" class="clip phrase" data-start="67.93261318" data-duration="1.1601351300000005"><span data-hf-id="hf-9b1i">pasokan energi ke elemen</span></div><div data-hf-id="hf-6dg7" id="phrase-049" class="clip phrase" data-start="69.09274831" data-duration="0.7141891899999848"><span data-hf-id="hf-usvc">berhenti.</span></div><div data-hf-id="hf-03rd" id="phrase-050" class="clip phrase" data-start="70.31672917" data-duration="1.7711506600000035"><span data-hf-id="hf-0wbj">Pemanasnya mati, tetapi panas</span></div><div data-hf-id="hf-drzz" id="phrase-051" class="clip p
