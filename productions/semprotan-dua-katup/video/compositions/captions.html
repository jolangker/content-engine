<meta charset="utf-8"><template><style>@font-face{font-family:Manrope;src:url('assets/fonts/manrope.ttf');font-weight:100 900}#root{position:absolute;inset:0;pointer-events:none}.caption{position:absolute;left:108px!important;top:1560px!important;width:846px!important;height:180px!important;display:flex;align-items:center;justify-content:center;text-align:center;font:600 46px/1.36 Manrope;color:#172B3B;box-sizing:border-box}.caption span{background:#F8F9F5;border-radius:14px;padding:14px 22px;max-width:100%;box-sizing:border-box}</style><div data-hf-id="hf-yosn" id="root" data-composition-id="captions" data-width="1080" data-height="1920" data-duration="90"><div data-hf-id="hf-l20r" class="clip caption" id="caption-000" data-start="0.367" data-duration="1.555" data-track-index="0"><span data-hf-id="hf-sy4q">Kenapa semprotan botol tidak menyedot</span></div><div data-hf-id="hf-kvw9" class="clip caption" id="caption-001" data-start="1.933" data-duration="1.688" data-track-index="0"><span data-hf-id="hf-iaby">cairan kembali dari ujungnya?</span></div><div data-hf-id="hf-2x26" class="clip caption" id="caption-002" data-start="3.633" data-duration="1.755" data-track-index="0"><span data-hf-id="hf-jc4f">Jawabannya ada pada dua katup yang</span></div><div data-hf-id="hf-pk66" class="clip caption" id="caption-003" data-start="5.400" data-duration="1.123" data-track-index="0"><span data-hf-id="hf-a1gm">bergantian membuka.</span></div><div data-hf-id="hf-lw8i" class="clip caption" id="caption-004" data-start="6.700" data-duration="2.055" data-track-index="0"><span data-hf-id="hf-nplv">Kita lihat pompa pemicu konvensional.</span></div><div data-hf-id="hf-f10n" class="clip caption" id="caption-005" data-start="8.767" data-duration="2.388" data-track-index="0"><span data-hf-id="hf-vqt6">Di balik cangkangnya ada piston, pegas,</span></div><div data-hf-id="hf-y1dv" class="clip caption" id="caption-006" data-start="11.167" data-duration="1.777" data-track-index="0"><span data-hf-id="hf-caod">jalur masuk, dan jalur keluar.</span></div><div data-hf-id="hf-h5k3" class="clip caption" id="caption-007" data-start="12.956" data-duration="1.999" data-track-index="0"><span data-hf-id="hf-w7hx">Piston membatasi sebuah ruang pompa.</span></div><div data-hf-id="hf-kt5n" class="clip caption" id="caption-008" data-start="14.967" data-duration="1.921" data-track-index="0"><span data-hf-id="hf-qfkd">Segel di sisinya membantu cairan tetap</span></div><div data-hf-id="hf-jhsa" class="clip caption" id="caption-009" data-start="16.900" data-duration="1.588" data-track-index="0"><span data-hf-id="hf-a5r5">berada di jalur yang dirancang.</span></div><div data-hf-id="hf-ofgq" class="clip caption" id="caption-010" data-start="18.500" data-duration="1.755" data-track-index="0"><span data-hf-id="hf-nnsd">Saat pemicu ditarik, tuas mendorong</span></div><div data-hf-id="hf-ekw5" class="clip caption" id="caption-011" data-start="20.267" data-duration="1.088" data-track-index="0"><span data-hf-id="hf-oyxn">piston ke dalam.</span></div><div data-hf-id="hf-rxg0" class="clip caption" id="caption-012" data-start="21.367" data-duration="1.521" data-track-index="0"><span data-hf-id="hf-kigs">Ruang cairan mengecil, sehingga</span></div><div data-hf-id="hf-6byi" class="clip caption" id="caption-013" data-start="22.900" data-duration="1.157" data-track-index="0"><span data-hf-id="hf-o6a0">tekanannya naik.</span></div><div data-hf-id="hf-776e" class="clip caption" id="caption-014" data-start="24.081" data-duration="1.574" data-track-index="0"><span data-hf-id="hf-0fd2">Tekanan itu menekan katup masuk ke</span></div><div data-hf-id="hf-tsue" class="clip caption" id="caption-015" data-start="25.667" data-duration="0.788" data-track-index="0"><span data-hf-id="hf-yc1v">dudukannya.</span></div><div data-hf-id="hf-uzpz" class="clip caption" id="caption-016" data-start="26.467" data-duration="2.015" data-track-index="0"><span data-hf-id="hf-ysin">Jalan kembali menuju botol tertutup.</span></div><div data-hf-id="hf-5447" class="clip caption" id="caption-017" data-start="28.493" data-duration="1.995" data-track-index="0"><span data-hf-id="hf-19sx">Pada jalur satunya, tekanan membuka katup</span></div><div data-hf-id="hf-8ldm" class="clip caption" id="caption-018" data-start="30.500" data-duration="0.688" data-track-index="0"><span data-hf-id="hf-h4ld">keluar.</span></div><div data-hf-id="hf-i66h" class="clip caption" id="caption-019" data-start="31.200" data-duration="2.088" data-track-index="0"><span data-hf-id="hf-hvno">Cairan kini punya jalan menuju nosel.</span></div><div data-hf-id="hf-xfgm" class="clip caption" id="caption-020" data-start="33.300" data-duration="1.788" data-track-index="0"><span data-hf-id="hf-qazo">Cairan melewati nosel, lalu keluar</span></div><div data-hf-id="hf-yu3t" class="clip caption" id="caption-021" data-start="35.100" data-duration="1.166" data-track-index="0"><span data-hf-id="hf-k0rk">sebagai semprotan.</span></div><div data-hf-id="hf-tsyg" class="clip caption" id="caption-022" data-start="36.278" data-duration="1.477" data-track-index="0"><span data-hf-id="hf-pefk">Bentuk nosel menentukan pola yang</span></div><div data-hf-id="hf-hidh" class="clip caption" id="caption-023" data-start="37.767" data-duration="0.890" data-track-index="0"><span data-hf-id="hf-ha2n">dihasilkan.</span></div><div data-hf-id="hf-4cxv" class="clip caption" id="caption-024" data-start="38.673" data-duration="1.859" data-track-index="0"><span data-hf-id="hf-6e9y">Begitu jari melepas pemicu, pegas yang</span></div><div data-hf-id="hf-ouzn" class="clip caption" id="caption-025" data-start="40.544" data-duration="1.744" data-track-index="0"><span data-hf-id="hf-b99a">tadi tertekan mengembalikan piston dan</span></div><div data-hf-id="hf-a3xl" class="clip caption" id="caption-026" data-start="42.300" data-duration="0.490" data-track-index="0"><span data-hf-id="hf-7bu4">tuas.</span></div><div data-hf-id="hf-qpfi" class="clip caption" id="caption-027" data-start="42.967" data-duration="1.490" data-track-index="0"><span data-hf-id="hf-1bro">Ruang pompa membesar lagi.</span></div><div data-hf-id="hf-fea4" class="clip caption" id="caption-028" data-start="44.500" data-duration="1.588" data-track-index="0"><span data-hf-id="hf-5w77">Tekanan di dalamnya turun dibandingkan</span></div><div data-hf-id="hf-jv5z" class="clip caption" id="caption-029" data-start="46.100" data-duration="1.045" data-track-index="0"><span data-hf-id="hf-bglk">cairan di botol.</span></div><div data-hf-id="hf-tvo2" class="clip caption" id="caption-030" data-start="47.157" data-duration="1.797" data-track-index="0"><span data-hf-id="hf-9w7g">Sekarang katup keluar menutup.</span></div><div data-hf-id="hf-9uey" class="clip caption" id="caption-031" data-start="48.967" data-duration="1.721" data-track-index="0"><span data-hf-id="hf-5kyz">Udara atau cairan dari ujung tidak</span></div><div data-hf-id="hf-sl9s" class="clip caption" id="caption-032" data-start="50.700" data-duration="1.588" data-track-index="0"><span data-hf-id="hf-8cwt">ditarik kembali lewat jalur itu.</span></div><div data-hf-id="hf-3807" class="clip caption" id="caption-033" data-start="52.300" data-duration="2.055" data-track-index="0"><span data-hf-id="hf-q9us">Sebaliknya, katup masuk membuka.</span></div><div data-hf-id="hf-dhse" class="clip caption" id="caption-034" data-start="54.367" data-duration="1.655" data-track-index="0"><span data-hf-id="hf-ohi3">Cairan dari botol naik melalui pipa</span></div><div data-hf-id="hf-co8h" class="clip caption" id="caption-035" data-start="56.033" data-duration="1.655" data-track-index="0"><span data-hf-id="hf-6yhc">celup, mengisi ruang pompa.</span></div><div data-hf-id="hf-en79" class="clip caption" id="caption-036" data-start="57.700" data-duration="1.788" data-track-index="0"><span data-hf-id="hf-lh6i">Saat piston kembali, ruang itu sudah</span></div><div data-hf-id="hf-mk7z" class="clip caption" id="caption-037" data-start="59.500" data-duration="1.699" data-track-index="0"><span data-hf-id="hf-vk1k">terisi untuk tekanan berikutnya.</span></div><div data-hf-id="hf-wgmz" class="clip caption" id="caption-038" data-start="61.211" data-duration="1.744" data-track-index="0"><span data-hf-id="hf-77ml">Dua katup mengarahkan aliran secara</span></div><div data-hf-id="hf-lfm0" class="clip caption" id="caption-039" data-start="62.967" data-duration="0.788" data-track-index="0"><span data-hf-id="hf-599u">bergantian.</span></div><div data-hf-id="hf-occr" class="clip caption" id="caption-040" data-start="63.767" data-duration="1.521" data-track-index="0"><span data-hf-id="hf-ooii">Cairan yang meninggalkan botol perlu</span></div><div data-hf-id="hf-2gbr" class="clip caption" id="caption-041" data-start="65.300" data-duration="1.088" data-track-index="0"><span data-hf-id="hf-8pys">digantikan udara.</span></div><div data-hf-id="hf-6sfi" class="clip caption" id="caption-042" data-start="66.400" data-duration="1.921" data-track-index="0"><span data-hf-id="hf-r21g">Jalur ventilasi membantu botol tidak</span></div><div data-hf-id="hf-wgpm" class="clip caption" id="caption-043" data-start="68.333" data-duration="0.944" data-track-index="0"><span data-hf-id="hf-l76h">terus mengempis.</span></div><div data-hf-id="hf-p9lc" class="clip caption" id="caption-044" data-start="69.289" data-duration="1.932" data-track-index="0"><span data-hf-id="hf-dfog">Pada awal pemakaian, ruang pompa bisa</span></div><div data-hf-id="hf-214w" class="clip caption" id="caption-045" data-start="71.233" data-duration="1.155" data-track-index="0"><span data-hf-id="hf-spb8">masih berisi udara.</span></div><div data-hf-id="hf-sdga" class="clip caption" id="caption-046" data-start="72.400" data-duration="1.755" data-track-index="0"><span data-hf-id="hf-2mex">Beberapa gerakan awal membawa cairan</span></div><div data-hf-id="hf-vtoa" class="clip caption" id="caption-047" data-start="74.167" data-duration="1.055" data-track-index="0"><span data-hf-id="hf-m7h1">sampai ke pompa.</span></div><div data-hf-id="hf-s3h2" class="clip caption" id="caption-048" data-start="75.233" data-duration="2.421" data-track-index="0"><span data-hf-id="hf-8qu9">Jadi, menekan pemicu mengeluarkan cairan.</span></div><div data-hf-id="hf-qhjj" class="clip caption" id="caption-049" data-start="77.667" data-duration="2.288" data-track-index="0"><span data-hf-id="hf-puot">Melepasnya menyiapkan isian berikutnya.</span></div><div data-hf-id="hf-obuh" class="clip caption" id="caption-050" data-start="79.967" data-duration="2.090" data-track-index="0"><span data-hf-id="hf-dic4">Katup masuk dan keluar bertukar peran.</span></div><div data-hf-id="hf-62l6" class="clip caption" id="caption-051" data-start="82.087" data-duration="1.645" data-track-index="0"><span data-hf-id="hf-vudf">Gerakan tangan memang bolak-balik.</span></div><div data-hf-id="hf-mmjd" class="clip caption" id="caption-052" data-start="83.744" data-duration="2.144" data-track-index="0"><span data-hf-id="hf-8w4t">Tetapi dua katup membuat aliran utamanya</span></div><div data-hf-id="hf-ji76" class="clip caption" id="caption-053" data-start="85.900" data-duration="2.623" data-track-index="0"><span data-hf-id="hf-sw5y">tetap searah: dari botol menuju nosel.</span></div></div><script>window.__timelines['captions']=gsap.timeline({paused:true});</script></template>
