<template><style>@font-face{font-family:Manrope;src:url('assets/fonts/manrope.ttf');font-weight:100 900}#root{position:absolute;inset:0;pointer-events:none}.caption{position:absolute;left:118px!important;top:1590px!important;width:844px!important;height:180px!important;display:flex;align-items:center;justify-content:center;text-align:center;font:600 46px/1.38 Manrope;color:#172B3B;padding:15px;box-sizing:border-box}.caption span{background:#F8F9F5;padding:14px 22px;border-radius:14px;max-width:100%;box-sizing:border-box}</style><div id="root" data-composition-id="captions" data-width="1080" data-height="1920" data-duration="90"><div id="caption-000" class="clip caption" data-start="0.545" data-duration="1.525" data-track-index="0"><span>Jarumnya cuma naik turun.</span></div>
<div id="caption-001" class="clip caption" data-start="2.154" data-duration="1.643" data-track-index="0"><span>Tapi bagaimana dua benang bisa</span></div>
<div id="caption-002" class="clip caption" data-start="3.792" data-duration="1.821" data-track-index="0"><span>saling mengunci di dalam kain?</span></div>
<div id="caption-003" class="clip caption" data-start="5.811" data-duration="1.376" data-track-index="0"><span>Kita lihat jahitan lurus dua</span></div>
<div id="caption-004" class="clip caption" data-start="7.182" data-duration="1.719" data-track-index="0"><span>benang, atau lockstitch,</span></div>
<div id="caption-005" class="clip caption" data-start="8.896" data-duration="1.948" data-track-index="0"><span>dengan kait yang berputar penuh.</span></div>
<div id="caption-006" class="clip caption" data-start="10.839" data-duration="1.910" data-track-index="0"><span>Benang atas melewati jarum.</span></div>
<div id="caption-007" class="clip caption" data-start="12.744" data-duration="1.605" data-track-index="0"><span>Benang bawah berasal dari bobin</span></div>
<div id="caption-008" class="clip caption" data-start="14.344" data-duration="1.529" data-track-index="0"><span>kecil di bawah kain.</span></div>
<div id="caption-009" class="clip caption" data-start="15.868" data-duration="2.291" data-track-index="0"><span>Perhatikan mata jarumnya: letaknya dekat</span></div>
<div id="caption-010" class="clip caption" data-start="18.154" data-duration="1.910" data-track-index="0"><span>ujung. Saat jarum turun,</span></div>
<div id="caption-011" class="clip caption" data-start="20.058" data-duration="2.057" data-track-index="0"><span>benang atas ikut menembus kain.</span></div>
<div id="caption-012" class="clip caption" data-start="22.111" data-duration="1.915" data-track-index="0"><span>Sesudah mencapai titik terbawah,</span></div>
<div id="caption-013" class="clip caption" data-start="24.021" data-duration="1.453" data-track-index="0"><span>jarum mulai naik.</span></div>
<div id="caption-014" class="clip caption" data-start="25.469" data-duration="1.643" data-track-index="0"><span>Benang yang mengendur membentuk loop</span></div>
<div id="caption-015" class="clip caption" data-start="27.107" data-duration="1.110" data-track-index="0"><span>di sisi jarum.</span></div>
<div id="caption-016" class="clip caption" data-start="28.212" data-duration="1.681" data-track-index="0"><span>Ujung kait datang tepat saat</span></div>
<div id="caption-017" class="clip caption" data-start="29.888" data-duration="0.919" data-track-index="0"><span>loop terbuka,</span></div>
<div id="caption-018" class="clip caption" data-start="30.802" data-duration="1.948" data-track-index="0"><span>lalu masuk dan menangkapnya.</span></div>
<div id="caption-019" class="clip caption" data-start="32.745" data-duration="1.300" data-track-index="0"><span>Kait terus berputar,</span></div>
<div id="caption-020" class="clip caption" data-start="34.040" data-duration="2.215" data-track-index="0"><span>membawa loop mengelilingi rumah bobin.</span></div>
<div id="caption-021" class="clip caption" data-start="36.250" data-duration="1.872" data-track-index="0"><span>Rumahnya tidak ikut berputar bersama</span></div>
<div id="caption-022" class="clip caption" data-start="38.116" data-duration="1.872" data-track-index="0"><span>kait. Satu sisi loop lewat</span></div>
<div id="caption-023" class="clip caption" data-start="39.983" data-duration="1.376" data-track-index="0"><span>di belakang rumah bobin.</span></div>
<div id="caption-024" class="clip caption" data-start="41.355" data-duration="2.176" data-track-index="0"><span>Sisi lainnya melewati bagian depan.</span></div>
<div id="caption-025" class="clip caption" data-start="43.526" data-duration="1.605" data-track-index="0"><span>Dengan melewati rumah bobin,</span></div>
<div id="caption-026" class="clip caption" data-start="45.126" data-duration="1.757" data-track-index="0"><span>loop benang atas mengelilingi benang</span></div>
<div id="caption-027" class="clip caption" data-start="46.878" data-duration="2.710" data-track-index="0"><span>bawah. Inilah pertemuan kedua benang.</span></div>
<div id="caption-028" class="clip caption" data-start="49.583" data-duration="0.729" data-track-index="0"><span>Di atas,</span></div>
<div id="caption-029" class="clip caption" data-start="50.307" data-duration="2.164" data-track-index="0"><span>tuas penarik tadi memberi kelonggaran.</span></div>
<div id="caption-030" class="clip caption" data-start="52.466" data-duration="1.617" data-track-index="0"><span>Kini tuas naik untuk menarik</span></div>
<div id="caption-031" class="clip caption" data-start="54.078" data-duration="1.326" data-track-index="0"><span>kembali benang atas.</span></div>
<div id="caption-032" class="clip caption" data-start="55.564" data-duration="1.059" data-track-index="0"><span>Loop mengecil.</span></div>
<div id="caption-033" class="clip caption" data-start="56.631" data-duration="1.605" data-track-index="0"><span>Benang atas menarik benang bawah</span></div>
<div id="caption-034" class="clip caption" data-start="58.231" data-duration="1.059" data-track-index="0"><span>menuju kain,</span></div>
<div id="caption-035" class="clip caption" data-start="59.297" data-duration="1.897" data-track-index="0"><span>sampai keduanya saling mengunci.</span></div>
<div id="caption-036" class="clip caption" data-start="61.202" data-duration="1.567" data-track-index="0"><span>Pada tegangan yang seimbang,</span></div>
<div id="caption-037" class="clip caption" data-start="62.764" data-duration="1.719" data-track-index="0"><span>titik kaitannya berada di dalam</span></div>
<div id="caption-038" class="clip caption" data-start="64.478" data-duration="0.907" data-track-index="0"><span>lapisan kain.</span></div>
<div id="caption-039" class="clip caption" data-start="65.545" data-duration="1.376" data-track-index="0"><span>Setelah jarum keluar,</span></div>
<div id="caption-040" class="clip caption" data-start="66.916" data-duration="1.948" data-track-index="0"><span>gigi penggerak menggeser kain.</span></div>
<div id="caption-041" class="clip caption" data-start="68.859" data-duration="1.872" data-track-index="0"><span>Sepatu penekan menjaga kain tetap</span></div>
<div id="caption-042" class="clip caption" data-start="70.726" data-duration="2.253" data-track-index="0"><span>tertekan. Giginya turun lalu kembali</span></div>
<div id="caption-043" class="clip caption" data-start="72.974" data-duration="0.995" data-track-index="0"><span>di bawah pelat.</span></div>
<div id="caption-044" class="clip caption" data-start="73.964" data-duration="1.491" data-track-index="0"><span>Jarum turun lagi saat kain</span></div>
<div id="caption-045" class="clip caption" data-start="75.450" data-duration="1.135" data-track-index="0"><span>berhenti bergeser.</span></div>
<div id="caption-046" class="clip caption" data-start="76.821" data-duration="1.631" data-track-index="0"><span>Jadi bukan jarum saja.</span></div>
<div id="caption-047" class="clip caption" data-start="78.497" data-duration="1.262" data-track-index="0"><span>Jarum membuat loop,</span></div>
<div id="caption-048" class="clip caption" data-start="79.755" data-duration="1.338" data-track-index="0"><span>kait menangkapnya,</span></div>
<div id="caption-049" class="clip caption" data-start="81.088" data-duration="1.224" data-track-index="0"><span>tuas mengencangkan,</span></div>
<div id="caption-050" class="clip caption" data-start="82.307" data-duration="1.529" data-track-index="0"><span>lalu kain bergeser.</span></div>
<div id="caption-051" class="clip caption" data-start="83.831" data-duration="1.681" data-track-index="0"><span>Siklus yang teratur ini mengubah</span></div>
<div id="caption-052" class="clip caption" data-start="85.507" data-duration="2.084" data-track-index="0"><span>dua benang menjadi deretan jahitan.</span></div></div><script>window.__timelines=window.__timelines||{};window.__timelines['captions']=gsap.timeline({paused:true});</script></template>
