<template><style>@font-face{font-family:Newsreader;src:url("assets/board/newsreader.ttf");font-weight:400;font-display:block}@font-face{font-family:DM Sans;src:url("assets/board/dm-sans.ttf");font-weight:100 900;font-display:block}.capline{position:absolute;left:88px;top:1550px;right:auto;bottom:auto;width:848px;height:190px;display:flex;align-items:center;font:500 46px/1.25 'DM Sans',sans-serif}</style><div data-hf-id="hf-vqjb" id="caption-root" data-composition-id="captions" data-width="1080" data-height="1920" data-duration="88.3200" style="position:relative;width:100%;height:100%;background:transparent;pointer-events:none"><div data-hf-id="hf-niuu" id="cap-0" class="clip capline" data-start="0.1930" data-duration="2.1720" data-track-index="0" style="color:#302B28">Dia bilang, nanti kita bahas.</div><div data-hf-id="hf-i2ei" id="cap-1" class="clip capline" data-start="2.3650" data-duration="2.6850" data-track-index="0" style="color:#302B28">Lo jadi lebih tenang, atau malah bingung:</div><div data-hf-id="hf-gv7q" id="cap-2" class="clip capline" data-start="5.0850" data-duration="1.4050" data-track-index="0" style="color:#302B28">nanti itu kapan?</div><div data-hf-id="hf-k7vo" id="cap-3" class="clip capline" data-start="6.9250" data-duration="2.1600" data-track-index="0" style="color:#302B28">Jeda bisa memberi ruang buat menenangkan</div><div data-hf-id="hf-0rcv" id="cap-4" class="clip capline" data-start="9.0850" data-duration="0.7200" data-track-index="0" style="color:#302B28">diri.</div><div data-hf-id="hf-cq5t" id="cap-5" class="clip capline" data-start="9.8050" data-duration="2.8610" data-track-index="0" style="color:#302B28">Obrolannya tetap perlu punya waktu kembali.</div><div data-hf-id="hf-bmy3" id="cap-6" class="clip capline" data-start="13.0690" data-duration="2.7360" data-track-index="0" style="color:#302B28">Misalnya, kalian membahas rencana yang berubah.</div><div data-hf-id="hf-cozo" id="cap-7" class="clip capline" data-start="15.8050" data-duration="2.2000" data-track-index="0" style="color:#302B28">Nada mulai naik, dan jawaban makin</div><div data-hf-id="hf-nshh" id="cap-8" class="clip capline" data-start="18.0050" data-duration="0.6550" data-track-index="0" style="color:#302B28">pendek.</div><div data-hf-id="hf-9nlr" id="cap-9" class="clip capline" data-start="18.6850" data-duration="1.2270" data-track-index="0" style="color:#F3EDE3">Satu orang pergi.</div><div data-hf-id="hf-kw6q" id="cap-10" class="clip capline" data-start="19.9120" data-duration="2.2130" data-track-index="0" style="color:#F3EDE3">Yang lain masih duduk dengan pertanyaan yang belum</div><div data-hf-id="hf-5txx" id="cap-11" class="clip capline" data-start="22.1250" data-duration="1.0450" data-track-index="0" style="color:#F3EDE3">selesai.</div><div data-hf-id="hf-osf9" id="cap-12" class="clip capline" data-start="23.9050" data-duration="1.5200" data-track-index="0" style="color:#302B28">Lo mungkin butuh tenang.</div><div data-hf-id="hf-8ide" id="cap-13" class="clip capline" data-start="25.4250" data-duration="2.5330" data-track-index="0" style="color:#302B28">Dia mungkin belum tahu apakah percakapan ini bakal</div><div data-hf-id="hf-f1ju" id="cap-14" class="clip capline" data-start="27.9580" data-duration="1.1520" data-track-index="0" style="color:#302B28">dilanjutkan.</div><div data-hf-id="hf-76mp" id="cap-15" class="clip capline" data-start="29.1610" data-duration="2.6640" data-track-index="0" style="color:#302B28">Satu jeda belum menjelaskan niat seseorang.</div><div data-hf-id="hf-8c4w" id="cap-16" class="clip capline" data-start="31.8250" data-duration="2.4050" data-track-index="0" style="color:#302B28">Lihat juga cara jedanya dibicarakan.</div><div data-hf-id="hf-rnkj" id="cap-17" class="clip capline" data-start="34.6650" data-duration="2.8000" data-track-index="0" style="color:#302B28">Saat suasana tenang, sepakati bagaimana kalian</div><div data-hf-id="hf-kixx" id="cap-18" class="clip capline" data-start="37.4650" data-duration="2.2450" data-track-index="0" style="color:#302B28">meminta jeda dan kembali ngobrol.</div><div data-hf-id="hf-rlhu" id="cap-19" class="clip capline" data-start="39.8950" data-duration="2.8400" data-track-index="0" style="color:#302B28">Ketika mulai kewalahan, bilang kondisi lo dan minta</div><div data-hf-id="hf-5nw4" id="cap-20" class="clip capline" data-start="42.7350" data-duration="1.9340" data-track-index="0" style="color:#302B28">waktu, tanpa menyerang.</div><div data-hf-id="hf-n786" id="cap-21" class="clip capline" data-start="44.6940" data-duration="1.3370" data-track-index="0" style="color:#302B28">Gua mulai susah dengar.</div><div data-hf-id="hf-1am5" id="cap-22" class="clip capline" data-start="46.0310" data-duration="1.1200" data-track-index="0" style="color:#302B28">Gua mau tenang dulu.</div><div data-hf-id="hf-xqar" id="cap-23" class="clip capline" data-start="47.1510" data-duration="1.5650" data-track-index="0" style="color:#302B28">Kita lanjut jam delapan, ya?</div><div data-hf-id="hf-olwg" id="cap-24" class="clip capline" data-start="49.0150" data-duration="2.1860" data-track-index="0" style="color:#302B28">Jam delapan cuma contoh kesepakatan.</div><div data-hf-id="hf-9xrj" id="cap-25" class="clip capline" data-start="51.2010" data-duration="2.3980" data-track-index="0" style="color:#302B28">Pilih waktu yang realistis buat kalian.</div><div data-hf-id="hf-unqx" id="cap-26" class="clip capline" data-start="53.8180" data-duration="2.7730" data-track-index="0" style="color:#302B28">Selama jeda, lakukan hal yang menenangkan.</div><div data-hf-id="hf-ay75" id="cap-27" class="clip capline" data-start="56.5910" data-duration="2.6720" data-track-index="0" style="color:#302B28">Jangan sibuk menyusun balasan buat menyerang.</div><div data-hf-id="hf-qyen" id="cap-28" class="clip capline" data-start="59.7680" data-duration="2.0630" data-track-index="0" style="color:#F3EDE3">Lalu, benar-benar kembali.</div><div data-hf-id="hf-8wsz" id="cap-29" class="clip capline" data-start="61.8310" data-duration="2.1070" data-track-index="0" style="color:#F3EDE3">Kesepakatan tadi perlu kelihatan dalam</div><div data-hf-id="hf-ep2l" id="cap-30" class="clip capline" data-start="63.9380" data-duration="0.9650" data-track-index="0" style="color:#F3EDE3">tindakan.</div><div data-hf-id="hf-uihe" id="cap-31" class="clip capline" data-start="65.6380" data-duration="2.8000" data-track-index="0" style="color:#302B28">Kalau belum siap, kabari dan sepakati ulang.</div><div data-hf-id="hf-3kiz" id="cap-32" class="clip capline" data-start="68.4380" data-duration="2.2580" data-track-index="0" style="color:#302B28">Jangan membiarkan orang lain menebak.</div><div data-hf-id="hf-tw1e" id="cap-33" class="clip capline" data-start="70.8950" data-duration="2.2930" data-track-index="0" style="color:#302B28">Pas balik, mulai dari persoalan yang tadi</div><div data-hf-id="hf-jh3m" id="cap-34" class="clip capline" data-start="73.1880" data-duration="0.7730" data-track-index="0" style="color:#302B28">tertunda.</div><div data-hf-id="hf-xsc1" id="cap-35" class="clip capline" data-start="73.9610" data-duration="2.0450" data-track-index="0" style="color:#302B28">Nggak harus langsung beres semuanya.</div><div data-hf-id="hf-v7st" id="cap-36" class="clip capline" data-start="76.2050" data-duration="2.6930" data-track-index="0" style="color:#302B28">Kalau berulang kali nggak dilanjutkan, bicarakan pola</div><div data-hf-id="hf-2r8a" id="cap-37" class="clip capline" data-start="78.8980" data-duration="2.4530" data-track-index="0" style="color:#302B28">penundaannya saat suasana lebih tenang.</div><div data-hf-id="hf-q2sz" id="cap-38" class="clip capline" data-start="81.5680" data-duration="2.2930" data-track-index="0" style="color:#302B28">Jadi, kalau bilang nanti, coba</div><div data-hf-id="hf-i8vw" id="cap-39" class="clip capline" data-start="83.8610" data-duration="2.7870" data-track-index="0" style="color:#302B28">lengkapi: kapan kita kembali, dan siapa yang</div><div data-hf-id="hf-03to" id="cap-40" class="clip capline" data-start="86.6480" data-duration="0.6450" data-track-index="0" style="color:#302B28">mulai?</div></div><script>window.__timelines["captions"]=gsap.timeline({paused:true});</script></template>
