<template><style>@font-face{font-family:Newsreader;src:url("assets/board/newsreader.ttf");font-weight:400;font-display:block}@font-face{font-family:DM Sans;src:url("assets/board/dm-sans.ttf");font-weight:100 900;font-display:block}.capline{position:absolute;left:88px;top:1550px;right:auto;bottom:auto;width:848px;height:190px;display:flex;align-items:center;font:500 46px/1.25 'DM Sans',sans-serif}</style><div data-hf-id="hf-gw4i" id="root" data-composition-id="captions" data-width="1080" data-height="1920" data-duration="88.33333333333333"><div data-hf-id="hf-8awf" id="caption-000" class="clip capline" data-start="0.04500000" data-duration="2.06487853" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Dia bilang, nanti kita bahas.</div><div data-hf-id="hf-nexl" id="caption-001" class="clip capline" data-start="2.20915627" data-duration="2.57104399" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Lo jadi lebih tenang, atau malah bingung:</div><div data-hf-id="hf-g1ty" id="caption-002" class="clip capline" data-start="4.91933355" data-duration="1.29566645" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">nanti itu kapan?</div><div data-hf-id="hf-2f5m" id="caption-003" class="clip capline" data-start="6.91000000" data-duration="2.02695087" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Jeda bisa memberi ruang buat menenangkan</div><div data-hf-id="hf-e5il" id="caption-004" class="clip capline" data-start="8.93695087" data-duration="0.67565029" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">diri.</div><div data-hf-id="hf-tkl0" id="caption-005" class="clip capline" data-start="9.61260116" data-duration="2.59239884" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Obrolannya tetap perlu punya waktu kembali.</div><div data-hf-id="hf-4d3y" id="caption-006" class="clip capline" data-start="12.91500000" data-duration="2.63492109" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Misalnya, kalian membahas rencana yang berubah.</div><div data-hf-id="hf-2n4l" id="caption-007" class="clip capline" data-start="15.54992109" data-duration="2.10315638" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Nada mulai naik, dan jawaban makin</div><div data-hf-id="hf-r7tz" id="caption-008" class="clip capline" data-start="17.66864419" data-duration="0.71635581" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">pendek.</div><div data-hf-id="hf-faub" id="caption-009" class="clip capline" data-start="18.65500000" data-duration="1.13812850" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">Satu orang pergi.</div><div data-hf-id="hf-sjpa" id="caption-010" class="clip capline" data-start="19.79312850" data-duration="2.05271262" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">Yang lain masih duduk dengan pertanyaan yang belum</div><div data-hf-id="hf-0q9j" id="caption-011" class="clip capline" data-start="21.84584112" data-duration="0.87915888" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">selesai.</div><div data-hf-id="hf-yewq" id="caption-012" class="clip capline" data-start="23.89500000" data-duration="1.44552000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Lo mungkin butuh tenang.</div><div data-hf-id="hf-ew5l" id="caption-013" class="clip capline" data-start="25.34052000" data-duration="2.40888300" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Dia mungkin belum tahu apakah percakapan ini bakal</div><div data-hf-id="hf-ak9m" id="caption-014" class="clip capline" data-start="27.74940300" data-duration="1.00059700" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">dilanjutkan.</div><div data-hf-id="hf-5wl7" id="caption-015" class="clip capline" data-start="28.92000000" data-duration="2.62894737" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Satu jeda belum menjelaskan niat seseorang.</div><div data-hf-id="hf-xhzh" id="caption-016" class="clip capline" data-start="31.54894737" data-duration="2.27105263" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Lihat juga cara jedanya dibicarakan.</div><div data-hf-id="hf-h638" id="caption-017" class="clip capline" data-start="34.62500000" data-duration="2.67851240" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Saat suasana tenang, sepakati bagaimana kalian</div><div data-hf-id="hf-67h8" id="caption-018" class="clip capline" data-start="37.30351240" data-duration="2.05148760" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">meminta jeda dan kembali ngobrol.</div><div data-hf-id="hf-s8ug" id="caption-019" class="clip capline" data-start="39.89000000" data-duration="2.69004310" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Ketika mulai kewalahan, bilang kondisi lo dan minta</div><div data-hf-id="hf-74x5" id="caption-020" class="clip capline" data-start="42.58004310" data-duration="1.80495690" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">waktu, tanpa menyerang.</div><div data-hf-id="hf-wogz" id="caption-021" class="clip capline" data-start="44.56500000" data-duration="1.26799581" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Gua mulai susah dengar.</div><div data-hf-id="hf-jq95" id="caption-022" class="clip capline" data-start="45.83299581" data-duration="1.06219544" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Gua mau tenang dulu.</div><div data-hf-id="hf-8s41" id="caption-023" class="clip capline" data-start="46.89519125" data-duration="1.38980875" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kita lanjut jam delapan, ya?</div><div data-hf-id="hf-20wy" id="caption-024" class="clip capline" data-start="48.91000000" data-duration="2.10163508" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Jam delapan cuma contoh kesepakatan.</div><div data-hf-id="hf-spf0" id="caption-025" class="clip capline" data-start="51.01163508" data-duration="2.20836492" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Pilih waktu yang realistis buat kalian.</div><div data-hf-id="hf-p5ez" id="caption-026" class="clip capline" data-start="53.76500000" data-duration="2.66451431" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Selama jeda, lakukan hal yang menenangkan.</div><div data-hf-id="hf-81gj" id="caption-027" class="clip capline" data-start="56.42951431" data-duration="2.47048569" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Jangan sibuk menyusun balasan buat menyerang.</div><div data-hf-id="hf-6yaq" id="caption-028" class="clip capline" data-start="59.67500000" data-duration="1.99395436" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">Lalu, benar-benar kembali.</div><div data-hf-id="hf-vhru" id="caption-029" class="clip capline" data-start="61.66895436" data-duration="2.03648175" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">Kesepakatan tadi perlu kelihatan dalam</div><div data-hf-id="hf-9lma" id="caption-030" class="clip capline" data-start="63.70543611" data-duration="0.83456389" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">tindakan.</div><div data-hf-id="hf-nhpn" id="caption-031" class="clip capline" data-start="65.61500000" data-duration="2.59056254" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kalau belum siap, kabari dan sepakati ulang.</div><div data-hf-id="hf-73qc" id="caption-032" class="clip capline" data-start="68.20556254" data-duration="1.99943746" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Jangan membiarkan orang lain menebak.</div><div data-hf-id="hf-kd5t" id="caption-033" class="clip capline" data-start="70.81500000" data-duration="2.18503363" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Pas balik, mulai dari persoalan yang tadi</div><div data-hf-id="hf-hx7z" id="caption-034" class="clip capline" data-start="73.00003363" data-duration="0.73660314" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">tertunda.</div><div data-hf-id="hf-vhs1" id="caption-035" class="clip capline" data-start="73.73663677" data-duration="1.85336323" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Nggak harus langsung beres semuanya.</div><div data-hf-id="hf-ja0d" id="caption-036" class="clip capline" data-start="76.13000000" data-duration="2.62705120" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kalau berulang kali nggak dilanjutkan, bicarakan pola</div><div data-hf-id="hf-foi2" id="caption-037" class="clip capline" data-start="78.75705120" data-duration="2.29294880" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">penundaannya saat suasana lebih tenang.</div><div data-hf-id="hf-xlg3" id="caption-038" class="clip capline" data-start="81.54000000" data-duration="2.23069022" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Jadi, kalau bilang nanti, coba</div><div data-hf-id="hf-qogn" id="caption-039" class="clip capline" data-start="83.77069022" data-duration="2.69452717" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">lengkapi: kapan kita kembali, dan siapa yang</div><div data-hf-id="hf-on5j" id="caption-040" class="clip capline" data-start="86.48195652" data-duration="0.52804348" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">mulai?</div></div><script>const tl=gsap.timeline({paused:true});tl.to({},{duration:88.33333333333333},0);window.__timelines.captions=tl;</script></template>
