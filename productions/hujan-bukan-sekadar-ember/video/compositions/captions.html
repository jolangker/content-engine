<template><div id="root" data-composition-id="captions" data-width="1080" data-height="1920" data-duration="84.69" style="width:100%;height:100%;position:relative"><div id="cap-000" class="clip" data-start="0.3500" data-duration="1.1600" data-track-index="0"><div class="spoken">Kalau kamu mau menyimpan</div></div><div id="cap-001" class="clip" data-start="1.5500" data-duration="1.4800" data-track-index="0"><div class="spoken">air hujan, taruh ember</div></div><div id="cap-002" class="clip" data-start="3.0300" data-duration="0.6000" data-track-index="0"><div class="spoken">saja.</div></div><div id="cap-003" class="clip" data-start="3.7900" data-duration="0.7600" data-track-index="0"><div class="spoken">Beres?</div></div><div id="cap-004" class="clip" data-start="4.7500" data-duration="0.8800" data-track-index="0"><div class="spoken">Belum.</div></div><div id="cap-005" class="clip" data-start="5.7900" data-duration="1.8000" data-track-index="0"><div class="spoken">Mulutnya kecil, sementara</div></div><div id="cap-006" class="clip" data-start="7.6300" data-duration="1.4800" data-track-index="0"><div class="spoken">air dari atap lewat begitu</div></div><div id="cap-007" class="clip" data-start="9.1500" data-duration="0.6000" data-track-index="0"><div class="spoken">saja.</div></div><div id="cap-008" class="clip" data-start="9.9500" data-duration="1.4000" data-track-index="0"><div class="spoken">Jadi, kumpulkan lewat</div></div><div id="cap-009" class="clip" data-start="11.4300" data-duration="1.5200" data-track-index="0"><div class="spoken">talang, lalu arahkan ke</div></div><div id="cap-010" class="clip" data-start="12.9900" data-duration="0.5600" data-track-index="0"><div class="spoken">tangki.</div></div><div id="cap-011" class="clip" data-start="13.7900" data-duration="1.0800" data-track-index="0"><div class="spoken">Tapi atap juga</div></div><div id="cap-012" class="clip" data-start="14.8830" data-duration="1.0270" data-track-index="0"><div class="spoken">mengumpulkan daun dan</div></div><div id="cap-013" class="clip" data-start="15.9500" data-duration="1.0000" data-track-index="0"><div class="spoken">kotoran.</div></div><div id="cap-014" class="clip" data-start="16.9500" data-duration="1.2800" data-track-index="0"><div class="spoken">Kita pasang saringan untuk</div></div><div id="cap-015" class="clip" data-start="18.2700" data-duration="1.4800" data-track-index="0"><div class="spoken">menahan sampah besar.</div></div><div id="cap-016" class="clip" data-start="19.7900" data-duration="1.3200" data-track-index="0"><div class="spoken">Masalahnya, debu yang</div></div><div id="cap-017" class="clip" data-start="21.1500" data-duration="1.1600" data-track-index="0"><div class="spoken">terbawa air masih bisa</div></div><div id="cap-018" class="clip" data-start="22.3500" data-duration="0.7600" data-track-index="0"><div class="spoken">lewat.</div></div><div id="cap-019" class="clip" data-start="23.1100" data-duration="1.3600" data-track-index="0"><div class="spoken">Saringan ini belum membuat</div></div><div id="cap-020" class="clip" data-start="24.5500" data-duration="1.3600" data-track-index="0"><div class="spoken">air aman diminum.</div></div><div id="cap-021" class="clip" data-start="26.0190" data-duration="1.6510" data-track-index="0"><div class="spoken">Jadi, aliran awal kita</div></div><div id="cap-022" class="clip" data-start="27.7100" data-duration="0.9200" data-track-index="0"><div class="spoken">belokkan ke tabung</div></div><div id="cap-023" class="clip" data-start="28.6700" data-duration="0.8400" data-track-index="0"><div class="spoken">terpisah.</div></div><div id="cap-024" class="clip" data-start="29.5500" data-duration="1.1600" data-track-index="0"><div class="spoken">Tabung ini terisi lebih</div></div><div id="cap-025" class="clip" data-start="30.7100" data-duration="1.8400" data-track-index="0"><div class="spoken">dulu, lalu air berikutnya</div></div><div id="cap-026" class="clip" data-start="32.5500" data-duration="1.3600" data-track-index="0"><div class="spoken">mengalir ke tangki.</div></div><div id="cap-027" class="clip" data-start="33.9900" data-duration="1.4400" data-track-index="0"><div class="spoken">Namanya pemisah aliran</div></div><div id="cap-028" class="clip" data-start="35.4700" data-duration="0.6800" data-track-index="0"><div class="spoken">awal.</div></div><div id="cap-029" class="clip" data-start="36.1900" data-duration="1.3200" data-track-index="0"><div class="spoken">Setelah hujan, tabung</div></div><div id="cap-030" class="clip" data-start="37.5500" data-duration="0.9200" data-track-index="0"><div class="spoken">perlu dikuras dan</div></div><div id="cap-031" class="clip" data-start="38.4830" data-duration="1.5070" data-track-index="0"><div class="spoken">dibersihkan supaya siap</div></div><div id="cap-032" class="clip" data-start="40.0030" data-duration="0.8670" data-track-index="0"><div class="spoken">dipakai lagi.</div></div><div id="cap-033" class="clip" data-start="41.1320" data-duration="1.5780" data-track-index="0"><div class="spoken">Kelihatannya sudah beres.</div></div><div id="cap-034" class="clip" data-start="42.9100" data-duration="1.7200" data-track-index="0"><div class="spoken">Eh, ada yang mau pindahan.</div></div><div id="cap-035" class="clip" data-start="44.6300" data-duration="1.7600" data-track-index="0"><div class="spoken">Tangki dibiarkan terbuka,</div></div><div id="cap-036" class="clip" data-start="46.3900" data-duration="1.3600" data-track-index="0"><div class="spoken">nyamuk bisa masuk.</div></div><div id="cap-037" class="clip" data-start="47.7900" data-duration="1.8000" data-track-index="0"><div class="spoken">Jadi, tutup tangkinya, dan</div></div><div id="cap-038" class="clip" data-start="49.6300" data-duration="1.4800" data-track-index="0"><div class="spoken">beri jala pada bukaan,</div></div><div id="cap-039" class="clip" data-start="51.1900" data-duration="1.3600" data-track-index="0"><div class="spoken">termasuk ventilasi.</div></div><div id="cap-040" class="clip" data-start="52.6170" data-duration="0.8930" data-track-index="0"><div class="spoken">Dinding yang tidak tembus</div></div><div id="cap-041" class="clip" data-start="53.5500" data-duration="1.3200" data-track-index="0"><div class="spoken">cahaya juga membantu</div></div><div id="cap-042" class="clip" data-start="54.8700" data-duration="1.1200" data-track-index="0"><div class="spoken">membatasi pertumbuhan</div></div><div id="cap-043" class="clip" data-start="56.0300" data-duration="0.6400" data-track-index="0"><div class="spoken">alga.</div></div><div id="cap-044" class="clip" data-start="57.0170" data-duration="1.2130" data-track-index="0"><div class="spoken">Sekarang hujannya terus</div></div><div id="cap-045" class="clip" data-start="58.2700" data-duration="0.6000" data-track-index="0"><div class="spoken">turun.</div></div><div id="cap-046" class="clip" data-start="58.9100" data-duration="1.4800" data-track-index="0"><div class="spoken">Kalau tangki penuh, air</div></div><div id="cap-047" class="clip" data-start="60.4300" data-duration="1.1600" data-track-index="0"><div class="spoken">butuh jalan keluar.</div></div><div id="cap-048" class="clip" data-start="61.5900" data-duration="1.0400" data-track-index="0"><div class="spoken">Kita tambahkan pipa</div></div><div id="cap-049" class="clip" data-start="62.6700" data-duration="1.5600" data-track-index="0"><div class="spoken">pelimpah, lalu arahkan</div></div><div id="cap-050" class="clip" data-start="64.3100" data-duration="1.5200" data-track-index="0"><div class="spoken">menjauhi fondasi rumah.</div></div><div id="cap-051" class="clip" data-start="65.8700" data-duration="1.3200" data-track-index="0"><div class="spoken">Jalur keluar ini juga</div></div><div id="cap-052" class="clip" data-start="67.1900" data-duration="0.7200" data-track-index="0"><div class="spoken">diberi jala.</div></div><div id="cap-053" class="clip" data-start="68.3660" data-duration="1.5440" data-track-index="0"><div class="spoken">Saat dibutuhkan, air bisa</div></div><div id="cap-054" class="clip" data-start="69.9500" data-duration="1.1600" data-track-index="0"><div class="spoken">diambil untuk menyiram</div></div><div id="cap-055" class="clip" data-start="71.1500" data-duration="1.0000" data-track-index="0"><div class="spoken">tanaman hias.</div></div><div id="cap-056" class="clip" data-start="72.1500" data-duration="1.2000" data-track-index="0"><div class="spoken">Bersihkan talang,</div></div><div id="cap-057" class="clip" data-start="73.3900" data-duration="1.3200" data-track-index="0"><div class="spoken">saringan, dan penampung</div></div><div id="cap-058" class="clip" data-start="74.7500" data-duration="1.1600" data-track-index="0"><div class="spoken">secara berkala.</div></div><div id="cap-059" class="clip" data-start="76.0300" data-duration="1.4000" data-track-index="0"><div class="spoken">Ini sistem penampungan,</div></div><div id="cap-060" class="clip" data-start="77.4700" data-duration="1.0800" data-track-index="0"><div class="spoken">bukan pengolahan air</div></div><div id="cap-061" class="clip" data-start="78.5900" data-duration="0.6000" data-track-index="0"><div class="spoken">minum.</div></div><div id="cap-062" class="clip" data-start="79.2300" data-duration="1.6800" data-track-index="0"><div class="spoken">Nah, sekarang kamu boleh</div></div><div id="cap-063" class="clip" data-start="80.9100" data-duration="0.5200" data-track-index="0"><div class="spoken">duduk.</div></div><div id="cap-064" class="clip" data-start="81.4700" data-duration="0.8400" data-track-index="0"><div class="spoken">Tanamannya dulu yang</div></div><div id="cap-065" class="clip" data-start="82.3500" data-duration="0.6400" data-track-index="0"><div class="spoken">minum.</div></div><script>const tl=gsap.timeline({paused:true});tl.to({}, {duration:84.69});window.__timelines.captions=tl;</script></div></template>
