data-start="5.84486504" data-duration="0.9573912999999994" data-layout-allow-caption-zone="true"><span>dengan alur pada batang</span></div><div id="cap-005" class="clip phrase" data-start="6.80225634" data-duration="0.7063478300000003" data-layout-allow-caption-zone="true"><span>tengah.</span></div><div id="cap-006" class="clip phrase" data-start="8.11841667" data-duration="0.9596594300000003" data-layout-allow-caption-zone="true"><span>Batang yang sama punya</span></div><div id="cap-007" class="clip phrase" data-start="9.0780761" data-duration="1.1731836599999994" data-layout-allow-caption-zone="true"><span>spiral di bawahnya.</span></div><div id="cap-008" class="clip phrase" data-start="10.25125976" data-duration="0.9700557500000002" data-layout-allow-caption-zone="true"><span>Bagian inilah yang menancap</span></div><div id="cap-009" class="clip phrase" data-start="11.22131551" data-duration="0.94210116" data-layout-allow-caption-zone="true"><span>ke gabus.</span></div><div id="cap-010" class="clip phrase" data-start="12.68202083" data-duration="0.9068889699999989" data-layout-allow-caption-zone="true"><span>Mulainya begini.</span></div><div id="cap-011" class="clip phrase" data-start="13.5889098" data-duration="1.0620474600000005" data-layout-allow-caption-zone="true"><span>Kaki pembuka duduk di</span></div><div id="cap-012" class="clip phrase" data-start="14.65095726" data-duration="1.4603152599999998" data-layout-allow-caption-zone="true"><span>bibir botol, sementara ujung</span></div><div id="cap-013" class="clip phrase" data-start="16.11127252" data-duration="1.4607483100000032" data-layout-allow-caption-zone="true"><span>spiral menyentuh gabus.</span></div><div id="cap-014" class="clip phrase" data-start="18.06872917" data-duration="1.6405109499999995" data-layout-allow-caption-zone="true"><span>Ketika kepala diputar, spiral</span></div><div id="cap-015" class="clip phrase" data-start="19.70924012" data-duration="1.2033147799999995" data-layout-allow-caption-zone="true"><span>masuk semakin dalam.</span></div><div id="cap-016" class="clip phrase" data-start="20.9125549" data-duration="1.1262107599999993" data-layout-allow-caption-zone="true"><span>Batang tengah ikut bergerak</span></div><div id="cap-017" class="clip phrase" data-start="22.03876566" data-duration="0.6249635100000006" data-layout-allow-caption-zone="true"><span>turun.</span></div><div id="cap-018" class="clip phrase" data-start="23.25664583" data-duration="0.9804635799999986" data-layout-allow-caption-zone="true"><span>Lihat penampangnya.</span></div><div id="cap-019" class="clip phrase" data-start="24.23710941" data-duration="1.0785099300000027" data-layout-allow-caption-zone="true"><span>Spiral sudah tertanam di</span></div><div id="cap-020" class="clip phrase" data-start="25.31561934" data-duration="0.8603567899999973" data-layout-allow-caption-zone="true"><span>dalam gabus.</span></div><div id="cap-021" class="clip phrase" data-start="26.17597613" data-duration="1.231298840000001" data-layout-allow-caption-zone="true"><span>Sambungan ini nantinya membawa</span></div><div id="cap-022" class="clip phrase" data-start="27.40727497" data-duration="0.8843708600000006" data-layout-allow-caption-zone="true"><span>gabus naik.</span></div><div id="cap-023" class="clip phrase" data-start="28.88645833" data-duration="1.2125204099999998" data-layout-allow-caption-zone="true"><span>Batangnya tetap lewat lubang</span></div><div id="cap-024" class="clip phrase" data-start="30.09897874" data-duration="1.1678877599999993" data-layout-allow-caption-zone="true"><span>pemandu di badan alat.</span></div><div id="cap-025" class="clip phrase" data-start="31.2668665" data-duration="1.1240816299999992" data-layout-allow-caption-zone="true"><span>Jadi gerak turun ini</span></div><div id="cap-026" class="clip phrase" data-start="32.39094813" data-duration="1.4555102000000062" data-layout-allow-caption-zone="true"><span>mencapai bagian bergigi.</span></div><div id="cap-027" class="clip phrase" data-start="34.32816667" data-duration="1.252214760000001" data-layout-allow-caption-zone="true"><span>Alur batang mendorong gigi</span></div><div id="cap-028" class="clip phrase" data-start="35.58038143" data-duration="0.9885906099999957" data-layout-allow-caption-zone="true"><span>di kedua sisi.</span></div><div id="cap-029" class="clip phrase" data-start="36.56897204" data-duration="1.5158389200000002" data-layout-allow-caption-zone="true"><span>Gigi berputar bersama sayap,</span></div><div id="cap-030" class="clip phrase" data-start="38.08481096" data-duration="1.253355710000001" data-layout-allow-caption-zone="true"><span>mengelilingi porosnya.</span></div><div id="cap-031" class="clip phrase" data-start="39.9941875" data-duration="0.9303457099999974" data-layout-allow-caption-zone="true"><span>Alur di bagian ini</span></div><div id="cap-032" class="clip phrase" data-start="40.92453321" data-duration="1.461971830000003" data-layout-allow-caption-zone="true"><span>melingkari batang, berbeda dari</span></div><div id="cap-033" class="clip phrase" data-start="42.38650504" data-duration="1.2626120400000005" data-layout-allow-caption-zone="true"><span>spiral penusuk di bawah.</span></div><div id="cap-034" class="clip phrase" data-start="43.64911708" data-duration="1.6350704199999981" data-layout-allow-caption-zone="true"><span>Keduanya punya tugas berbeda.</span></div><div id="cap-035" class="clip phrase" data-start="45.90520833" data-duration="1.5560335199999997" data-layout-allow-caption-zone="true"><span>Sekarang sayap sudah terangkat.</span></div><div id="cap-036" class="clip phrase" data-start="47.46124185" data-duration="1.0824580999999966" data-layout-allow-caption-zone="true"><span>Poros masing-masing tetap</span></div><div id="cap-037" class="clip phrase" data-start="48.54369995" data-duration="1.623687150000002" data-layout-allow-caption-zone="true"><span>terpasang pada badan pembuka.</span></div><div id="cap-038" class="clip phrase" data-start="50.1673871" data-duration="1.0824581000000038" data-layout-allow-caption-zone="true"><span>Batang tengah masih bisa</span></div><div id="cap-039" class="clip phrase" data-start="51.2498452" data-duration="0.8103631299999989" data-layout-allow-caption-zone="true"><span>bergeser.</span></div><div id="cap-040" class="clip phrase" data-start="53.01604167" data-duration="1.5208115100000015" data-layout-allow-caption-zone="true"><span>Saat sayap ditekan, sektor</span></div><div id="cap-041" class="clip phrase" data-start="54.53685318" data-duration="1.1152617899999981" data-layout-allow-caption-zone="true"><span>giginya berputar ke arah</span></div><div id="cap-042" class="clip phrase" data-start="55.65211497" data-duration="0.811099470000002" data-layout-allow-caption-zone="true"><span>sebaliknya.</span></div><div id="cap-043" class="clip phrase" data-start="56.46321444" data-duration="1.4870157100000014" data-layout-allow-caption-zone="true"><span>Perhatikan titik pertemuannya:</span></div><div id="cap-044" class="clip phrase" data-start="57.95023015" data-duration="0.9786910999999989" data-layout-allow-caption-zone="true"><span>batang terdorong ke</span></div><div id="cap-045" class="clip phrase" data-start="59.13308355" data-duration="0.43795811999999756" data-layout-allow-caption-zone="true"><span>atas.</span></div><div id="cap-046" class="clip phrase" data-start="60.36066667" data-duration="1.2147169799999986" data-layout-allow-caption-zone="true"><span>Ujung sayap menjadi tempat</span></div><div id="cap-047" class="clip phrase" data-start="61.57538365" data-duration="0.6748427699999979" data-layout-allow-caption-zone="true"><span>menekan.</span></div><div id="cap-048" class="clip phrase" data-start="62.25022642" data-duration="1.2147169800000057" data-layout-allow-caption-zone="true"><span>Lengan yang panjang memutar</span></div><div id="cap-049" class="clip phrase" data-start="63.4649434" data-duration="1.01226415" data-layout-allow-caption-zone="true"><span>sektor bergigi yang lebih</span></div><div id="cap-050" class="clip phrase" data-start="64.47720755" data-duration="1.348459119999987" data-layout-allow-caption-zone="true"><span>kecil di dekat poros.</span></div><div id="cap-051" class="clip phrase" data-start="66.5821875" data-duration="1.3713353999999924" data-layout-allow-caption-zone="true"><span>Badan pembuka tetap bertumpu</span></div><div id="cap-052" class="clip phrase" data-start="67.9535229" data-duration="1.0368633599999981" data-layout-allow-caption-zone="true"><span>pada bibir botol.</span></div><div id="cap-053" class="clip phrase" data-start="68.99038626" data-duration="1.137204969999999" data-layout-allow-caption-zone="true"><span>Jadi batang bisa naik</span></div><div id="cap-054" class="clip phrase" data-start="70.12759123" data-duration="1.2372049700000076" data-layout-allow-caption-zone="true"><span>relatif terhadap botol yang</span></div><div id="cap-055" class="clip phrase" data-start="71.36513781" data-duration="0.7020496899999955" data-layout-allow-caption-zone="true"><span>ditahan.</span></div><div id="cap-056" class="clip phrase" data-start="72.577" data-duration="1.4819631900000019" data-layout-allow-caption-zone="true"><span>Karena spiral masih tertanam,</span></div><div id="cap-057" class="clip phrase" data-start="74.05896319" data-duration="1.212515339999996" data-layout-allow-caption-zone="true"><span>gabus ikut tertarik.</span></div><div id="cap-058" class="clip phrase" data-start="75.27147853" data-duration="1.4146012200000087" data-layout-allow-caption-zone="true"><span>Gerak gigi diteruskan sepanjang</span></div><div id="cap-059" class="clip phrase" data-start="76.68607975" data-duration="1.4809202499999827" data-layout-allow-caption-zone="true"><span>batang hingga ke gabus.</span></div><div id="cap-060" class="clip phrase" data-start="78.57370833" data-duration="1.2073943699999887" data-layout-allow-caption-zone="true"><span>Saat gabus melewati bibir</span></div><div id="cap-061" class="clip phrase" data-start="79.81138439" data-duration="1.3353873199999953" data-layout-allow-caption-zone="true"><span>botol, hasil rangkaian gerak</span></div><div id="cap-062" class="clip phrase" data-start="81.14677171" data-duration="1.4005281700000012" data-layout-allow-caption-zone="true"><span>tadi terlihat: gabus sudah</span></div><div id="cap-063" class="clip phrase" data-start="82.54729988" data-duration="0.7514084499999996" data-layout-allow-caption-zone="true"><span>terangkat.</span></div><div id="cap-064" class="clip phrase" data-start="83.93472917" data-duration="1.5521383600000007" data-layout-allow-caption-zone="true"><span>Jadi, sayap turun memutar</span></div><div id="cap-065" class="clip phrase" data-start="85.48686753" data-duration="0.6411006299999968" data-layout-allow-caption-zone="true"><span>gigi.</span></div><div id="cap-066" class="clip phrase" data-start="86.12796816" data-duration="1.282201260000008" data-layout-allow-caption-zone="true"><span>Gigi menaikkan batang.</span></div><div id="cap-067" class="clip phrase" data-start="87.41016942" data-duration="1.2822012599999937" data-layout-allow-caption-zone="true"><span>Dan spiral membawa gabus</span></div><div id="cap-068" class="clip phrase" data-start="88.69237068" data-duration="0.7073584900000043" data-layout-allow-caption-zone="true"><span>keluar.</span></div></div><script>window.__timelines=window.__timelines||{};window.__timelines.captions=gsap.timeline({paused:true});</script></template>
