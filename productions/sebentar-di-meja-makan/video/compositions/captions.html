<template><style>@font-face{font-family:'DM Sans';src:url('assets/fonts/dm-sans.ttf')}#root{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none;font-family:'DM Sans',sans-serif}.caption-group{position:absolute;left:88px;top:1550px;width:848px;min-height:115px;text-align:center;font:500 46px/1.25 'DM Sans',sans-serif;overflow:visible}</style><div id="root" data-composition-id="captions" data-width="1080" data-height="1920" data-duration="90.03333333333333"><div id="caption-000" class="clip caption-group" data-start="0.245" data-duration="2.8107142899999999" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Sebentar, katanya sambil lihat HP.</div><div id="caption-001" class="clip caption-group" data-start="3.2307142899999999" data-duration="1.2964285699999998" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kenapa cerita lo jadi berhenti</div><div id="caption-002" class="clip caption-group" data-start="4.5271428599999997" data-duration="1.0428571399999997" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">di meja makan?</div><div id="caption-003" class="clip caption-group" data-start="6.3470624999999998" data-duration="2.0910638299999995" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Ada konsep partner phubbing, atau</div><div id="caption-004" class="clip caption-group" data-start="8.4381263299999993" data-duration="1.4189361700000003" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">mengabaikan pasangan karena</div><div id="caption-005" class="clip caption-group" data-start="9.8570624999999996" data-duration="1.8550000000000004" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">perhatian beralih ke ponsel.</div><div id="caption-006" class="clip caption-group" data-start="12.479125" data-duration="1.7556755499999994" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Ini membahas saat HP menyela</div><div id="caption-007" class="clip caption-group" data-start="14.24768751" data-duration="1.1664986899999992" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">interaksi yang sedang kalian</div><div id="caption-008" class="clip caption-group" data-start="15.4141862" data-duration="1.0849388000000033" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">jalani bersama.</div><div id="caption-009" class="clip caption-group" data-start="17.2011875" data-duration="1.689681740000001" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Misalnya, lo lagi cerita soal</div><div id="caption-010" class="clip caption-group" data-start="18.890869240000001" data-duration="1.2488951899999989" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">kejadian di kantor.</div><div id="caption-011" class="clip caption-group" data-start="20.13976443" data-duration="1.6914230700000026" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Dia membuka notifikasi.</div><div id="caption-012" class="clip caption-group" data-start="22.603249999999999" data-duration="1.152148020000002" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Terus, katanya.</div><div id="caption-013" class="clip caption-group" data-start="23.755398020000001" data-duration="1.5079989999999981" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Tapi lo harus mengulang bagian</div><div id="caption-014" class="clip caption-group" data-start="25.263397019999999" data-duration="1.1298529800000026" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">yang barusan lewat.</div><div id="caption-015" class="clip caption-group" data-start="27.185312499999998" data-duration="1.5662051900000016" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Di sini, yang terlihat adalah</div><div id="caption-016" class="clip caption-group" data-start="28.75151769" data-duration="1.707237880000001" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">cerita terputus dan perhatian yang</div><div id="caption-017" class="clip caption-group" data-start="30.458755570000001" data-duration="0.94155693000000085" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">berpindah.</div><div id="caption-018" class="clip caption-group" data-start="32.162374999999997" data-duration="1.5146850900000004" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Dari situ, lo mungkin merasa</div><div id="caption-019" class="clip caption-group" data-start="33.677060089999998" data-duration="1.9703149100000061" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">obrolan ini kurang mendapat ruang.</div><div id="caption-020" class="clip caption-group" data-start="36.587958329999999" data-duration="1.7847358200000016" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">Perasaan itu perlu didengar.</div><div id="caption-021" class="clip caption-group" data-start="38.372694150000001" data-duration="2.1152641799999969" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">Niat dia tetap perlu ditanyakan.</div><div id="caption-022" class="clip caption-group" data-start="41.38354167" data-duration="1.5118110200000032" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Satu adegan belum menjelaskan</div><div id="caption-023" class="clip caption-group" data-start="42.895352690000003" data-duration="1.0070866100000018" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">kenapa dia membuka</div><div id="caption-024" class="clip caption-group" data-start="44.02921096" data-duration="2.2543307099999979" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">HP, apalagi kadar sayangnya.</div><div id="caption-025" class="clip caption-group" data-start="47.264125" data-duration="1.3018898899999982" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kalau ada pesan mendesak,</div><div id="caption-026" class="clip caption-group" data-start="48.566014889999998" data-duration="1.9403903100000051" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">kebutuhan itu bisa disampaikan,</div><div id="caption-027" class="clip caption-group" data-start="50.506405200000003" data-duration="1.6823705799999971" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">supaya kalian tahu percakapannya</div><div id="caption-028" class="clip caption-group" data-start="52.20364842" data-duration="0.98547658000000382" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">sedang dijeda.</div><div id="caption-029" class="clip caption-group" data-start="54.12970833" data-duration="0.84857678000000192" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Coba bilang:</div><div id="caption-030" class="clip caption-group" data-start="54.978285110000002" data-duration="1.3715695200000013" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">gua pengin selesai cerita.</div><div id="caption-031" class="clip caption-group" data-start="56.349854630000003" data-duration="1.1479643899999985" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Bisa taruh HP dulu selama</div><div id="caption-032" class="clip caption-group" data-start="57.497819020000001" data-duration="0.85688930999999968" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">kita makan?</div><div id="caption-033" class="clip caption-group" data-start="59.056770829999998" data-duration="1.3900191200000052" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kalau dia perlu membalas:</div><div id="caption-034" class="clip caption-group" data-start="60.446789950000003" data-duration="1.4402379499999967" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">gua jawab pesan ini sebentar,</div><div id="caption-035" class="clip caption-group" data-start="61.8870279" data-duration="1.7297429300000005" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">habis itu gua dengerin lagi.</div><div id="caption-036" class="clip caption-group" data-start="64.343833329999995" data-duration="1.0256669299999999" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">Lalu lakukan:</div><div id="caption-037" class="clip caption-group" data-start="65.369500259999995" data-duration="2.3488555699999978" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">ponsel ditaruh, perhatian kembali,</div><div id="caption-038" class="clip caption-group" data-start="67.718355829999993" data-duration="1.6659037099999949" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">dan ceritanya dilanjutkan dari</div><div id="caption-039" class="clip caption-group" data-start="69.401702319999998" data-duration="1.2421310099999943" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">bagian yang tertinggal.</div><div id="caption-040" class="clip caption-group" data-start="71.285895830000001" data-duration="1.603043679999999" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kesepakatan ini memberi tempat</div><div id="caption-041" class="clip caption-group" data-start="72.88893951" data-duration="1.9589575400000001" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">buat kebutuhan komunikasi kalian.</div><div id="caption-042" class="clip caption-group" data-start="74.84789705" data-duration="1.4761360499999938" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kalian juga boleh menyepakati</div><div id="caption-043" class="clip caption-group" data-start="76.324033099999994" data-duration="1.3318627299999974" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">kapan perlu jeda.</div><div id="caption-044" class="clip caption-group" data-start="78.327958330000001" data-duration="1.7990255299999944" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Jadi, cerita yang berhenti tadi</div><div id="caption-045" class="clip caption-group" data-start="80.126983859999996" data-duration="1.7224712600000061" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">bisa dibuka lagi lewat permintaan</div><div id="caption-046" class="clip caption-group" data-start="81.849455120000002" data-duration="1.4885032099999904" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">perhatian yang jelas.</div><div id="caption-047" class="clip caption-group" data-start="84.050020829999994" data-duration="1.9901818200000037" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Saat makan berdua, kapan kita</div><div id="caption-048" class="clip caption-group" data-start="86.040202649999998" data-duration="1.505075000000005" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">benar-benar tersedia buat saling</div><div id="caption-049" class="clip caption-group" data-start="87.545277650000003" data-duration="0.81474317999999357" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">mendengar?</div></div><script>const tl=gsap.timeline({paused:true});tl.to({},{duration:90.03333333333333},0);window.__timelines.captions=tl;</script></template>
