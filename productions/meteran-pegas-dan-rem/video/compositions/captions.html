<template><style>@font-face{font-family:Manrope;src:url('assets/fonts/manrope.ttf');font-weight:200 800}@font-face{font-family:Plex;src:url('assets/fonts/ibm-plex-mono.ttf')}*{box-sizing:border-box}#root{position:absolute;inset:0;color:#172B3B;font-family:Manrope,sans-serif}.scene{position:absolute;inset:0;background:#ECEEE9}.title{position:absolute;left:108px;top:205px;width:810px;font:800 70px/1.1 Manrope,sans-serif;letter-spacing:-2.5px;margin:0}.stage{position:absolute;left:80px;top:430px;width:920px;height:980px}.stage svg{width:100%;height:100%;overflow:hidden}.note{position:absolute;left:108px;top:1420px;width:810px;font:28px/1.25 Plex,monospace;color:#536775}.pose-caption{position:absolute;left:108px;top:1500px;width:848px;text-align:center;font:600 46px/1.3 Manrope,sans-serif}.pose-caption span{display:inline-block;max-width:848px;background:#F8F9F5;padding:18px 26px;border-radius:14px}.edge{stroke:#172B3B;stroke-width:2.5;stroke-linejoin:round}.fine{stroke:#536775;stroke-width:1.5;fill:none}.leader{stroke:#536775;stroke-width:2;fill:none}.anno{font-family:Manrope,sans-serif;font-weight:600;fill:#172B3B}.direction{stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}.phrase{position:absolute;left:108px;top:1500px;width:848px;text-align:center;font:600 46px/1.3 Manrope,sans-serif}.phrase span{display:inline-block;max-width:848px;background:#F8F9F5;padding:18px 26px;border-radius:14px}</style><div id="root" data-composition-id="captions" data-width="1080" data-height="1920"><div id="cap-000" class="clip phrase" data-start="0.285" data-duration="1.3004457500000002" data-layout-allow-caption-zone="true"><span>Pita meteran ditarik, lalu</span></div><div id="cap-001" class="clip phrase" data-start="1.58544575" data-duration="0.8409067699999999" data-layout-allow-caption-zone="true"><span>kembali sendiri.</span></div><div id="cap-002" class="clip phrase" data-start="2.51157922" data-duration="1.2731023900000005" data-layout-allow-caption-zone="true"><span>Tapi saat tombol dikunci,</span></div><div id="cap-003" class="clip phrase" data-start="3.80816607" data-duration="1.1218339299999998" data-layout-allow-caption-zone="true"><span>kenapa pitanya bisa diam?</span></div><div id="cap-004" class="clip phrase" data-start="5.4085625" data-duration="0.9187051399999993" data-layout-allow-caption-zone="true"><span>Di dalamnya ada gulungan</span></div><div id="cap-005" class="clip phrase" data-start="6.32726764" data-duration="1.5216053900000004" data-layout-allow-caption-zone="true"><span>pita dan pegas pengembali.</span></div><div id="cap-006" class="clip phrase" data-start="7.84887303" data-duration="1.5790244599999994" data-layout-allow-caption-zone="true"><span>Keduanya terhubung, tetapi bukan</span></div><div id="cap-007" class="clip phrase" data-start="9.42789749" data-duration="0.980665010000001" data-layout-allow-caption-zone="true"><span>bagian yang sama.</span></div><div id="cap-008" class="clip phrase" data-start="11.0583125" data-duration="0.8553791400000001" data-layout-allow-caption-zone="true"><span>Kita mulai saat pita</span></div><div id="cap-009" class="clip phrase" data-start="11.91369164" data-duration="0.6435160700000004" data-layout-allow-caption-zone="true"><span>ditarik.</span></div><div id="cap-010" class="clip phrase" data-start="12.55720771" data-duration="1.4607022099999991" data-layout-allow-caption-zone="true"><span>Pita terurai, sehingga gulungannya</span></div><div id="cap-011" class="clip phrase" data-start="14.01790992" data-duration="1.4454025799999997" data-layout-allow-caption-zone="true"><span>ikut berputar pada poros.</span></div><div id="cap-012" class="clip phrase" data-start="15.926875" data-duration="0.9583740699999996" data-layout-allow-caption-zone="true"><span>Pegas pipih terhubung ke</span></div><div id="cap-013" class="clip phrase" data-start="16.88524907" data-duration="1.1438894799999986" data-layout-allow-caption-zone="true"><span>bagian berputar dan tumpuan</span></div><div id="cap-014" class="clip phrase" data-start="18.02913855" data-duration="0.5572794900000027" data-layout-allow-caption-zone="true"><span>tetap.</span></div><div id="cap-015" class="clip phrase" data-start="18.58641804" data-duration="1.3785334699999972" data-layout-allow-caption-zone="true"><span>Jadi, tarikan pita mengubah</span></div><div id="cap-016" class="clip phrase" data-start="19.96495151" data-duration="0.8919234900000035" data-layout-allow-caption-zone="true"><span>bentuk pegas.</span></div><div id="cap-017" class="clip phrase" data-start="21.35852083" data-duration="1.1109090899999998" data-layout-allow-caption-zone="true"><span>Pegas menyimpan energi dari</span></div><div id="cap-018" class="clip phrase" data-start="22.46942992" data-duration="0.8737727299999989" data-layout-allow-caption-zone="true"><span>tarikan tadi.</span></div><div id="cap-019" class="clip phrase" data-start="23.34320265" data-duration="1.0062272700000001" data-layout-allow-caption-zone="true"><span>Energi inilah yang nantinya</span></div><div id="cap-020" class="clip phrase" data-start="24.34942992" data-duration="0.968484850000003" data-layout-allow-caption-zone="true"><span>memutar gulungan ke arah</span></div><div id="cap-021" class="clip phrase" data-start="25.31791477" data-duration="0.8406060599999989" data-layout-allow-caption-zone="true"><span>sebaliknya.</span></div><div id="cap-022" class="clip phrase" data-start="26.79135417" data-duration="1.218823529999998" data-layout-allow-caption-zone="true"><span>Saat tarikan dilepas, pegas</span></div><div id="cap-023" class="clip phrase" data-start="28.0101777" data-duration="0.7384313700000007" data-layout-allow-caption-zone="true"><span>menggerakkan gulungan</span></div><div id="cap-024" class="clip phrase" data-start="28.8611777" data-duration="0.48390196000000074" data-layout-allow-caption-zone="true"><span>kembali.</span></div><div id="cap-025" class="clip phrase" data-start="29.34507966" data-duration="0.8996078400000016" data-layout-allow-caption-zone="true"><span>Pita pun tergulung masuk</span></div><div id="cap-026" class="clip phrase" data-start="30.2446875" data-duration="1.0866666699999996" data-layout-allow-caption-zone="true"><span>ke dalam rumahnya.</span></div><div id="cap-027" class="clip phrase" data-start="31.93110417" data-duration="1.6436810999999985" data-layout-allow-caption-zone="true"><span>Lalu bagaimana tombol menahannya?</span></div><div id="cap-028" class="clip phrase" data-start="33.57478527" data-duration="0.9368910600000007" data-layout-allow-caption-zone="true"><span>Kita lihat contoh meteran</span></div><div id="cap-029" class="clip phrase" data-start="34.51167633" data-duration="0.9462097999999983" data-layout-allow-caption-zone="true"><span>dengan pengunci geser dan</span></div><div id="cap-030" class="clip phrase" data-start="35.45788613" data-duration="0.47274931000000464" data-layout-allow-caption-zone="true"><span>lidah lentur</span></div><div id="cap-031" class="clip phrase" data-start="36.08869266" data-duration="0.3774115100000017" data-layout-allow-caption-zone="true"><span>ini.</span></div><div id="cap-032" class="clip phrase" data-start="37.02275" data-duration="0.9443878199999958" data-layout-allow-caption-zone="true"><span>Tombol luar terhubung ke</span></div><div id="cap-033" class="clip phrase" data-start="37.96713782" data-duration="0.9826835799999998" data-layout-allow-caption-zone="true"><span>pengunci di dalam.</span></div><div id="cap-034" class="clip phrase" data-start="38.9498214" data-duration="1.271708150000002" data-layout-allow-caption-zone="true"><span>Saat digeser, bagian bawah</span></div><div id="cap-035" class="clip phrase" data-start="40.22152955" data-duration="1.5162204499999987" data-layout-allow-caption-zone="true"><span>pengunci turun mendekati pita.</span></div><div id="cap-036" class="clip phrase" data-start="42.39866667" data-duration="1.0139393900000044" data-layout-allow-caption-zone="true"><span>Dua pin kecil mengikuti</span></div><div id="cap-037" class="clip phrase" data-start="43.41260606" data-duration="1.2167272699999998" data-layout-allow-caption-zone="true"><span>jalur di rumah meteran.</span></div><div id="cap-038" class="clip phrase" data-start="44.62933333" data-duration="1.0718787899999995" data-layout-allow-caption-zone="true"><span>Jalur ini mengarahkan ujung</span></div><div id="cap-039" class="clip phrase" data-start="45.70121212" data-duration="1.5774545499999988" data-layout-allow-caption-zone="true"><span>lidah menuju permukaan pita.</span></div><div id="cap-040" class="clip phrase" data-start="47.96958333" data-duration="1.4518173100000027" data-layout-allow-caption-zone="true"><span>Mula-mula, ujung lidah menyentuh</span></div><div id="cap-041" class="clip phrase" data-start="49.42140064" data-duration="0.5787014599999978" data-layout-allow-caption-zone="true"><span>pita.</span></div><div id="cap-042" class="clip phrase" data-start="50.0001021" data-duration="0.7523119100000031" data-layout-allow-caption-zone="true"><span>Di bawah pita ada</span></div><div id="cap-043" class="clip phrase" data-start="50.75241401" data-duration="0.983792489999999" data-layout-allow-caption-zone="true"><span>penopang yang menjadi lawan</span></div><div id="cap-044" class="clip phrase" data-start="51.7362065" data-duration="0.8233768300000008" data-layout-allow-caption-zone="true"><span>tekanannya.</span></div><div id="cap-045" class="clip phrase" data-start="53.59025" data-duration="1.1245685300000048" data-layout-allow-caption-zone="true"><span>Dorongan dilanjutkan.</span></div><div id="cap-046" class="clip phrase" data-start="54.71481853" data-duration="1.2429441600000004" data-layout-allow-caption-zone="true"><span>Pin melewati tonjolan kecil,</span></div><div id="cap-047" class="clip phrase" data-start="55.95776269" data-duration="0.8878172599999985" data-layout-allow-caption-zone="true"><span>lalu masuk ke permukaan</span></div><div id="cap-048" class="clip phrase" data-start="56.84557995" data-duration="0.6510659899999993" data-layout-allow-caption-zone="true"><span>penahan.</span></div><div id="cap-049" class="clip phrase" data-start="57.49664594" data-duration="1.0357867999999968" data-layout-allow-caption-zone="true"><span>Gerakan ini membuat lidah</span></div><div id="cap-050" class="clip phrase" data-start="58.53243274" data-duration="0.987817260000007" data-layout-allow-caption-zone="true"><span>makin melentur.</span></div><div id="cap-051" class="clip phrase" data-start="60.38472917" data-duration="1.0967391300000031" data-layout-allow-caption-zone="true"><span>Lidah yang melentur menekan</span></div><div id="cap-052" class="clip phrase" data-start="61.4814683" data-duration="1.096739129999996" data-layout-allow-caption-zone="true"><span>pita ke penopangnya.</span></div><div id="cap-053" class="clip phrase" data-start="62.57820743" data-duration="1.1670975299999995" data-layout-allow-caption-zone="true"><span>Jepitan ini menahan pita</span></div><div id="cap-054" class="clip phrase" data-start="63.76387135" data-duration="0.94853114" data-layout-allow-caption-zone="true"><span>agar tidak ditarik kembali</span></div><div id="cap-055" class="clip phrase" data-start="64.71240249" data-duration="0.8173266799999936" data-layout-allow-caption-zone="true"><span>oleh pegas.</span></div><div id="cap-056" class="clip phrase" data-start="66.256125" data-duration="1.420235290000008" data-layout-allow-caption-zone="true"><span>Jadi, pegasnya tetap memberi</span></div><div id="cap-057" class="clip phrase" data-start="67.67636029" data-duration="0.6509411799999896" data-layout-allow-caption-zone="true"><span>tarikan.</span></div><div id="cap-058" class="clip phrase" data-start="68.32730147" data-duration="1.3610588200000109" data-layout-allow-caption-zone="true"><span>Penguncilah yang menahan gerakan,</span></div><div id="cap-059" class="clip phrase" data-start="69.68836029" data-duration="1.697764709999987" data-layout-allow-caption-zone="true"><span>selama jepitannya masih bekerja.</span></div><div id="cap-060" class="clip phrase" data-start="71.920875" data-duration="1.2539306400000072" data-layout-allow-caption-zone="true"><span>Saat tombol digeser kembali,</span></div><div id="cap-061" class="clip phrase" data-start="73.17480564" data-duration="0.8956647400000008" data-layout-allow-caption-zone="true"><span>pin keluar dari posisi</span></div><div id="cap-062" class="clip phrase" data-start="74.07047038" data-duration="0.6568207999999913" data-layout-allow-caption-zone="true"><span>penahan.</span></div><div id="cap-063" class="clip phrase" data-start="74.72729118" data-duration="1.2240751500000044" data-layout-allow-caption-zone="true"><span>Lidah terangkat, dan jepitan</span></div><div id="cap-064" class="clip phrase" data-start="75.95136633" data-duration="1.2345086699999968" data-layout-allow-caption-zone="true"><span>pada pita terlepas.</span></div><div id="cap-065" class="clip phrase" data-start="77.63752083" data-duration="1.2240000000000038" data-layout-allow-caption-zone="true"><span>Sekarang pegas bisa memutar</span></div><div id="cap-066" class="clip phrase" data-start="78.86152083" data-duration="0.8160000000000025" data-layout-allow-caption-zone="true"><span>gulungan lagi.</span></div><div id="cap-067" class="clip phrase" data-start="79.67752083" data-duration="1.3405714299999971" data-layout-allow-caption-zone="true"><span>Pita bergerak masuk, sementara</span></div><div id="cap-068" class="clip phrase" data-start="81.01809226" data-duration="1.0491428600000035" data-layout-allow-caption-zone="true"><span>pengunci tetap menjauh dari</span></div><div id="cap-069" class="clip phrase" data-start="82.06723512" data-duration="0.7702857099999818" data-layout-allow-caption-zone="true"><span>jalurnya.</span></div><div id="cap-070" class="clip phrase" data-start="83.4184375" data-duration="1.4620408199999986" data-layout-allow-caption-zone="true"><span>Jadi, yang mengembalikan pita</span></div><div id="cap-071" class="clip phrase" data-start="84.88047832" data-duration="0.8528571400000118" data-layout-allow-caption-zone="true"><span>adalah pegas.</span></div><div id="cap-072" class="clip phrase" data-start="85.73333546" data-duration="1.0965306099999879" data-layout-allow-caption-zone="true"><span>Yang membuatnya diam adalah</span></div><div id="cap-073" class="clip phrase" data-start="86.82986607" data-duration="1.0356122499999998" data-layout-allow-caption-zone="true"><span>jepitan pengunci.</span></div><div id="cap-074" class="clip phrase" data-start="87.86547832" data-duration="1.6229591799999952" data-layout-allow-caption-zone="true"><span>Tombolnya mengatur jepitan itu.</span></div></div><script>window.__timelines=window.__timelines||{};window.__timelines.captions=gsap.timeline({paused:true});</script></template>
