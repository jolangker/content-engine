<template><style>@font-face{font-family:Manrope;src:url('assets/fonts/manrope.ttf');font-weight:200 800}@font-face{font-family:Plex;src:url('assets/fonts/ibm-plex-mono.ttf')}*{box-sizing:border-box}#root{position:absolute;inset:0;color:#172B3B;font-family:Manrope,sans-serif}.scene{position:absolute;inset:0;background:#ECEEE9}.title{position:absolute;left:108px;top:205px;width:800px;margin:0;font-size:72px;line-height:1.1;font-weight:800;letter-spacing:-3px}.stage{position:absolute;left:90px;top:470px;width:900px;height:900px}.stage svg{width:100%;height:100%;overflow:hidden}.note{position:absolute;left:108px;top:1380px;width:810px;font:28px/1.35 Plex,monospace;color:#536775}.pose-caption{position:absolute;left:108px;top:1500px;width:848px;text-align:center;font:600 46px/1.3 Manrope,sans-serif}.pose-caption span{display:inline-block;background:#F8F9F5;padding:18px 26px;border-radius:14px;max-width:848px}svg .edge{stroke:#172B3B;stroke-width:2.5;stroke-linejoin:round}svg .label{font:28px Manrope,sans-serif;fill:#172B3B}svg .leader{fill:none;stroke:#536775;stroke-width:2}svg .arrow{fill:none;stroke:#C94422;stroke-width:6;stroke-linecap:round}</style><div data-hf-id="hf-r1uf" id="root" data-composition-id="s14-bearing" data-width="1080" data-height="1920" data-duration="7.200000000000"><div data-hf-id="hf-wua0" class="scene"><h1 data-hf-id="hf-xo5t" class="title" data-var-text="s14-bearing-title">Bantalan memberi jalan putar</h1><div data-hf-id="hf-tan6" class="stage"><svg data-hf-id="hf-pw9k" viewBox="-225 -225 450 450" aria-label="Bearing supports rotation; it is distinct from the pawl clutch."><defs data-hf-id="hf-mh0t"><linearGradient data-hf-id="hf-yrij" id="s14-bearing-metal" x1="0" y1="0" x2=".8" y2="1"><stop data-hf-id="hf-551u" stop-color="#F8F9F5"/><stop data-hf-id="hf-rqxj" offset=".45" stop-color="#BAC8CE"/><stop data-hf-id="hf-n3i7" offset="1" stop-color="#748B98"/></linearGradient><linearGradient data-hf-id="hf-fabf" id="s14-bearing-blue"><stop data-hf-id="hf-zbh9" stop-color="#8CB5E6"/><stop data-hf-id="hf-8s2l" offset=".55" stop-color="#2459C4"/><stop data-hf-id="hf-jlmn" offset="1" stop-color="#173F83"/></linearGradient><linearGradient data-hf-id="hf-1xie" id="s14-bearing-orange" x1="0" y1="0" x2="0" y2="1"><stop data-hf-id="hf-6r9v" stop-color="#E4A281"/><stop data-hf-id="hf-ym9c" offset=".6" stop-color="#C94422"/><stop data-hf-id="hf-h0vt" offset="1" stop-color="#8A301E"/></linearGradient><linearGradient data-hf-id="hf-jm4f" id="s14-bearing-teal" x1="0" y1="0" x2="1" y2="1"><stop data-hf-id="hf-yqw0" stop-color="#A2C9C8"/><stop data-hf-id="hf-nd8p" offset=".55" stop-color="#4F9398"/><stop data-hf-id="hf-ojea" offset="1" stop-color="#167580"/></linearGradient><marker data-hf-id="hf-u2rd" id="s14-bearing-arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path data-hf-id="hf-eql0" d="M0 0L7 3L0 6Z" fill="#C94422"/></marker></defs><path data-hf-id="hf-u5vd" d="M-325 0H325" stroke="#536775" stroke-width="31"/><path data-hf-id="hf-fu0k" d="M-325 -9H325" stroke="#DCE5E3" stroke-width="10"/><circle data-hf-id="hf-26cx" cy="15" r="190" fill="#456C77" class="edge"/><circle data-hf-id="hf-8lwq" r="190" fill="url(#s14-bearing-teal)" class="edge"/><circle data-hf-id="hf-oos2" r="155" fill="url(#s14-bearing-metal)" class="edge"/><circle data-hf-id="hf-n5bq" r="133" fill="#536775"/><g data-hf-id="hf-1ox1" id="s14-bearing-balls"><circle data-hf-id="hf-at2i" cx="115.00" cy="0.00" r="21" fill="url(#s14-bearing-metal)" class="edge"/><circle data-hf-id="hf-8uok" cx="93.04" cy="67.60" r="21" fill="url(#s14-bearing-metal)" class="edge"/><circle data-hf-id="hf-91om" cx="35.54" cy="109.37" r="21" fill="url(#s14-bearing-metal)" class="edge"/><circle data-hf-id="hf-9jx5" cx="-35.54" cy="109.37" r="21" fill="url(#s14-bearing-metal)" class="edge"/><circle data-hf-id="hf-3pq9" cx="-93.04" cy="67.60" r="21" fill="url(#s14-bearing-metal)" class="edge"/><circle data-hf-id="hf-oj0z" cx="-115.00" cy="0.00" r="21" fill="url(#s14-bearing-metal)" class="edge"/><circle data-hf-id="hf-sb62" cx="-93.04" cy="-67.60" r="21" fill="url(#s14-bearing-metal)" class="edge"/><circle data-hf-id="hf-fr3q" cx="-35.54" cy="-109.37" r="21" fill="url(#s14-bearing-metal)" class="edge"/><circle data-hf-id="hf-u29v" cx="35.54" cy="-109.37" r="21" fill="url(#s14-bearing-metal)" class="edge"/><circle data-hf-id="hf-a419" cx="93.04" cy="-67.60" r="21" fill="url(#s14-bearing-metal)" class="edge"/></g><circle data-hf-id="hf-r12b" r="88" fill="url(#s14-bearing-metal)" class="edge"/><circle data-hf-id="hf-rhcd" r="40" fill="#536775" class="edge"/><path data-hf-id="hf-rv7o" d="M-28 -9H28V9H-28Z" fill="#DCE5E3"/></svg></div><div data-hf-id="hf-teiq" class="note">Bantalan dan pengait punya tugas berbeda</div></div></div><script>const id="s14-bearing",key="bearing",duration=7.200000000000;

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*clamp(t);
function polarTip(alpha){const a=alpha*Math.PI/180;return {x:185+65*Math.cos(a)-50*Math.sin(a),y:-50+65*Math.sin(a)+50*Math.cos(a)}}
function toothRadius(angle){const p=((angle%20)+20)%20;return p<18?230+28*p/18:258;}
function gap(alpha,relative){const p=polarTip(alpha),a=Math.atan2(p.y,p.x)*180/Math.PI;return toothRadius(a-relative)-Math.hypot(p.x,p.y);}
function pawlAngle(relative){if(gap(0,relative)>=0)return 0;let last=0;for(let a=.1;a<=42;a+=.1){if(gap(a,relative)>=0){let l=last,h=a;for(let j=0;j<16;j++){let m=(l+h)/2;if(gap(m,relative)>=0)h=m;else l=m;}return h;}last=a;}return 42;}
function state(u){
 let input=0,output=0,alpha=null;
 if(key==='mystery'||key==='answer'){output=u*88;}
 if(key==='independent'){input=0;output=u*48;}
 if(key==='input'){input=lerp(0,44,(u-.13)/.7);output=input;}
 if(key==='inside'){input=0;output=1;}
 if(key==='spring'){output=18;alpha=lerp(27,0,(u-.18)/.48);}
 if(key==='approach'){output=0;input=lerp(-9,-4,(u-.12)/.6);}
 if(key==='contact'){input=lerp(-4,0,(u-.1)/.24);output=0;if(u>.42){input=output=lerp(0,9,(u-.42)/.37);}}
 if(key==='drive'){input=output=lerp(9,71,(u-.12)/.78);}
 if(key==='stop'){input=26*Math.min(u,.32)/.32;output=u*78;}
 if(key==='overtake'){input=0;output=lerp(1,34,(u-.08)/.78);}
 if(key==='ramp'){input=0;output=lerp(2,16.5,(u-.15)/.65);}
 if(key==='reset'){input=0;output=lerp(16.5,22.5,(u-.15)/.65);}
 if(key==='clicks'){input=0;output=1+u*99;}
 if(key==='resume'){output=0;input=lerp(-7,0,(u-.12)/.44);if(u>.67)input=output=lerp(0,9,(u-.67)/.22);}
 if(alpha===null){const r=output-input;alpha=Math.abs(r)<.00001?0:pawlAngle(r);const phase=((r%20)+20)%20;if(r>0&&phase>0&&phase<2&&['ramp','reset','clicks','overtake','independent','answer'].includes(key))alpha=Math.max(alpha,pawlAngle(19.999)*(1-phase/2));}
 if(!['spring'].includes(key)&&Math.abs(output-input)>.00001&&gap(alpha,output-input)<0){let start=alpha;for(let q=start;q<=42;q+=.03){if(gap(q,output-input)>=0){alpha=q;break;}}}
 return {input,output,alpha,relative:output-input,gap:gap(alpha,output-input)};
}
const el=name=>document.getElementById(id+'-'+name);
const rot=(name,a)=>{const e=el(name);if(e)e.setAttribute('transform','rotate('+a+')');};
function renderAt(t){const u=clamp(t/duration),s=state(u);
 rot('output',s.output);rot('input',s.input);
 for(let k=0;k<2;k++){rot('pawl'+k,s.alpha);const spring=el('spring'+k);if(spring){const p=polarTip(s.alpha);spring.setAttribute('d','M-18 32Q-3 '+(8+s.alpha*.4)+' '+((p.x-185)*.44)+' '+((p.y+50)*.44));}}
 const c=el('contact');if(c){const a=s.input*Math.PI/180,p=polarTip(s.alpha);c.setAttribute('cx',p.x*Math.cos(a)-p.y*Math.sin(a));c.setAttribute('cy',p.x*Math.sin(a)+p.y*Math.cos(a));c.setAttribute('opacity',key==='contact'||key==='resume'?(u>.34&&u<.9?1:0):0);}
 rot('wheel0',s.output);rot('wheel1',s.output);
 const crank=el('crank');if(crank)crank.setAttribute('transform','translate(461 470) rotate('+s.input+')');
 const chain=el('chain');if(chain)chain.setAttribute('stroke-dashoffset',-s.input*2);
 const sm=el('spoke-mark');if(sm)sm.setAttribute('transform','rotate('+s.input+' 290 420)');
 const shellmark=el('shell-mark');if(shellmark){shellmark.setAttribute('cx',560+66*Math.sin(s.output*Math.PI/180));shellmark.setAttribute('cy',420-166*Math.cos(s.output*Math.PI/180));}
 rot('balls',u*100);window.__mechanism=Object.assign({scene:id,time:t},s);
}

const clock={t:0},tl=gsap.timeline({paused:true});tl.to(clock,{t:duration,duration:duration,ease:'none',onUpdate:()=>renderAt(clock.t)},0);renderAt(0);window.__timelines[id]=tl;</script></template>
