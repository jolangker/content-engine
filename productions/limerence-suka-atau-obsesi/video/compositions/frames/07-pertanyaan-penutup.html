<script>
  (function () {
    var DURATION = 7.338;

    // ── dynamic-content-sequencing ─────────────────────────────────────────────
    // Each beat's window is computed from its content length + per-item config
    // (BASE + body.length × SEC_PER_CHAR + hold) — no hardcoded offsets. The flat
    // TIMELINE is pre-computed ONCE here at build; entrance tweens are then placed
    // at the computed starts (fromTo = seek-safe on the renderer's frame-by-frame
    // seek — no per-frame DOM writes, no onUpdate state).
    var WORD_BASE = 0.18;      // BASE_DURATION — short tokens still get read time
    var WORD_PER_CHAR = 0.03;  // SEC_PER_CHAR
    var PHRASE_BASE = 0.5;     // phrase-level per-item config
    var PHRASE_PER_CHAR = 0.03;
    var HOLD_PAUSE = 0.66;     // the deliberate pause after "sendiri:" (ruang kosong)
    var HOLD_FINAL = 0.788;    // closing read hold — the largest dwell

    var CONTENT = [
      { body: "Jadi",      base: WORD_BASE, secPerChar: WORD_PER_CHAR, hold: 0, el: "07-pertanyaan-penutup-p1w0" },
      { body: "sebelum",   base: WORD_BASE, secPerChar: WORD_PER_CHAR, hold: 0, el: "07-pertanyaan-penutup-p1w1" },
      { body: "ngejar",    base: WORD_BASE, secPerChar: WORD_PER_CHAR, hold: 0, el: "07-pertanyaan-penutup-p1w2" },
      { body: "kepastian", base: WORD_BASE, secPerChar: WORD_PER_CHAR, hold: 0, el: "07-pertanyaan-penutup-p1w3" },
      { body: "dari",      base: WORD_BASE, secPerChar: WORD_PER_CHAR, hold: 0, el: "07-pertanyaan-penutup-p1w4" },
      { body: "dia,",      base: WORD_BASE, secPerChar: WORD_PER_CHAR, hold: 0, el: "07-pertanyaan-penutup-p1w5" },
      { body: "tanya",     base: WORD_BASE, secPerChar: WORD_PER_CHAR, hold: 0, el: "07-pertanyaan-penutup-p2w0" },
      { body: "diri",      base: WORD_BASE, secPerChar: WORD_PER_CHAR, hold: 0, el: "07-pertanyaan-penutup-p2w1" },
      { body: "lo",        base: WORD_BASE, secPerChar: WORD_PER_CHAR, hold: 0, el: "07-pertanyaan-penutup-p2w2" },
      { body: "sendiri:",  base: WORD_BASE, secPerChar: WORD_PER_CHAR, hold: HOLD_PAUSE, el: "07-pertanyaan-penutup-p2w3" },
      { body: "yang lo cari itu dia",           base: PHRASE_BASE, secPerChar: PHRASE_PER_CHAR, hold: 0, el: "07-pertanyaan-penutup-choicea" },
      { body: "atau kepastian bahwa lo cukup?", base: PHRASE_BASE, secPerChar: PHRASE_PER_CHAR, hold: HOLD_FINAL, el: "07-pertanyaan-penutup-choiceb" }
    ];

    var cumulative = 0;
    var TIMELINE = CONTENT.map(function (entry) {
      var dur = entry.base + entry.body.length * entry.secPerChar + entry.hold;
      var start = cumulative;
      cumulative += dur;
      return { entry: entry, start: start, end: cumulative };
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // ── beats: each piece arrives on its cue, paced to the voiceover ───────────
    TIMELINE.forEach(function (item, i) {
      var el = document.getElementById(item.entry.el);
      var isPhrase = item.entry.base === PHRASE_BASE;
      if (isPhrase) {
        var isFinal = i === TIMELINE.length - 1;
        tl.fromTo(
          el,
          { opacity: 0, y: isFinal ? 26 : 20 },
          { opacity: 1, y: 0, duration: isFinal ? 0.7 : 0.55, ease: "power2.out" },
          item.start
        );
      } else {
        tl.fromTo(
          el,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" },
          item.start
        );
      }
    });

    // ── two shapes slowly seeking position: approach, hold back, settle ───────
    var shapeA = document.getElementById("07-pertanyaan-penutup-shapea");
    var shapeB = document.getElementById("07-pertanyaan-penutup-shapeb");

    tl.set(shapeA, { x: -96 }, 0);
    tl.set(shapeB, { x: 96 }, 0);
    tl.fromTo(shapeA, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.15);
    tl.fromTo(shapeB, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.15);

    // phase a — mendekat (slow approach)
    tl.fromTo(shapeA, { x: -96 }, { x: -58, duration: 1.4, ease: "sine.inOut" }, 0.15);
    tl.fromTo(shapeB, { x: 96 }, { x: 58, duration: 1.4, ease: "sine.inOut" }, 0.15);
    // held back — tertahan (quiet gap left on purpose)
    // phase b — second slow approach while the question is asked
    tl.fromTo(shapeA, { x: -58 }, { x: -30, duration: 1.3, ease: "sine.inOut" }, 2.95);
    tl.fromTo(shapeB, { x: 58 }, { x: 30, duration: 1.3, ease: "sine.inOut" }, 2.95);
    // held back again
    // phase c — the agreed distance is found, shapes settle (no overshoot)
    tl.fromTo(shapeA, { x: -30, scale: 0.96 }, { x: 0, scale: 1, duration: 0.7, ease: "power2.out" }, 4.85);
    tl.fromTo(shapeB, { x: 30, scale: 0.96 }, { x: 0, scale: 1, duration: 0.7, ease: "power2.out" }, 4.85);

    // ── svg-path-draw: the calm A–B connection line ───────────────────────────
    var arc = document.getElementById("07-pertanyaan-penutup-arc");
    var len = arc.getTotalLength();
    arc.style.strokeDasharray = len + " " + len;
    arc.style.strokeDashoffset = len;

    tl.fromTo(arc, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 5.6);
    tl.fromTo(document.getElementById("07-pertanyaan-penutup-dotl"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 5.62);
    tl.fromTo(document.getElementById("07-pertanyaan-penutup-dotr"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 6.18);

    // ── Scene 4: full read hold, settle only (exit belongs to the harness) ────
    tl.fromTo(document.getElementById("07-pertanyaan-penutup-hero"), { y: 0 }, { y: -6, duration: 0.79, ease: "none" }, 6.55);

    // ambient: the fine grid breathes almost imperceptibly under everything
    tl.fromTo(document.getElementById("07-pertanyaan-penutup-grid"), { x: 0 }, { x: 14, duration: DURATION, ease: "none" }, 0);

    // full-span anchor so the sub-comp timeline spans the whole frame window
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["07-pertanyaan-penutup"] = tl;
  })();
</script>
