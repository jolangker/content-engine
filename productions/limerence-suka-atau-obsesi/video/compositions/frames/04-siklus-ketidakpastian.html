<script>
  (function () {
    var ID = "04-siklus-ketidakpastian-";
    var D = 7.152;
    function $(n) { return document.getElementById(ID + n); }

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    // full-span anchor so the sub-comp timeline covers the whole shot
    tl.to({}, { duration: D }, 0);

    // ---------- svg-path-draw setup: measured geometry, dasharray/dashoffset ----------
    var lens = {};
    ["leadin", "orbit1", "orbit2", "hopeA", "hopeB"].forEach(function (n) {
      var p = $(n);
      var len = p.getTotalLength() * 1.02;
      lens[n] = len;
      p.style.strokeDasharray = len + " " + len;
      p.style.strokeDashoffset = String(len);
    });
    function draw(n, at, dur, ease, toOpacity) {
      tl.fromTo($(n),
        { strokeDashoffset: lens[n] },
        { strokeDashoffset: 0, duration: dur, ease: ease || "power2.out" }, at);
      tl.fromTo($(n),
        { opacity: 0 },
        { opacity: toOpacity, duration: dur * 0.7, ease: "power1.out" }, at);
    }

    // ---------- Scene 1 (0.0-2.4s): cream -> arang, shapes hold, orbit draws two loops ----------
    tl.fromTo($("veil"),
      { opacity: 1 },
      { opacity: 0, duration: 0.7, ease: "power1.inOut" }, 0);
    tl.fromTo($("chrome"),
      { opacity: 0, y: -14 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.10);
    tl.fromTo($("shapeA"),
      { opacity: 0, y: 44 },
      { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.08);
    tl.fromTo($("shapeB"),
      { opacity: 0, y: 44 },
      { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.18);
    tl.fromTo($("labelA"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.28);
    tl.fromTo($("labelB"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0.38);

    draw("leadin", 0.40, 0.55, "power2.out", 0.85);
    draw("orbit1", 0.85, 0.95, "power2.out", 0.95);
    draw("orbit2", 1.55, 0.80, "power2.out", 0.85);
    tl.fromTo($("arrow"),
      { opacity: 0 },
      { opacity: 1, duration: 0.3, ease: "power1.out" }, 1.85);

    // ---------- Scene 2 (2.4-4.8s): "balasan?" pill + ? pop in the space between; hope line lights once ----------
    tl.fromTo($("pill"),
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 2.50);
    tl.fromTo($("qmark"),
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 2.75);

    draw("hopeA", 3.30, 0.32, "power2.out", 0.55);
    draw("hopeB", 3.50, 0.35, "power2.out", 0.55);
    tl.fromTo($("hopeG"),
      { opacity: 0.7 },
      { opacity: 1, duration: 0.25, ease: "power1.out" }, 3.90);
    tl.to($("hopeG"),
      { opacity: 0.6, duration: 0.7, ease: "power1.out" }, 4.35);

    // ---------- Scene 3 (4.8-7.152s): orbit widens + pulses faster; keyword glow; jitter hold ----------
    tl.fromTo($("orbitWiden"),
      { scale: 1, svgOrigin: "660 940" },
      { scale: 1.16, svgOrigin: "660 940", duration: 1.1, ease: "power1.inOut" }, 4.80);

    // chirped pulse — accelerating "heartbeat" of the trajectory (deterministic in driver.t)
    var chirp = { t: 0 };
    tl.to(chirp, {
      t: D,
      duration: D,
      ease: "none",
      onUpdate: function () {
        var u = Math.max(0, chirp.t - 4.8);
        var amp = u <= 0 ? 0 : Math.min(1, u / 1.3);
        var ph = 2 * Math.PI * (1.0 * u + 0.55 * u * u);
        var a = Math.abs(Math.sin(ph)) * amp;
        var w = (3.2 + 2.2 * a).toFixed(2);
        $("orbit1").style.strokeWidth = w;
        $("orbit2").style.strokeWidth = w;
        $("orbitAll").style.opacity = (0.85 + 0.15 * a).toFixed(3);
      }
    }, 0);

    // asr-keyword-glow (karaoke variant) — one linear driver, per-word envelopes
    var ATK = 0.18, REL = 0.45, REST = 0.12, MAXB = 38, MAXS = 0.2;
    var REST_RGB = [122, 112, 102], ACT_RGB = [243, 237, 227];
    var TIMINGS = {
      makin: { start: 5.80, end: 6.18 },
      kencang: { start: 6.25, end: 6.65 }
    };
    function envelope(time, start, end) {
      if (time < start) return 0;
      if (time < end) return Math.min((time - start) / ATK, 1);
      var releaseEnd = end + REL;
      if (time < releaseEnd) return 1 - ((time - end) / REL) * (1 - REST);
      return REST;
    }
    var words = [$("wordMakin"), $("wordKencang")];
    var kdr = { t: 0 };
    tl.to(kdr, {
      t: D,
      duration: D,
      ease: "none",
      onUpdate: function () {
        words.forEach(function (el) {
          var tm = TIMINGS[el.dataset.word];
          if (!tm) return;
          var e = envelope(kdr.t, tm.start, tm.end);
          var r = Math.round(REST_RGB[0] + (ACT_RGB[0] - REST_RGB[0]) * e);
          var g = Math.round(REST_RGB[1] + (ACT_RGB[1] - REST_RGB[1]) * e);
          var b = Math.round(REST_RGB[2] + (ACT_RGB[2] - REST_RGB[2]) * e);
          el.style.color = "rgb(" + r + "," + g + "," + b + ")";
          el.style.textShadow = "0 0 " + (MAXB * e).toFixed(1) + "px rgba(243,237,227," + (0.55 * e).toFixed(3) + ")";
          el.style.transform = "scale(" + (1 + MAXS * e).toFixed(4) + ")";
        });
      }
    }, 0);

    // sine-wave-loop (onUpdate form, low amplitude) — hold jitter with settle-and-fade tail
    var CYC = 0.55;
    var jit = { p: 0 };
    tl.to(jit, {
      p: Math.PI * 2 * CYC,
      duration: 1.202,
      ease: "none",
      onUpdate: function () {
        var t = jit.p / (Math.PI * 2 * CYC);
        var fade = t < 0.78 ? 1 : (1 - t) / 0.22;
        var s = Math.sin(jit.p);
        $("stageinner").style.transform =
          "translateY(" + (s * 2 * fade).toFixed(2) + "px) scale(" + (1 + s * 0.008 * fade).toFixed(5) + ")";
      }
    }, 5.95);

    window.__timelines["04-siklus-ketidakpastian"] = tl;
  })();
</script>
