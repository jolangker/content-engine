  @font-face { font-family: 'DM Sans'; src: url('assets/fonts/dm-sans.ttf') format('truetype'); font-weight: 100 900; font-style: normal; font-display: block; }

  /* root sized to the 9:16 canvas; frame-relative units resolve against it */

    inset: 0;
    width: 1080px;

  }

  [id="02-ada-namanya-stage"] {

  /* kicker-spike — the frame's single coral moment (✱ drawn in CSS: U+2731 is not in the shipped faces) */

  [id="02-ada-namanya-kicker-spike"] i:nth-child(1) { transform: rotate(0deg); }
  [id="02-ada-namanya-kicker-spike"] i:nth-child(2) { transform: rotate(60deg); }

  /* scene 1 — the small intro phrase, top third */
  [id="02-ada-namanya-phrase"] {

    font-size: 34px;

    color: rgba(48, 43, 40, 0.84);
  }
  [id="02-ada-namanya-phrase"] span {
    display: inline-block;

  /* the slot — token "jatuh cinta" hard-cuts to "limerence", then grows to display scale.
     Text is authored at display metrics (140px) and carried at scale 0.41 (~58px) in scene 1,
     so the swap and the growth are transform-only; min-width holds the slot's centre steady. */
  [id="02-ada-namanya-slot"] {
    position: absolute;
    left: 0;
    right: 0;
    top: 504px;
    text-align: center;
    line-height: 1;

  [id="02-ada-namanya-text"] {
    display: inline-block;
    min-width: 760px;

  }
  [id="02-ada-namanya-slot"][data-state="hero"] [id="02-ada-namanya-text"] {
    font-family: 'Newsreader', serif;
    font-weight: 400;
    letter-spacing: -0.022em;
  }

  /* hairline under the token — "this is the thing being named" */
  [id="02-ada-namanya-underline"] {

  /* corner credit block (mono-label register) */
  [id="02-ada-namanya-credit-rule"] {

  }
</style>

<div data-hf-id="hf-sb1f" id="root" data-composition-id="02-ada-namanya" data-start="0" data-duration="5.608" data-width="1080" data-height="1920">
  <div data-hf-id="hf-zawc" class="clip" id="02-ada-namanya-bg" data-start="0" data-duration="5.608" data-track-index="0"></div>
  <div data-hf-id="hf-elvk" class="clip" id="02-ada-namanya-stage" data-start="0" data-duration="5.608" data-track-index="1">
    <div data-hf-id="hf-e5ny" id="02-ada-namanya-kicker">
      <div data-hf-id="hf-zehj" id="02-ada-namanya-kicker-spike"><i data-hf-id="hf-wt6k"></i><i data-hf-id="hf-zeb8"></i><i data-hf-id="hf-y7e5"></i></div>
      <div data-hf-id="hf-4pxd" id="02-ada-namanya-kicker-word">Istilah</div>
    </div>
    <div data-hf-id="hf-ptg2" id="02-ada-namanya-phrase">
      <span data-hf-id="hf-ljmn" id="02-ada-namanya-w0">Sebagian</span><span data-hf-id="hf-6nsd" id="02-ada-namanya-w1">lo</span><span data-hf-id="hf-ryq0" id="02-ada-namanya-w2">nyebut</span><span data-hf-id="hf-3ak0" id="02-ada-namanya-w3">ini</span>

    <div data-hf-id="hf-ml27" id="02-ada-namanya-underline"></div>

  </div>
</div>

<script>
  (function () {
    var TOTAL = 5.108;
    // frame-relative VO onsets (real voice word timings, frame 2):
    // "Sebagian"0.06 · "lo"0.557 · "nyebut"0.685 · "ini"1.033 · "jatuh"1.265
    // "Tennov"3.239 · "limerence."4.214
    var TOKEN_T = 1.265;
    var CREDIT_T = 3.239;
    var SWAP_T = 4.214;

    var slotEl = document.getElementById("02-ada-namanya-slot");
    var textEl = document.getElementById("02-ada-namanya-text");
    var underlineEl = document.getElementById("02-ada-namanya-underline");
    var phraseEl = document.getElementById("02-ada-namanya-phrase");
    var creditEl = document.getElementById("02-ada-namanya-credit");
    var creditTextEl = document.getElementById("02-ada-namanya-credit-text");
    var creditRuleEl = document.getElementById("02-ada-namanya-credit-rule");
    var spikeEl = document.getElementById("02-ada-namanya-kicker-spike");
    var kickerWordEl = document.getElementById("02-ada-namanya-kicker-word");

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // ---- dynamic-content-sequencing ----
    // per-entry reveal length comes from content length; the flat TIMELINE is
    // precomputed ONCE at build (script-driven phrase windows, anchored to the VO word onsets).
    var BASE_DURATION = 0.34;
    var SEC_PER_CHAR = 0.022;
    var HOLD_MID = 0.10;
    var HOLD_FINAL = 0.55;

    var CONTENT = [
      { key: "w0", text: "Sebagian", start: 0.06, hold: HOLD_MID },
      { key: "w1", text: "lo", start: 0.557, hold: HOLD_MID },
      { key: "w2", text: "nyebut", start: 0.685, hold: HOLD_MID },
      { key: "w3", text: "ini", start: 1.033, hold: HOLD_MID },
      { key: "credit", text: "Tennov, 1979", start: CREDIT_T, hold: HOLD_FINAL }
    ];

    var TIMELINE = CONTENT.map(function (e) {
      var dur = BASE_DURATION + e.text.length * SEC_PER_CHAR + (e.hold || 0);
      return { key: e.key, text: e.text, start: e.start, end: e.start + dur, reveal: BASE_DURATION + e.text.length * SEC_PER_CHAR };
    });

    function entryAt(time) {
      for (var i = TIMELINE.length - 1; i >= 0; i--) {
        if (time >= TIMELINE[i].start) return TIMELINE[i];
      }
      return TIMELINE[0];
    }

    // per-word entrances at their precomputed windows (longer content reveals a touch slower)
    TIMELINE.forEach(function (e) {
      if (e.key === "credit") return;
      tl.fromTo(
        document.getElementById("02-ada-namanya-" + e.key),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: e.reveal, ease: "power2.out" },
        e.start
      );
    });

    // credit copy is written only on entry transition (guard — no per-frame DOM thrash)
    var lastCredit = "";
    var seqDriver = { t: 0 };
    tl.to(seqDriver, {
      t: TOTAL,
      duration: TOTAL,
      ease: "none",
      onUpdate: function () {
        var e = entryAt(seqDriver.t);
        if (e.key === "credit" && e.text !== lastCredit) {
          creditTextEl.textContent = e.text;
          lastCredit = e.text;
        }
      }
    }, 0);

    // ---- discrete-text-sequence ----
    // sparse { t, text } states, reverse-search per update, INSTANT jumps (no transition on the text).
    // Scene 2's hard-cut word swap is the signature move.
    var SEQUENCE = [
      { t: 0.0, text: "", state: "token" },
      { t: TOKEN_T, text: "jatuh cinta", state: "token" },
      { t: SWAP_T, text: "limerence", state: "hero" }
    ];

    function stateAt(time) {
      for (var i = SEQUENCE.length - 1; i >= 0; i--) {
        if (time >= SEQUENCE[i].t) return SEQUENCE[i];
      }
      return SEQUENCE[0];
    }

    var lastText = null;
    var lastState = null;
    var lastRule = null;
    var txtDriver = { t: 0 };
    tl.to(txtDriver, {
      t: TOTAL,
      duration: TOTAL,
      ease: "none",
      onUpdate: function () {
        var s = stateAt(txtDriver.t);
        if (s.text !== lastText) {
          textEl.textContent = s.text;
          lastText = s.text;
        }
        if (s.state !== lastState) {
          slotEl.setAttribute("data-state", s.state);
          lastState = s.state;
        }
        // the scene-1 hairline hard-cuts away with the token it underlines
        var ruleState = txtDriver.t >= SWAP_T ? "0" : "1";
        if (ruleState !== lastRule) {
          underlineEl.style.opacity = ruleState;
          lastRule = ruleState;
        }
      }
    }, 0);

    // ---- scene 1 (0.0–2.13s) — phrase per word in the top third, then the token slot lands ----
    tl.fromTo(spikeEl, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.34, ease: "power2.out" }, 0.10);
    tl.fromTo(kickerWordEl, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, 0.16);

    // slot rides in at display metrics × 0.41 (≈58px) — the scene-1 token size
    tl.fromTo(slotEl, { opacity: 0, y: 14, scale: 0.41 }, { opacity: 1, y: 0, scale: 0.41, duration: 0.45, ease: "power2.out" }, TOKEN_T);

    // ---- scene 2 (2.13–3.6s) — beat clears, the named slot gets a hairline ----
    tl.to(phraseEl, { opacity: 0, y: -18, duration: 0.34, ease: "power1.in" }, 2.22);
    tl.fromTo(underlineEl, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 2.75);

    // ---- scene 3 (3.24–5.108s) — credit on the "Tennov" cue, then the naming beat ----
    tl.fromTo(creditRuleEl, { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 3.10);
    tl.fromTo(creditEl, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" }, CREDIT_T);

    // the swap lands on the VO word "limerence"; the token grows to display scale in place
    // (from-state == scene-1 resting state, so every seek lands on the same picture)
    tl.fromTo(slotEl, { scale: 0.41, y: 0 }, { scale: 1, y: 232, duration: 0.65, ease: "power2.out", immediateRender: false }, SWAP_T);

    // full-span anchor so the sub-comp timeline spans the whole frame
    tl.to({}, { duration: TOTAL }, 0);

    window.__timelines["02-ada-namanya"] = tl;
  })();
</script>
