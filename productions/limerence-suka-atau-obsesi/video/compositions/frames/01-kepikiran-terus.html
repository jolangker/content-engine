<script>
  (function () {
    window.__timelines = window.__timelines || {};
    var el = function (id) { return document.getElementById(id); };
    var DUR = 8.87; /* packet duration — fixed upstream */

    var tl = gsap.timeline({ paused: true });

    /* ============================================================
       macro camera move — slow push-in under the whole shot
       (transform-only, fromTo for seek-safety)
       ============================================================ */
    tl.fromTo(el("01-kepikiran-terus-cam"),
      { scale: 1 },
      { scale: 1.05, duration: DUR, ease: "none" }, 0);
    tl.fromTo(el("01-kepikiran-terus-lines"),
      { scale: 1 },
      { scale: 1.028, duration: DUR, ease: "none" }, 0);

    /* ============================================================
       Scene 1 (0.0–2.8s) — "Lo baru kenal seseorang, belum seberapa."
       bentuk A: spring-pop-entrance (smooth long-tail settle, no overshoot)
       ============================================================ */
    tl.fromTo(el("01-kepikiran-terus-a"),
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.15);

    /* supporting: titik kecil "dia" (B) jauh di atas */
    tl.fromTo(el("01-kepikiran-terus-b"),
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 1.1);

    /* ============================================================
       Scene 2 (2.8–6.0s) — "…ngisi kepala lo seharian — chat dibaca ulang,"
       gema pill "chat": dynamic-content-sequencing —
       start/end pre-computed ONCE from content length + per-item hold,
       reveals land on the cues "seharian" (~4.0s) then "dibaca ulang" (~5.1s)
       ============================================================ */
    var CONTENT = [
      { label: "chat", hold: 0.45 }, /* first trail around A          */
      { label: "chat", hold: 0.35 }, /* cadence picks up              */
      { label: "chat", hold: 0.80 }, /* reveal on the cue "seharian"  */
      { label: "chat", hold: 0.95 }  /* brake on "dibaca ulang"       */
    ];
    var BASE_DURATION = 0.45;
    var SEC_PER_CHAR = 0.05;
    var SEQ_START = 2.95;

    /* pre-compute the flat TIMELINE once at build — never in onUpdate */
    var cumulative = SEQ_START;
    var SEQ = CONTENT.map(function (entry) {
      var dur = BASE_DURATION + entry.label.length * SEC_PER_CHAR + entry.hold;
      var start = cumulative;
      cumulative += dur;
      return { label: entry.label, start: start, end: cumulative };
    });

    SEQ.forEach(function (entry, i) {
      /* primary pill arrives (spring-pop-entrance, smooth settle) */
      tl.fromTo(el("01-kepikiran-terus-chat-" + (i + 1)),
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, entry.start);

      /* the same pill spawns its second echo — jejak berulang */
      tl.fromTo(el("01-kepikiran-terus-echo-" + (i + 1)),
        { scale: 0.82, opacity: 0 },
        { scale: 1, opacity: 0.55, duration: 0.65, ease: "power2.out" }, entry.start + 0.85);
    });

    /* ============================================================
       Scene 3 (6.0–8.87s) — "satu balasan pendek bisa nentuin mood lo."
       ============================================================ */

    /* pill "balasan" dekat B — spring-pop-entrance (smooth) */
    tl.fromTo(el("01-kepikiran-terus-balasan"),
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 6.35);

    /* garis mood reveal, then ONE up-down pulse on the spoken beat */
    tl.fromTo(el("01-kepikiran-terus-mood-line"),
      { opacity: 0, scaleX: 0.55 },
      { opacity: 1, scaleX: 1, duration: 0.5, ease: "power3.out" }, 6.85);
    tl.fromTo(el("01-kepikiran-terus-mood-word"),
      { opacity: 0 },
      { opacity: 1, duration: 0.4, ease: "power2.out" }, 6.95);

    /* denyut naik-turun sekali (finite, seek-safe) */
    tl.fromTo(el("01-kepikiran-terus-mood-line"),
      { y: 0, scaleY: 1 },
      { y: -16, scaleY: 1.9, duration: 0.32, ease: "sine.out" }, 7.1);
    tl.fromTo(el("01-kepikiran-terus-mood-line"),
      { y: -16, scaleY: 1.9 },
      { y: 0, scaleY: 1, duration: 0.5, ease: "sine.inOut" }, 7.45);

    /* ---- asr-keyword-glow (karaoke style) on the word "mood" ----
       one linear driver sweeps scene time; per-word envelope drives
       text-shadow glow + scale + color. Timings hand-authored to VO. */
    var ATTACK_DUR = 0.22;
    var RELEASE = 0.45;
    var REST_LEVEL = 0.12;
    var MAX_BLUR = 38;
    var MAX_SCALE_BOOST = 0.22;
    var REST_RGB = { r: 176, g: 166, b: 157 };
    var ACTIVE_RGB = { r: 48, g: 43, b: 40 };
    var GLOW_RGB = { r: 163, g: 79, b: 63 }; /* coral voltage — the one moment */
    var TIMINGS = { mood: { start: 7.05, end: 7.8 } };

    function envelope(time, start, end) {
      if (time < start) return 0;
      if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
      var releaseEnd = end + RELEASE;
      if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
      return REST_LEVEL;
    }
    function lerpChannel(a, b, t) { return Math.round(a + (b - a) * t); }

    var moodWord = el("01-kepikiran-terus-mood-word");
    var driver = { t: 0 };
    tl.to(driver, {
      t: DUR,
      duration: DUR,
      ease: "none", /* linear — t maps 1:1 to scene time */
      onUpdate: function () {
        var env = envelope(driver.t, TIMINGS.mood.start, TIMINGS.mood.end);
        moodWord.style.textShadow =
          "0 0 " + (MAX_BLUR * env).toFixed(2) + "px rgba(" +
          GLOW_RGB.r + "," + GLOW_RGB.g + "," + GLOW_RGB.b + "," + (0.55 * env).toFixed(3) + ")";
        moodWord.style.color =
          "rgb(" + lerpChannel(REST_RGB.r, ACTIVE_RGB.r, env) + "," +
          lerpChannel(REST_RGB.g, ACTIVE_RGB.g, env) + "," +
          lerpChannel(REST_RGB.b, ACTIVE_RGB.b, env) + ")";
        moodWord.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env).toFixed(4) + ")";
      }
    }, 0);

    /* ============================================================
       hold — sine-wave-loop, subtle jitter only (low amplitude,
       phase-driven onUpdate form, settle-and-fade tail)
       ============================================================ */
    var IDLE_START = 8.05;
    var IDLE_DUR = DUR - IDLE_START;
    var CYCLES = 0.4;      /* period ≈ 2.05s — inside the 1.5–3s band */
    var Y_AMP = 2;         /* px — low end                          */
    var SCALE_AMP = 0.008; /* low end                               */
    var FADE_FRAC = 0.25;
    var aWrap = el("01-kepikiran-terus-a-wrap");
    var phase = { p: 0 };
    tl.to(phase, {
      p: Math.PI * 2 * CYCLES,
      duration: IDLE_DUR,
      ease: "none", /* sine provides the easing */
      onUpdate: function () {
        var prog = phase.p / (Math.PI * 2 * CYCLES);
        var env = prog < 1 - FADE_FRAC ? 1 : (1 - prog) / FADE_FRAC;
        var s = Math.sin(phase.p);
        /* idle composes onto the resting transform — wrapper, not the popped hero */
        aWrap.style.transform =
          "translateY(" + (s * Y_AMP * env).toFixed(3) + "px) scale(" +
          (1 + s * SCALE_AMP * env).toFixed(5) + ")";
      }
    }, IDLE_START);

    window.__timelines["01-kepikiran-terus"] = tl;
  })();
</script>
