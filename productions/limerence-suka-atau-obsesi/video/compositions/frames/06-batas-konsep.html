<script>
  (function () {
    "use strict";
    var FID = "06-batas-konsep";
    var card = document.getElementById(FID + "-card");
    var kicker = document.getElementById(FID + "-kicker");
    var credit = document.getElementById(FID + "-credit");
    var WORDS = [
      { el: document.getElementById(FID + "-word-1"), body: "bukan" },
      { el: document.getElementById(FID + "-word-2"), body: "diagnosis" }
    ];

    // dynamic-content-sequencing: each item's duration is computed from its content
    // length (BASE + body.length * SEC_PER_CHAR), and absolute start/end times are
    // precomputed ONCE at build — no hardcoded per-word offsets. Adapted to a
    // per-word landing: each word is its own content block, arriving in sequence.
    var BASE_DURATION = 0.25; // per-word landing base (entry register, stepped to word scale)
    var SEC_PER_CHAR = 0.04;  // inside the 0.03–0.06 s/char band — the longer word earns more time
    var WORD_START = 1.9;     // Scene 2 cue: "bukan diagnosis."

    var cumulative = WORD_START;
    var TIMELINE = WORDS.map(function (entry) {
      var dur = BASE_DURATION + entry.body.length * SEC_PER_CHAR;
      var start = cumulative;
      cumulative += dur;
      return { el: entry.el, start: start, end: cumulative };
    });

    // the small credit follows the line ("kredit kecil menyusul")
    var CREDIT_AT = cumulative + 0.1;

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // Phase 1 — Scene 1 (0–1.9s): the ONE restrained move — the hairline card
    // rises slowly and crossfades in, its sentence riding along (titlecard-reveal).
    tl.fromTo(kicker, { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.1);
    tl.fromTo(card, { autoAlpha: 0, y: 56, scale: 0.975 }, { autoAlpha: 1, y: 0, scale: 1, duration: 1.3, ease: "power2.out" }, 0.05);

    // Phase 2 — Scene 2 (1.9s→): "bukan diagnosis." lands word by word on the
    // content-derived schedule — each word settles, then the frame holds still.
    TIMELINE.forEach(function (item) {
      tl.fromTo(item.el, { autoAlpha: 0, y: 30, scale: 0.98 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, item.start);
    });

    tl.fromTo(credit, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: "power2.out" }, CREDIT_AT);

    // deliberate hold to the fixed 4.69s render length — the stillness is the payload.
    // No exit tween: the root transition is the exit.
    tl.to({ v: 0 }, { v: 1, duration: 4.69, ease: "none" }, 0);

    window.__timelines[FID] = tl;
  })();
</script>
