<template><style>@font-face{font-family:Newsreader;src:url("assets/board/newsreader.ttf");font-weight:400;font-display:block}@font-face{font-family:DM Sans;src:url("assets/board/dm-sans.ttf");font-weight:100 900;font-display:block} .capline{position:absolute;left:88px;top:1550px;right:auto;bottom:auto;width:848px;height:190px;display:flex;align-items:center;font:500 46px/1.25 'DM Sans',sans-serif}</style><div data-hf-id="hf-fm4q" id="root" data-composition-id="captions" data-width="1080" data-height="1920" data-duration="86.0"><div data-hf-id="hf-fuwt" id="caption-000" class="clip capline" data-start="0.06500000" data-duration="2.39750000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Lo cuma pengen cerita soal hari yang berat.</div><div data-hf-id="hf-0ule" id="caption-001" class="clip capline" data-start="2.56403509" data-duration="2.19596491" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kok obrolannya malah jadi daftar solusi?</div><div data-hf-id="hf-mcmd" id="caption-002" class="clip capline" data-start="5.36500000" data-duration="2.65052083" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kadang, yang lo butuhin saat itu cuma ruang</div><div data-hf-id="hf-u4bo" id="caption-003" class="clip capline" data-start="8.01552083" data-duration="1.08447917" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">buat didengar dulu.</div><div data-hf-id="hf-x0h0" id="caption-004" class="clip capline" data-start="9.48000000" data-duration="2.34038168" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Misalnya, lo pulang bilang: gua</div><div data-hf-id="hf-qppn" id="caption-005" class="clip capline" data-start="11.82038168" data-duration="2.70461832" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">capek, tadi kerjaan gua dikritik lagi.</div><div data-hf-id="hf-dlxi" id="caption-006" class="clip capline" data-start="14.98500000" data-duration="2.74393825" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">Dia jawab: ya udah, cari kerja lain</div><div data-hf-id="hf-t2bx" id="caption-007" class="clip capline" data-start="17.83334013" data-duration="0.59056450" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">aja.</div><div data-hf-id="hf-7haz" id="caption-008" class="clip capline" data-start="18.61006725" data-duration="1.48993275" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">Lalu cerita lo berhenti.</div><div data-hf-id="hf-417k" id="caption-009" class="clip capline" data-start="20.51500000" data-duration="1.71662281" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Sarannya mungkin masuk akal.</div><div data-hf-id="hf-gux8" id="caption-010" class="clip capline" data-start="22.32877193" data-duration="2.78122807" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Tapi lo belum sempat menjelaskan bagian yang berat.</div><div data-hf-id="hf-18ei" id="caption-011" class="clip capline" data-start="25.49000000" data-duration="2.71119403" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Satu respons belum cukup buat menyimpulkan dia nggak</div><div data-hf-id="hf-m2t2" id="caption-012" class="clip capline" data-start="28.20119403" data-duration="0.56477612" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">peduli.</div><div data-hf-id="hf-5ph2" id="caption-013" class="clip capline" data-start="29.05328358" data-duration="1.72671642" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Mungkin dia ingin membantu.</div><div data-hf-id="hf-b8aa" id="caption-014" class="clip capline" data-start="31.13000000" data-duration="2.69956522" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Niat membantu dan merasa dipahami belum tentu</div><div data-hf-id="hf-njhx" id="caption-015" class="clip capline" data-start="33.82956522" data-duration="1.83543478" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">ketemu dalam respons yang sama.</div><div data-hf-id="hf-5bis" id="caption-016" class="clip capline" data-start="35.96500000" data-duration="2.46129354" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Mendengarkan aktif berarti berusaha memahami</div><div data-hf-id="hf-7oa2" id="caption-017" class="clip capline" data-start="38.42629354" data-duration="2.67843836" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">cerita, lalu mengecek apakah tangkapan kita</div><div data-hf-id="hf-2i3w" id="caption-018" class="clip capline" data-start="41.10473190" data-duration="0.86526810" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">sudah tepat.</div><div data-hf-id="hf-mqea" id="caption-019" class="clip capline" data-start="42.38500000" data-duration="1.46679104" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Coba tahan saran sebentar.</div><div data-hf-id="hf-bh7g" id="caption-020" class="clip capline" data-start="43.93649254" data-duration="2.31641791" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kasih ruang sampai dia selesai menjelaskan</div><div data-hf-id="hf-3llp" id="caption-021" class="clip capline" data-start="46.26373134" data-duration="1.17126866" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">bagian yang berat.</div><div data-hf-id="hf-cxfx" id="caption-022" class="clip capline" data-start="47.79000000" data-duration="2.55073770" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Lo bisa bilang: jadi, lo kecewa</div><div data-hf-id="hf-df5m" id="caption-023" class="clip capline" data-start="50.34073770" data-duration="2.26426230" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">karena usaha lo tadi kayak nggak kelihatan?</div><div data-hf-id="hf-onaq" id="caption-024" class="clip capline" data-start="52.96500000" data-duration="2.71181102" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kalau dia mengoreksi, ikuti koreksinya.</div><div data-hf-id="hf-8mgc" id="caption-025" class="clip capline" data-start="55.67681102" data-duration="2.30818898" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Jangan buru-buru mempertahankan tebakan lo.</div><div data-hf-id="hf-vpuk" id="caption-026" class="clip capline" data-start="58.26500000" data-duration="2.65937500" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">Gua dengerin dulu, atau lo pengen kita cari</div><div data-hf-id="hf-a7in" id="caption-027" class="clip capline" data-start="60.92437500" data-duration="1.14062500" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">jalan keluar bareng?</div><div data-hf-id="hf-tw9q" id="caption-028" class="clip capline" data-start="62.39000000" data-duration="1.83127119" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Pertanyaan ini memberi pilihan.</div><div data-hf-id="hf-zujy" id="caption-029" class="clip capline" data-start="64.22127119" data-duration="2.67872881" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Jawabannya juga bisa berubah selama obrolan.</div><div data-hf-id="hf-ytxf" id="caption-030" class="clip capline" data-start="67.16000000" data-duration="2.70038462" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kalau lo yang cerita, bilang: gua mau didengerin</div><div data-hf-id="hf-ag4e" id="caption-031" class="clip capline" data-start="69.86038462" data-duration="0.56292307" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">dulu.</div><div data-hf-id="hf-6sef" id="caption-032" class="clip capline" data-start="70.47761538" data-duration="1.79738462" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Nanti kita pikirin langkahnya.</div><div data-hf-id="hf-1stl" id="caption-033" class="clip capline" data-start="72.58000000" data-duration="2.64057224" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Saran tetap punya tempat, ketika itu yang</div><div data-hf-id="hf-jr08" id="caption-034" class="clip capline" data-start="75.22057224" data-duration="0.89530438" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">dibutuhkan.</div><div data-hf-id="hf-3ds7" id="caption-035" class="clip capline" data-start="76.21798701" data-duration="2.68701299" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Mendengar dulu membantu lo menyesuaikannya.</div><div data-hf-id="hf-puj7" id="caption-036" class="clip capline" data-start="79.18000000" data-duration="2.71877231" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Sebelum menyusun jawaban, coba cari tahu:</div><div data-hf-id="hf-gnsd" id="caption-037" class="clip capline" data-start="81.89877231" data-duration="2.87122769" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">sekarang, bantuan seperti apa yang dia butuhkan?</div></div><script>const tl=gsap.timeline({paused:true});tl.to({},{duration:86.0},0);window.__timelines.captions=tl;</script></template>
