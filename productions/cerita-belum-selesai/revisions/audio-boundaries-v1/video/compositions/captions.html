<template><style>@font-face{font-family:Newsreader;src:url("assets/board/newsreader.ttf");font-weight:400;font-display:block}@font-face{font-family:DM Sans;src:url("assets/board/dm-sans.ttf");font-weight:100 900;font-display:block} .capline{position:absolute;left:88px;top:1550px;right:auto;bottom:auto;width:848px;height:190px;display:flex;align-items:center;font:500 46px/1.25 'DM Sans',sans-serif}</style><div data-hf-id="hf-mb5s" id="caption-root" data-composition-id="captions" data-width="1080" data-height="1920" data-duration="86.0000" style="position:relative;width:100%;height:100%;background:transparent;pointer-events:none"><div data-hf-id="hf-k3vx" id="cap-0" class="clip capline" data-start="0.0450" data-duration="2.4800" data-track-index="0" style="color:#302B28">Lo cuma pengen cerita soal hari yang berat.</div>
<div data-hf-id="hf-504j" id="cap-1" class="clip capline" data-start="2.5250" data-duration="2.2850" data-track-index="0" style="color:#302B28">Kok obrolannya malah jadi daftar solusi?</div>
<div data-hf-id="hf-rfgu" id="cap-2" class="clip capline" data-start="5.3250" data-duration="2.8000" data-track-index="0" style="color:#302B28">Kadang, yang lo butuhin saat itu cuma ruang</div>
<div data-hf-id="hf-oebx" id="cap-3" class="clip capline" data-start="8.1250" data-duration="1.2450" data-track-index="0" style="color:#302B28">buat didengar dulu.</div>
<div data-hf-id="hf-u4yo" id="cap-4" class="clip capline" data-start="9.4050" data-duration="2.4800" data-track-index="0" style="color:#302B28">Misalnya, lo pulang bilang: gua</div>
<div data-hf-id="hf-wnaj" id="cap-5" class="clip capline" data-start="11.8850" data-duration="2.9650" data-track-index="0" style="color:#302B28">capek, tadi kerjaan gua dikritik lagi.</div>
<div data-hf-id="hf-b45h" id="cap-6" class="clip capline" data-start="15.0580" data-duration="2.7870" data-track-index="0" style="color:#F3EDE3">Dia jawab: ya udah, cari kerja lain</div>
<div data-hf-id="hf-sevk" id="cap-7" class="clip capline" data-start="17.8450" data-duration="0.6850" data-track-index="0" style="color:#F3EDE3">aja.</div>
<div data-hf-id="hf-4uk8" id="cap-8" class="clip capline" data-start="18.6050" data-duration="1.5650" data-track-index="0" style="color:#F3EDE3">Lalu cerita lo berhenti.</div>
<div data-hf-id="hf-m7ty" id="cap-9" class="clip capline" data-start="20.5250" data-duration="1.8400" data-track-index="0" style="color:#302B28">Sarannya mungkin masuk akal.</div>
<div data-hf-id="hf-b5df" id="cap-10" class="clip capline" data-start="22.3650" data-duration="2.9250" data-track-index="0" style="color:#302B28">Tapi lo belum sempat menjelaskan bagian yang berat.</div>
<div data-hf-id="hf-fxzu" id="cap-11" class="clip capline" data-start="25.4850" data-duration="2.8000" data-track-index="0" style="color:#302B28">Satu respons belum cukup buat menyimpulkan dia nggak</div>
<div data-hf-id="hf-dx6c" id="cap-12" class="clip capline" data-start="28.2850" data-duration="0.6850" data-track-index="0" style="color:#302B28">peduli.</div>
<div data-hf-id="hf-3fk2" id="cap-13" class="clip capline" data-start="29.1650" data-duration="1.8850" data-track-index="0" style="color:#302B28">Mungkin dia ingin membantu.</div>
<div data-hf-id="hf-wb0f" id="cap-14" class="clip capline" data-start="31.0850" data-duration="2.8000" data-track-index="0" style="color:#302B28">Niat membantu dan merasa dipahami belum tentu</div>
<div data-hf-id="hf-7x2v" id="cap-15" class="clip capline" data-start="33.8850" data-duration="2.0050" data-track-index="0" style="color:#302B28">ketemu dalam respons yang sama.</div>
<div data-hf-id="hf-n6hv" id="cap-16" class="clip capline" data-start="35.9520" data-duration="2.5730" data-track-index="0" style="color:#302B28">Mendengarkan aktif berarti berusaha memahami</div>
<div data-hf-id="hf-h6na" id="cap-17" class="clip capline" data-start="38.5250" data-duration="2.8000" data-track-index="0" style="color:#302B28">cerita, lalu mengecek apakah tangkapan kita</div>
<div data-hf-id="hf-1j1f" id="cap-18" class="clip capline" data-start="41.3250" data-duration="1.0050" data-track-index="0" style="color:#302B28">sudah tepat.</div>
<div data-hf-id="hf-fla3" id="cap-19" class="clip capline" data-start="42.3650" data-duration="1.6800" data-track-index="0" style="color:#302B28">Coba tahan saran sebentar.</div>
<div data-hf-id="hf-jmpl" id="cap-20" class="clip capline" data-start="44.0450" data-duration="2.5200" data-track-index="0" style="color:#302B28">Kasih ruang sampai dia selesai menjelaskan</div>
<div data-hf-id="hf-ea3r" id="cap-21" class="clip capline" data-start="46.5650" data-duration="1.2150" data-track-index="0" style="color:#302B28">bagian yang berat.</div>
<div data-hf-id="hf-kqhs" id="cap-22" class="clip capline" data-start="47.8050" data-duration="2.6400" data-track-index="0" style="color:#302B28">Lo bisa bilang: jadi, lo kecewa</div>
<div data-hf-id="hf-mzje" id="cap-23" class="clip capline" data-start="50.4450" data-duration="2.4450" data-track-index="0" style="color:#302B28">karena usaha lo tadi kayak nggak kelihatan?</div>
<div data-hf-id="hf-x513" id="cap-24" class="clip capline" data-start="52.9250" data-duration="2.8000" data-track-index="0" style="color:#302B28">Kalau dia mengoreksi, ikuti koreksinya.</div>
<div data-hf-id="hf-5c5j" id="cap-25" class="clip capline" data-start="55.7250" data-duration="2.4850" data-track-index="0" style="color:#302B28">Jangan buru-buru mempertahankan tebakan lo.</div>
<div data-hf-id="hf-g2gk" id="cap-26" class="clip capline" data-start="58.2850" data-duration="2.7600" data-track-index="0" style="color:#F3EDE3">Gua dengerin dulu, atau lo pengen kita cari</div>
<div data-hf-id="hf-mdsc" id="cap-27" class="clip capline" data-start="61.0450" data-duration="1.2850" data-track-index="0" style="color:#F3EDE3">jalan keluar bareng?</div>
<div data-hf-id="hf-iewj" id="cap-28" class="clip capline" data-start="62.3650" data-duration="1.9600" data-track-index="0" style="color:#302B28">Pertanyaan ini memberi pilihan.</div>
<div data-hf-id="hf-p634" id="cap-29" class="clip capline" data-start="64.3250" data-duration="2.8150" data-track-index="0" style="color:#302B28">Jawabannya juga bisa berubah selama obrolan.</div>
<div data-hf-id="hf-rc4k" id="cap-30" class="clip capline" data-start="67.1650" data-duration="2.8000" data-track-index="0" style="color:#302B28">Kalau lo yang cerita, bilang: gua mau didengerin</div>
<div data-hf-id="hf-anaz" id="cap-31" class="clip capline" data-start="69.9650" data-duration="0.6400" data-track-index="0" style="color:#302B28">dulu.</div>
<div data-hf-id="hf-yq7f" id="cap-32" class="clip capline" data-start="70.6050" data-duration="1.9650" data-track-index="0" style="color:#302B28">Nanti kita pikirin langkahnya.</div>
<div data-hf-id="hf-v3sv" id="cap-33" class="clip capline" data-start="72.6050" data-duration="2.6130" data-track-index="0" style="color:#302B28">Saran tetap punya tempat, ketika itu yang</div>
<div data-hf-id="hf-dq3x" id="cap-34" class="clip capline" data-start="75.2180" data-duration="0.9870" data-track-index="0" style="color:#302B28">dibutuhkan.</div>
<div data-hf-id="hf-zjfr" id="cap-35" class="clip capline" data-start="76.2050" data-duration="2.7650" data-track-index="0" style="color:#302B28">Mendengar dulu membantu lo menyesuaikannya.</div>
<div data-hf-id="hf-4kk5" id="cap-36" class="clip capline" data-start="79.2980" data-duration="2.7470" data-track-index="0" style="color:#302B28">Sebelum menyusun jawaban, coba cari tahu:</div>
<div data-hf-id="hf-yx3w" id="cap-37" class="clip capline" data-start="82.0450" data-duration="3.0050" data-track-index="0" style="color:#302B28">sekarang, bantuan seperti apa yang dia butuhkan?</div>
