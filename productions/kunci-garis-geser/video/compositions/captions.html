<template><style>@font-face{font-family:Manrope;src:url('assets/fonts/manrope.ttf');font-weight:100 900}#root{position:absolute;inset:0;pointer-events:none}.caption{position:absolute;left:108px!important;top:1560px!important;width:846px!important;height:180px!important;display:flex;align-items:center;justify-content:center;text-align:center;font:600 46px/1.36 Manrope;color:#172B3B;box-sizing:border-box}.caption span{background:#F8F9F5;border-radius:14px;padding:14px 22px;max-width:100%;box-sizing:border-box}</style><div id="root" data-composition-id="captions" data-width="1080" data-height="1920" data-duration="90"><div class="clip caption" id="caption-000" data-start="0.595" data-duration="2.079" data-track-index="0"><span>Kunci bisa masuk, tapi kenapa belum</span></div><div class="clip caption" id="caption-001" data-start="2.686" data-duration="1.143" data-track-index="0"><span>tentu bisa diputar?</span></div><div class="clip caption" id="caption-002" data-start="3.949" data-duration="2.280" data-track-index="0"><span>Jawabannya ada pada pin-pin di dalamnya.</span></div><div class="clip caption" id="caption-003" data-start="6.241" data-duration="1.906" data-track-index="0"><span>Pada silinder kunci pin konvensional,</span></div><div class="clip caption" id="caption-004" data-start="8.160" data-duration="1.742" data-track-index="0"><span>gerigi anak kunci harus menyelaraskan</span></div><div class="clip caption" id="caption-005" data-start="9.914" data-duration="2.584" data-track-index="0"><span>semua pasangan pin, bukan sekadar masuk.</span></div><div class="clip caption" id="caption-006" data-start="12.511" data-duration="1.848" data-track-index="0"><span>Bagian luar adalah rumah kunci.</span></div><div class="clip caption" id="caption-007" data-start="14.370" data-duration="1.427" data-track-index="0"><span>Di dalamnya ada inti yang bisa</span></div><div class="clip caption" id="caption-008" data-start="15.809" data-duration="2.093" data-track-index="0"><span>berputar, dengan lubang anak kunci.</span></div><div class="clip caption" id="caption-009" data-start="17.914" data-duration="1.883" data-track-index="0"><span>Setiap ruang berisi pin bawah, pin</span></div><div class="clip caption" id="caption-010" data-start="19.809" data-duration="1.462" data-track-index="0"><span>atas, dan pegas.</span></div><div class="clip caption" id="caption-011" data-start="21.282" data-duration="1.672" data-track-index="0"><span>Panjang pin bawah mengikuti kedalaman</span></div><div class="clip caption" id="caption-012" data-start="22.967" data-duration="1.143" data-track-index="0"><span>gerigi pasangannya.</span></div><div class="clip caption" id="caption-013" data-start="24.125" data-duration="1.918" data-track-index="0"><span>Tanpa anak kunci, pegas mendorong pin</span></div><div class="clip caption" id="caption-014" data-start="26.054" data-duration="0.620" data-track-index="0"><span>turun.</span></div><div class="clip caption" id="caption-015" data-start="26.686" data-duration="1.704" data-track-index="0"><span>Pin atas melintasi batas inti dan</span></div><div class="clip caption" id="caption-016" data-start="28.405" data-duration="2.023" data-track-index="0"><span>rumah, sehingga putaran terhalang.</span></div><div class="clip caption" id="caption-017" data-start="30.440" data-duration="2.163" data-track-index="0"><span>Saat kunci masuk, geriginya mendorong pin</span></div><div class="clip caption" id="caption-018" data-start="32.616" data-duration="0.584" data-track-index="0"><span>bawah.</span></div><div class="clip caption" id="caption-019" data-start="33.212" data-duration="1.602" data-track-index="0"><span>Pin atas ikut naik, dan pegas</span></div><div class="clip caption" id="caption-020" data-start="34.826" data-duration="1.321" data-track-index="0"><span>di atasnya tertekan.</span></div><div class="clip caption" id="caption-021" data-start="36.160" data-duration="1.602" data-track-index="0"><span>Gerigi lebih tinggi dipasangkan dengan</span></div><div class="clip caption" id="caption-022" data-start="37.774" data-duration="1.251" data-track-index="0"><span>pin bawah lebih pendek.</span></div><div class="clip caption" id="caption-023" data-start="39.037" data-duration="1.774" data-track-index="0"><span>Gerigi lebih rendah memakai pin lebih</span></div><div class="clip caption" id="caption-024" data-start="40.826" data-duration="0.546" data-track-index="0"><span>panjang.</span></div><div class="clip caption" id="caption-025" data-start="41.489" data-duration="1.958" data-track-index="0"><span>Pada kunci yang cocok, semua pertemuan</span></div><div class="clip caption" id="caption-026" data-start="43.459" data-duration="1.672" data-track-index="0"><span>pin bawah dan pin atas tepat</span></div><div class="clip caption" id="caption-027" data-start="45.143" data-duration="2.304" data-track-index="0"><span>di batas putar, atau shear line.</span></div><div class="clip caption" id="caption-028" data-start="47.459" data-duration="1.321" data-track-index="0"><span>Satu gerigi terlalu rendah?</span></div><div class="clip caption" id="caption-029" data-start="48.792" data-duration="2.055" data-track-index="0"><span>Pin atas masih melintasi batas itu.</span></div><div class="clip caption" id="caption-030" data-start="50.862" data-duration="1.707" data-track-index="0"><span>Inti tetap tidak bisa berputar.</span></div><div class="clip caption" id="caption-031" data-start="52.582" data-duration="0.935" data-track-index="0"><span>Terlalu tinggi?</span></div><div class="clip caption" id="caption-032" data-start="53.529" data-duration="1.918" data-track-index="0"><span>Justru pin bawah menyeberang ke rumah.</span></div><div class="clip caption" id="caption-033" data-start="55.459" data-duration="2.199" data-track-index="0"><span>Lebih tinggi bukan berarti lebih cocok.</span></div><div class="clip caption" id="caption-034" data-start="57.669" data-duration="2.082" data-track-index="0"><span>Saat semuanya sejajar, inti dan pin</span></div><div class="clip caption" id="caption-035" data-start="59.763" data-duration="1.859" data-track-index="0"><span>bawah berputar bersama anak kunci.</span></div><div class="clip caption" id="caption-036" data-start="61.634" data-duration="1.427" data-track-index="0"><span>Pin atas tetap di rumah.</span></div><div class="clip caption" id="caption-037" data-start="63.073" data-duration="1.532" data-track-index="0"><span>Pegas juga tetap di atas.</span></div><div class="clip caption" id="caption-038" data-start="64.617" data-duration="1.918" data-track-index="0"><span>Pemisahan tadi membuat rumah tidak ikut</span></div><div class="clip caption" id="caption-039" data-start="66.546" data-duration="0.806" data-track-index="0"><span>berputar.</span></div><div class="clip caption" id="caption-040" data-start="67.365" data-duration="1.696" data-track-index="0"><span>Penggerak belakang meneruskan putaran ke</span></div><div class="clip caption" id="caption-041" data-start="69.073" data-duration="1.462" data-track-index="0"><span>mekanisme pengunci pintu.</span></div><div class="clip caption" id="caption-042" data-start="70.546" data-duration="2.163" data-track-index="0"><span>Bentuk sambungannya berbeda antarproduk.</span></div><div class="clip caption" id="caption-043" data-start="72.722" data-duration="2.023" data-track-index="0"><span>Untuk mencabut kunci, inti dikembalikan</span></div><div class="clip caption" id="caption-044" data-start="74.757" data-duration="1.216" data-track-index="0"><span>ke posisi pelepasan.</span></div><div class="clip caption" id="caption-045" data-start="75.985" data-duration="1.918" data-track-index="0"><span>Pada contoh ini, ruang pin kembali</span></div><div class="clip caption" id="caption-046" data-start="77.915" data-duration="0.725" data-track-index="0"><span>sejajar.</span></div><div class="clip caption" id="caption-047" data-start="78.652" data-duration="2.160" data-track-index="0"><span>Saat kunci ditarik, pegas menurunkan pin</span></div><div class="clip caption" id="caption-048" data-start="80.827" data-duration="0.538" data-track-index="0"><span>lagi.</span></div><div class="clip caption" id="caption-049" data-start="81.377" data-duration="1.610" data-track-index="0"><span>Batas putar kembali terhalang.</span></div><div class="clip caption" id="caption-050" data-start="83.248" data-duration="1.602" data-track-index="0"><span>Gerigi bukan cuma pola.</span></div><div class="clip caption" id="caption-051" data-start="84.862" data-duration="1.392" data-track-index="0"><span>Bentuknya menyetel beberapa pin</span></div><div class="clip caption" id="caption-052" data-start="86.266" data-duration="2.757" data-track-index="0"><span>sekaligus, agar satu inti bisa berputar.</span></div></div><script>window.__timelines['captions']=gsap.timeline({paused:true});</script></template>
