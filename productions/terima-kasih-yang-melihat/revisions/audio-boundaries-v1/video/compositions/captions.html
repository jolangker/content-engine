<!doctype html><html lang="id"><head><meta charset="UTF-8"></head><body><template><style>
    @font-face{font-family:'DM Sans';src:url('assets/fonts/dm-sans.ttf')}
    #root{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none;font-family:'DM Sans',sans-serif}
    .caption-group{position:absolute;left:88px;top:1550px;width:848px;min-height:115px;text-align:center;font:500 46px/1.25 'DM Sans',sans-serif;overflow:visible;}
    </style><div id="root" data-composition-id="captions" data-start="0" data-duration="90.0" data-width="1080" data-height="1920"><div id="caption-000" class="clip caption-group" data-start="0.15500" data-duration="1.70600" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Makasih ya, udah masak.</div><div id="caption-001" class="clip caption-group" data-start="2.00100" data-duration="1.44000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Apa yang sebenarnya lo hargai</div><div id="caption-002" class="clip caption-group" data-start="3.44100" data-duration="1.26000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">dari dia malam itu?</div><div id="caption-003" class="clip caption-group" data-start="5.54725" data-duration="1.68000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Ini berkaitan dengan expressed</div><div id="caption-004" class="clip caption-group" data-start="7.22725" data-duration="2.00000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">gratitude, atau ungkapan rasa</div><div id="caption-005" class="clip caption-group" data-start="9.22725" data-duration="0.74000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">syukur:</div><div id="caption-006" class="clip caption-group" data-start="10.10725" data-duration="1.68000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">menyampaikan penghargaan atas</div><div id="caption-007" class="clip caption-group" data-start="11.78725" data-duration="1.54000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">kebaikan orang lain.</div><div id="caption-008" class="clip caption-group" data-start="13.61475" data-duration="1.48000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Dalam ucapan itu, lo bisa</div><div id="caption-009" class="clip caption-group" data-start="15.09475" data-duration="1.74000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">menceritakan manfaat buat diri</div><div id="caption-010" class="clip caption-group" data-start="16.97475" data-duration="1.86000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">lo, sekaligus menghargai tindakan</div><div id="caption-011" class="clip caption-group" data-start="19.05475" data-duration="0.42600" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">dia.</div><div id="caption-012" class="clip caption-group" data-start="19.76225" data-duration="1.46000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Misalnya, lo pulang</div><div id="caption-013" class="clip caption-group" data-start="21.36225" data-duration="0.64000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">capek.</div><div id="caption-014" class="clip caption-group" data-start="22.00225" data-duration="1.72000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Makanan udah siap, jadi lo</div><div id="caption-015" class="clip caption-group" data-start="23.72225" data-duration="1.38000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">bisa langsung istirahat.</div><div id="caption-016" class="clip caption-group" data-start="25.45225" data-duration="1.52000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Gua jadi nggak perlu masak.</div><div id="caption-017" class="clip caption-group" data-start="26.97225" data-duration="1.84000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kalimat ini menceritakan manfaat</div><div id="caption-018" class="clip caption-group" data-start="28.81225" data-duration="1.14700" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">yang lo terima.</div><div id="caption-019" class="clip caption-group" data-start="30.23975" data-duration="1.68000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Sekarang lihat tindakannya:</div><div id="caption-020" class="clip caption-group" data-start="31.91975" data-duration="2.04000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">dia meluangkan waktu, menyiapkan</div><div id="caption-021" class="clip caption-group" data-start="33.95975" data-duration="1.88000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">bahan, lalu memasak setelah</div><div id="caption-022" class="clip caption-group" data-start="35.83975" data-duration="1.50000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">kegiatannya sendiri.</div><div id="caption-023" class="clip caption-group" data-start="37.58725" data-duration="1.76000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Saat lo menyebut usaha itu,</div><div id="caption-024" class="clip caption-group" data-start="39.34725" data-duration="1.76000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">ucapan terima kasih memberi tempat</div><div id="caption-025" class="clip caption-group" data-start="41.10725" data-duration="1.39600" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">buat kontribusinya.</div><div id="caption-026" class="clip caption-group" data-start="42.85475" data-duration="1.92000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">Orang yang membantu ikut hadir</div><div id="caption-027" class="clip caption-group" data-start="44.77475" data-duration="1.22700" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">dalam ucapan lo.</div><div id="caption-028" class="clip caption-group" data-start="46.79475" data-duration="1.38000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Dalam penelitian percakapan</div><div id="caption-029" class="clip caption-group" data-start="48.19475" data-duration="1.56000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">pasangan, penghargaan yang</div><div id="caption-030" class="clip caption-group" data-start="49.75475" data-duration="1.80000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">berfokus pada pasangan berkaitan</div><div id="caption-031" class="clip caption-group" data-start="51.55475" data-duration="1.80000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">dengan perasaan lebih disayangi</div><div id="caption-032" class="clip caption-group" data-start="53.35475" data-duration="1.06900" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">sesudahnya.</div><div id="caption-033" class="clip caption-group" data-start="54.75350" data-duration="1.68000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">Temuan ini nggak menjamin satu</div><div id="caption-034" class="clip caption-group" data-start="56.43350" data-duration="1.76000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">kalimat bikin hubungan membaik,</div><div id="caption-035" class="clip caption-group" data-start="58.19350" data-duration="1.68000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">atau menghapus masalah yang perlu</div><div id="caption-036" class="clip caption-group" data-start="59.87350" data-duration="0.98800" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">dibahas.</div><div id="caption-037" class="clip caption-group" data-start="61.75600" data-duration="1.62000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Coba sebut satu tindakan yang</div><div id="caption-038" class="clip caption-group" data-start="63.39600" data-duration="1.64000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">benar-benar lo perhatikan.</div><div id="caption-039" class="clip caption-group" data-start="65.03600" data-duration="1.70500" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Nggak perlu pujian berlebihan.</div><div id="caption-040" class="clip caption-group" data-start="67.10450" data-duration="1.60000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Makasih udah nyiapin makan walau</div><div id="caption-041" class="clip caption-group" data-start="68.70450" data-duration="1.36000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">hari lo juga padat.</div><div id="caption-042" class="clip caption-group" data-start="70.06450" data-duration="1.36000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Gua menghargai waktu yang lo</div><div id="caption-043" class="clip caption-group" data-start="71.42450" data-duration="0.82700" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">luangin.</div><div id="caption-044" class="clip caption-group" data-start="72.63450" data-duration="2.37300" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kalau belum tahu ceritanya, tanya.</div><div id="caption-045" class="clip caption-group" data-start="75.00750" data-duration="1.56700" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Jangan mengarang pengorbanan yang</div><div id="caption-046" class="clip caption-group" data-start="76.59450" data-duration="1.34700" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">dia nggak ceritakan.</div><div id="caption-047" class="clip caption-group" data-start="78.27325" data-duration="2.16000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Lalu beri ruang buat jawabannya,</div><div id="caption-048" class="clip caption-group" data-start="80.43325" data-duration="1.56700" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">tanpa menagih balasan.</div><div id="caption-049" class="clip caption-group" data-start="82.28500" data-duration="1.50700" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Jadi, apa yang lo hargai</div><div id="caption-050" class="clip caption-group" data-start="83.79200" data-duration="1.34600" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">dari makan malam tadi?</div><div id="caption-051" class="clip caption-group" data-start="85.57600" data-duration="1.94700" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Coba ucapkan satu usaha nyata</div><div id="caption-052" class="clip caption-group" data-start="87.52300" data-duration="1.46000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">yang lo lihat darinya.</div></div><script>const tl=gsap.timeline({paused:true});tl.to({},{duration:90.0},0);window.__timelines=window.__timelines||{};window.__timelines.captions=tl;</script></template></body></html>
