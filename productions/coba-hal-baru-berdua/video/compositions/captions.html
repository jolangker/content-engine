    </style><div data-hf-id="hf-l96d" id="root" data-composition-id="captions" data-width="1080" data-height="1920" data-duration="90.0"><div data-hf-id="hf-vjv7" id="caption-000" class="clip caption-group" data-start="0.05000000" data-duration="1.64253200" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Makan di tempat yang sama,</div><div data-hf-id="hf-vu07" id="caption-001" class="clip caption-group" data-start="1.78953481" data-duration="1.95182641" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">pulang lewat jalan yang sama.</div><div data-hf-id="hf-8kx0" id="caption-002" class="clip caption-group" data-start="3.91716516" data-duration="1.83362472" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kok waktu berdua terasa itu-itu</div><div data-hf-id="hf-8reu" id="caption-003" class="clip caption-group" data-start="5.84779269" data-duration="0.61220731" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">lagi?</div><div data-hf-id="hf-kbvv" id="caption-004" class="clip caption-group" data-start="7.32312500" data-duration="2.21371728" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Ada konsep self-expansion, atau</div><div data-hf-id="hf-0io4" id="caption-005" class="clip caption-group" data-start="9.53684228" data-duration="1.22136125" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">perluasan diri:</div><div data-hf-id="hf-ng0b" id="caption-006" class="clip caption-group" data-start="10.75820353" data-duration="1.42460341" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">bertambahnya pengalaman,</div><div data-hf-id="hf-cqsh" id="caption-007" class="clip caption-group" data-start="12.18280694" data-duration="2.53031806" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">kemampuan, atau cara pandang kita.</div><div data-hf-id="hf-1kw2" id="caption-008" class="clip caption-group" data-start="15.30187500" data-duration="1.43283961" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Dalam hubungan, salah satu</div><div data-hf-id="hf-4ybn" id="caption-009" class="clip caption-group" data-start="16.73471461" data-duration="0.79183242" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">jalannya:</div><div data-hf-id="hf-l1hn" id="caption-010" class="clip caption-group" data-start="17.52654703" data-duration="1.47054591" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">mencoba hal baru dan menarik</div><div data-hf-id="hf-dk6k" id="caption-011" class="clip caption-group" data-start="18.99709294" data-duration="0.85978206" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">bersama.</div><div data-hf-id="hf-wam0" id="caption-012" class="clip caption-group" data-start="20.39062500" data-duration="1.94926380" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Misalnya, tiap akhir pekan kalian</div><div data-hf-id="hf-igun" id="caption-013" class="clip caption-group" data-start="22.33988880" data-duration="1.56705522" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">makan, lalu pulang.</div><div data-hf-id="hf-t93m" id="caption-014" class="clip caption-group" data-start="23.90694402" data-duration="2.01104294" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Nyaman, tapi kali ini terasa</div><div data-hf-id="hf-7jb8" id="caption-015" class="clip caption-group" data-start="25.97087040" data-duration="0.74975460" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">datar.</div><div data-hf-id="hf-gv68" id="caption-016" class="clip caption-group" data-start="27.32062500" data-duration="1.35314685" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kebersamaannya ada.</div><div data-hf-id="hf-6l7b" id="caption-017" class="clip caption-group" data-start="28.67377185" data-duration="1.35314686" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Yang terasa kurang bisa jadi</div><div data-hf-id="hf-ec0y" id="caption-018" class="clip caption-group" data-start="30.02691871" data-duration="1.65384615" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">kesempatan mengalami sesuatu yang</div><div data-hf-id="hf-s53g" id="caption-019" class="clip caption-group" data-start="31.68076486" data-duration="1.11486014" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">belum biasa.</div><div data-hf-id="hf-qg29" id="caption-020" class="clip caption-group" data-start="33.32437500" data-duration="1.70443652" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Saat belajar resep baru, kalian</div><div data-hf-id="hf-aidc" id="caption-021" class="clip caption-group" data-start="35.02881152" data-duration="1.83556348" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">sama-sama belum tahu hasilnya.</div><div data-hf-id="hf-vb7u" id="caption-022" class="clip caption-group" data-start="37.37312500" data-duration="2.04485648" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Lo mencoba menguleni, dia membaca</div><div data-hf-id="hf-ng9t" id="caption-023" class="clip caption-group" data-start="39.41798148" data-duration="0.80752897" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">langkahnya.</div><div data-hf-id="hf-ph91" id="caption-024" class="clip caption-group" data-start="40.22551045" data-duration="1.46453379" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Lalu bergantian saat adonannya</div><div data-hf-id="hf-7h3b" id="caption-025" class="clip caption-group" data-start="41.69004424" data-duration="1.09308076" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">susah dibentuk.</div><div data-hf-id="hf-10f0" id="caption-026" class="clip caption-group" data-start="43.32687500" data-duration="1.23438695" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">Ada sisi pasangan yang baru</div><div data-hf-id="hf-lduj" id="caption-027" class="clip caption-group" data-start="44.56126195" data-duration="2.00587880" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">kelihatan ketika kalian menghadapi</div><div data-hf-id="hf-a1cx" id="caption-028" class="clip caption-group" data-start="46.56714075" data-duration="1.64973425" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">hal yang belum dikuasai.</div><div data-hf-id="hf-8iyv" id="caption-029" class="clip caption-group" data-start="49.18687500" data-duration="1.99858176" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Penelitian menemukan kegiatan baru</div><div data-hf-id="hf-hc5x" id="caption-030" class="clip caption-group" data-start="51.18545676" data-duration="1.49893632" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">dan menggugah bersama dapat</div><div data-hf-id="hf-2cdh" id="caption-031" class="clip caption-group" data-start="52.68439308" data-duration="1.42206779" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">meningkatkan penilaian kualitas</div><div data-hf-id="hf-juj8" id="caption-032" class="clip caption-group" data-start="54.10646087" data-duration="1.95541413" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">hubungan sesaat setelahnya.</div><div data-hf-id="hf-wtc7" id="caption-033" class="clip caption-group" data-start="56.61625000" data-duration="1.05213109" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">Ini nggak menjamin hubungan</div><div data-hf-id="hf-knah" id="caption-034" class="clip caption-group" data-start="57.66838109" data-duration="1.94820833" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">membaik terus, atau menyelesaikan</div><div data-hf-id="hf-jewh" id="caption-035" class="clip caption-group" data-start="59.63210244" data-duration="1.40914756" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">masalah yang dibiarkan.</div><div data-hf-id="hf-i7i3" id="caption-036" class="clip caption-group" data-start="62.06750000" data-duration="1.47521486" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Mulai dari satu percobaan kecil</div><div data-hf-id="hf-pkns" id="caption-037" class="clip caption-group" data-start="63.54271486" data-duration="1.74978514" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">yang kalian berdua ingin coba.</div><div data-hf-id="hf-bwxw" id="caption-038" class="clip caption-group" data-start="65.77625000" data-duration="1.69063990" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Gua pengen bikin sesuatu bareng.</div><div data-hf-id="hf-nfdv" id="caption-039" class="clip caption-group" data-start="67.46688990" data-duration="1.45596185" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Sabtu kita coba resep ini,</div><div data-hf-id="hf-eokd" id="caption-040" class="clip caption-group" data-start="68.92285175" data-duration="0.56839825" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">mau?</div><div data-hf-id="hf-422z" id="caption-041" class="clip caption-group" data-start="70.05625000" data-duration="1.47638199" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kalau dia nggak tertarik, cari</div><div data-hf-id="hf-r0fh" id="caption-042" class="clip caption-group" data-start="71.53263199" data-duration="1.22157010" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">pilihan lain bersama.</div><div data-hf-id="hf-rq2z" id="caption-043" class="clip caption-group" data-start="72.75420209" data-duration="1.20704791" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Nggak perlu memaksa.</div><div data-hf-id="hf-k6xu" id="caption-044" class="clip caption-group" data-start="74.47562500" data-duration="1.70771094" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Selesai mencoba, tanyakan:</div><div data-hf-id="hf-mzah" id="caption-045" class="clip caption-group" data-start="76.18333594" data-duration="0.95364453" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">bagian mana yang paling lo</div><div data-hf-id="hf-3lh5" id="caption-046" class="clip caption-group" data-start="77.13698047" data-duration="1.05364453" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">nikmati tadi?</div><div data-hf-id="hf-kvi5" id="caption-047" class="clip caption-group" data-start="78.74500000" data-duration="0.93160247" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Yang dicari:</div><div data-hf-id="hf-7yeh" id="caption-048" class="clip caption-group" data-start="79.67660247" data-duration="1.91463716" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">pengalaman baru yang dibagi, tanpa</div><div data-hf-id="hf-3cke" id="caption-049" class="clip caption-group" data-start="81.59123963" data-duration="1.81376037" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">harus sempurna atau mahal.</div><div data-hf-id="hf-v08d" id="caption-050" class="clip caption-group" data-start="83.95500000" data-duration="1.54564634" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kalau waktu berdua terasa itu-itu</div><div data-hf-id="hf-zxyd" id="caption-051" class="clip caption-group" data-start="85.50064634" data-duration="1.65078567" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">lagi, hal kecil apa yang</div><div data-hf-id="hf-6m1q" id="caption-052" class="clip caption-group" data-start="87.15143201" data-duration="1.59356799" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">ingin kalian pelajari bareng?</div></div><script>const tl=gsap.timeline({paused:true});tl.to({},{duration:90.0},0);window.__timelines.captions=tl;</script></template>
