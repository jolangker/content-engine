    </style><div data-hf-id="hf-rkcv" id="root" data-composition-id="captions" data-start="0" data-duration="90.0" data-width="1080" data-height="1920"><div data-hf-id="hf-3hg9" id="caption-000" class="clip caption-group" data-start="0.15500" data-duration="1.66600" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Makan di tempat yang sama,</div><div data-hf-id="hf-t12v" id="caption-001" class="clip caption-group" data-start="1.92100" data-duration="1.98000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">pulang lewat jalan yang sama.</div><div data-hf-id="hf-g2q5" id="caption-002" class="clip caption-group" data-start="4.08100" data-duration="1.86000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kok waktu berdua terasa itu-itu</div><div data-hf-id="hf-m38m" id="caption-003" class="clip caption-group" data-start="6.04100" data-duration="0.62000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">lagi?</div><div data-hf-id="hf-75it" id="caption-004" class="clip caption-group" data-start="7.39413" data-duration="2.32000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Ada konsep self-expansion, atau</div><div data-hf-id="hf-lubm" id="caption-005" class="clip caption-group" data-start="9.71413" data-duration="1.28000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">perluasan diri:</div><div data-hf-id="hf-46t4" id="caption-006" class="clip caption-group" data-start="10.99413" data-duration="1.49300" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">bertambahnya pengalaman,</div><div data-hf-id="hf-h2q7" id="caption-007" class="clip caption-group" data-start="12.48713" data-duration="2.64700" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">kemampuan, atau cara pandang kita.</div><div data-hf-id="hf-8y65" id="caption-008" class="clip caption-group" data-start="15.34788" data-duration="1.52000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Dalam hubungan, salah satu</div><div data-hf-id="hf-wknj" id="caption-009" class="clip caption-group" data-start="16.86788" data-duration="0.84000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">jalannya:</div><div data-hf-id="hf-1cvd" id="caption-010" class="clip caption-group" data-start="17.70788" data-duration="1.56000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">mencoba hal baru dan menarik</div><div data-hf-id="hf-ofh1" id="caption-011" class="clip caption-group" data-start="19.26788" data-duration="0.90600" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">bersama.</div><div data-hf-id="hf-45zn" id="caption-012" class="clip caption-group" data-start="20.42162" data-duration="2.04001" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Misalnya, tiap akhir pekan kalian</div><div data-hf-id="hf-rfno" id="caption-013" class="clip caption-group" data-start="22.46163" data-duration="1.63999" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">makan, lalu pulang.</div><div data-hf-id="hf-bq7h" id="caption-014" class="clip caption-group" data-start="24.10162" data-duration="2.10000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Nyaman, tapi kali ini terasa</div><div data-hf-id="hf-p0yy" id="caption-015" class="clip caption-group" data-start="26.26162" data-duration="0.78000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">datar.</div><div data-hf-id="hf-iiq3" id="caption-016" class="clip caption-group" data-start="27.34663" data-duration="1.44000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kebersamaannya ada.</div><div data-hf-id="hf-1h8x" id="caption-017" class="clip caption-group" data-start="28.78663" data-duration="1.44000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Yang terasa kurang bisa jadi</div><div data-hf-id="hf-sjqa" id="caption-018" class="clip caption-group" data-start="30.22663" data-duration="1.76000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">kesempatan mengalami sesuatu yang</div><div data-hf-id="hf-9xtb" id="caption-019" class="clip caption-group" data-start="31.98663" data-duration="1.18000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">belum biasa.</div><div data-hf-id="hf-m6xc" id="caption-020" class="clip caption-group" data-start="33.45338" data-duration="1.80700" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Saat belajar resep baru, kalian</div><div data-hf-id="hf-umcr" id="caption-021" class="clip caption-group" data-start="35.26038" data-duration="1.93999" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">sama-sama belum tahu hasilnya.</div><div data-hf-id="hf-ze58" id="caption-022" class="clip caption-group" data-start="37.41412" data-duration="2.16001" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Lo mencoba menguleni, dia membaca</div><div data-hf-id="hf-3eyr" id="caption-023" class="clip caption-group" data-start="39.57413" data-duration="0.85300" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">langkahnya.</div><div data-hf-id="hf-ihgp" id="caption-024" class="clip caption-group" data-start="40.42713" data-duration="1.54700" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Lalu bergantian saat adonannya</div><div data-hf-id="hf-usix" id="caption-025" class="clip caption-group" data-start="41.97413" data-duration="1.14900" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">susah dibentuk.</div><div data-hf-id="hf-czqw" id="caption-026" class="clip caption-group" data-start="43.44788" data-duration="1.28000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">Ada sisi pasangan yang baru</div><div data-hf-id="hf-3iyy" id="caption-027" class="clip caption-group" data-start="44.72788" data-duration="2.08000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">kelihatan ketika kalian menghadapi</div><div data-hf-id="hf-v39n" id="caption-028" class="clip caption-group" data-start="46.80788" data-duration="1.70700" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">hal yang belum dikuasai.</div><div data-hf-id="hf-5lom" id="caption-029" class="clip caption-group" data-start="49.21788" data-duration="2.08000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Penelitian menemukan kegiatan baru</div><div data-hf-id="hf-tztg" id="caption-030" class="clip caption-group" data-start="51.29788" data-duration="1.56000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">dan menggugah bersama dapat</div><div data-hf-id="hf-j49r" id="caption-031" class="clip caption-group" data-start="52.85788" data-duration="1.47999" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">meningkatkan penilaian kualitas</div><div data-hf-id="hf-e2fw" id="caption-032" class="clip caption-group" data-start="54.33787" data-duration="2.03101" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">hubungan sesaat setelahnya.</div><div data-hf-id="hf-8fb4" id="caption-033" class="clip caption-group" data-start="56.76425" data-duration="1.09300" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">Ini nggak menjamin hubungan</div><div data-hf-id="hf-erdp" id="caption-034" class="clip caption-group" data-start="57.85725" data-duration="2.02000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">membaik terus, atau menyelesaikan</div><div data-hf-id="hf-8kwm" id="caption-035" class="clip caption-group" data-start="59.89725" data-duration="1.46000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3">masalah yang dibiarkan.</div><div data-hf-id="hf-jmjj" id="caption-036" class="clip caption-group" data-start="62.26050" data-duration="1.53800" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Mulai dari satu percobaan kecil</div><div data-hf-id="hf-8b5x" id="caption-037" class="clip caption-group" data-start="63.79850" data-duration="1.82000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">yang kalian berdua ingin coba.</div><div data-hf-id="hf-zzgq" id="caption-038" class="clip caption-group" data-start="65.90925" data-duration="1.76500" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Gua pengen bikin sesuatu bareng.</div><div data-hf-id="hf-ubjv" id="caption-039" class="clip caption-group" data-start="67.67425" data-duration="1.52000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Sabtu kita coba resep ini,</div><div data-hf-id="hf-po4m" id="caption-040" class="clip caption-group" data-start="69.19425" data-duration="0.58900" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">mau?</div><div data-hf-id="hf-pz1f" id="caption-041" class="clip caption-group" data-start="70.17225" data-duration="1.54700" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kalau dia nggak tertarik, cari</div><div data-hf-id="hf-uiun" id="caption-042" class="clip caption-group" data-start="71.71925" data-duration="1.28000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">pilihan lain bersama.</div><div data-hf-id="hf-13sq" id="caption-043" class="clip caption-group" data-start="72.99925" data-duration="1.26000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Nggak perlu memaksa.</div><div data-hf-id="hf-nalm" id="caption-044" class="clip caption-group" data-start="74.65162" data-duration="1.81401" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Selesai mencoba, tanyakan:</div><div data-hf-id="hf-pw5y" id="caption-045" class="clip caption-group" data-start="76.46563" data-duration="1.01299" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">bagian mana yang paling lo</div><div data-hf-id="hf-z1rn" id="caption-046" class="clip caption-group" data-start="77.47862" data-duration="1.11300" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">nikmati tadi?</div><div data-hf-id="hf-3q7d" id="caption-047" class="clip caption-group" data-start="78.86500" data-duration="0.96000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Yang dicari:</div><div data-hf-id="hf-mbuo" id="caption-048" class="clip caption-group" data-start="79.82500" data-duration="1.97300" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">pengalaman baru yang dibagi, tanpa</div><div data-hf-id="hf-y5kj" id="caption-049" class="clip caption-group" data-start="81.79800" data-duration="1.86600" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">harus sempurna atau mahal.</div><div data-hf-id="hf-lsh0" id="caption-050" class="clip caption-group" data-start="84.11100" data-duration="1.57300" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">Kalau waktu berdua terasa itu-itu</div><div data-hf-id="hf-accl" id="caption-051" class="clip caption-group" data-start="85.68400" data-duration="1.68000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">lagi, hal kecil apa yang</div><div data-hf-id="hf-iktb" id="caption-052" class="clip caption-group" data-start="87.36400" data-duration="1.62000" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28">ingin kalian pelajari bareng?</div></div><script>const tl=gsap.timeline({paused:true});tl.to({},{duration:90.0},0);window.__timelines=window.__timelines||{};window.__timelines.captions=tl;</script></template></body></html>
