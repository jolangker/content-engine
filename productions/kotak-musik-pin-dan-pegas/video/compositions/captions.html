<template><style>@font-face{font-family:Manrope;src:url('assets/fonts/manrope.ttf');font-weight:200 800}#root{position:absolute;inset:0;pointer-events:none}.cap{position:absolute;left:108px;top:1180px;width:795px;font:600 44px/1.25 Manrope,sans-serif;color:#172B3B;text-align:left;background:#ECEEE9;padding:4px 0}</style><div data-hf-id="hf-ov84" id="root" data-composition-id="captions" data-width="1080" data-height="1920"><div data-hf-id="hf-52jb" id="cap-000" class="clip cap" data-start="0.367000" data-duration="1.373000">Kotak ini bisa memainkan</div><div data-hf-id="hf-3h93" id="cap-001" class="clip cap" data-start="1.740000" data-duration="1.410000">lagu tanpa baterai.</div><div data-hf-id="hf-qiy3" id="cap-002" class="clip cap" data-start="3.260000" data-duration="1.446000">Siapa yang menyimpan nadanya?</div><div data-hf-id="hf-duv6" id="cap-003" class="clip cap" data-start="5.020000" data-duration="1.120000">Kita buka kotak musik</div><div data-hf-id="hf-fzlv" id="cap-004" class="clip cap" data-start="6.140000" data-duration="2.000000">pegas, dengan silinder berpaku</div><div data-hf-id="hf-sp0q" id="cap-005" class="clip cap" data-start="8.140000" data-duration="1.440000">dan pengatur kecepatan jenis</div><div data-hf-id="hf-2i1f" id="cap-006" class="clip cap" data-start="9.580000" data-duration="0.920000">gesek.</div><div data-hf-id="hf-fybb" id="cap-007" class="clip cap" data-start="10.500000" data-duration="1.800000">Saat kuncinya diputar, pegas</div><div data-hf-id="hf-16vw" id="cap-008" class="clip cap" data-start="12.300000" data-duration="1.480000">di dalam rumahnya digulung</div><div data-hf-id="hf-2zxi" id="cap-009" class="clip cap" data-start="13.780000" data-duration="1.533000">untuk menyimpan energi.</div><div data-hf-id="hf-ydqo" id="cap-010" class="clip cap" data-start="15.313000" data-duration="1.987000">Ketika mekanisme berjalan, pegas</div><div data-hf-id="hf-phbl" id="cap-011" class="clip cap" data-start="17.300000" data-duration="1.520000">mengendur dan menggerakkan roda</div><div data-hf-id="hf-ohl3" id="cap-012" class="clip cap" data-start="18.820000" data-duration="1.120000">gigi penggerak.</div><div data-hf-id="hf-l6zy" id="cap-013" class="clip cap" data-start="19.940000" data-duration="1.120000">Gigi yang saling bertaut</div><div data-hf-id="hf-mx7h" id="cap-014" class="clip cap" data-start="21.060000" data-duration="2.280000">meneruskan putaran, menuju silinder</div><div data-hf-id="hf-n5fk" id="cap-015" class="clip cap" data-start="23.340000" data-duration="2.130000">dan rangkaian pengatur kecepatan.</div><div data-hf-id="hf-0em5" id="cap-016" class="clip cap" data-start="25.580000" data-duration="1.440000">Silinder ini bukan pengeras</div><div data-hf-id="hf-asd8" id="cap-017" class="clip cap" data-start="27.020000" data-duration="0.840000">suara.</div><div data-hf-id="hf-1grc" id="cap-018" class="clip cap" data-start="27.860000" data-duration="1.680000">Di permukaannya, ada pin</div><div data-hf-id="hf-g3jk" id="cap-019" class="clip cap" data-start="29.540000" data-duration="1.120000">yang menonjol.</div><div data-hf-id="hf-mqfp" id="cap-020" class="clip cap" data-start="30.660000" data-duration="1.400000">Letak pin menentukan gigi</div><div data-hf-id="hf-d5uc" id="cap-021" class="clip cap" data-start="32.060000" data-duration="1.440000">sisir mana yang dipetik,</div><div data-hf-id="hf-zuje" id="cap-022" class="clip cap" data-start="33.500000" data-duration="1.320000">dan kapan petikan itu</div><div data-hf-id="hf-lkxm" id="cap-023" class="clip cap" data-start="34.820000" data-duration="0.770000">terjadi.</div><div data-hf-id="hf-wjtl" id="cap-024" class="clip cap" data-start="35.804000" data-duration="1.266000">Perhatikan satu pin.</div><div data-hf-id="hf-o39w" id="cap-025" class="clip cap" data-start="37.180000" data-duration="1.680000">Saat mendekat, pin mengangkat</div><div data-hf-id="hf-4139" id="cap-026" class="clip cap" data-start="38.860000" data-duration="1.760000">ujung gigi sisir logam.</div><div data-hf-id="hf-d8ix" id="cap-027" class="clip cap" data-start="40.620000" data-duration="1.400000">Setelah pin lewat, gigi</div><div data-hf-id="hf-h89l" id="cap-028" class="clip cap" data-start="42.020000" data-duration="1.730000">itu terlepas dan bergetar.</div><div data-hf-id="hf-3xh7" id="cap-029" class="clip cap" data-start="43.820000" data-duration="1.520000">Getaran inilah yang menghasilkan</div><div data-hf-id="hf-fa31" id="cap-030" class="clip cap" data-start="45.340000" data-duration="0.760000">nada.</div><div data-hf-id="hf-m3r4" id="cap-031" class="clip cap" data-start="46.100000" data-duration="1.760000">Gigi-gigi sisir disetel untuk</div><div data-hf-id="hf-n818" id="cap-032" class="clip cap" data-start="47.860000" data-duration="1.160000">nada berbeda.</div><div data-hf-id="hf-vto6" id="cap-033" class="clip cap" data-start="49.020000" data-duration="2.280000">Urutan petikannya membentuk lagu.</div><div data-hf-id="hf-di7p" id="cap-034" class="clip cap" data-start="51.300000" data-duration="1.520000">Tapi putaran juga perlu</div><div data-hf-id="hf-mggg" id="cap-035" class="clip cap" data-start="52.820000" data-duration="1.000000">dibatasi.</div><div data-hf-id="hf-orxr" id="cap-036" class="clip cap" data-start="53.820000" data-duration="1.520000">Rangkaian roda gigi ikut</div><div data-hf-id="hf-8ojg" id="cap-037" class="clip cap" data-start="55.340000" data-duration="1.600000">memutar governor, pengatur</div><div data-hf-id="hf-puxb" id="cap-038" class="clip cap" data-start="56.940000" data-duration="1.080000">kecepatannya.</div><div data-hf-id="hf-texs" id="cap-039" class="clip cap" data-start="58.020000" data-duration="1.400000">Pada jenis ini, dua</div><div data-hf-id="hf-2c46" id="cap-040" class="clip cap" data-start="59.420000" data-duration="1.440000">sayap lentur mengembang saat</div><div data-hf-id="hf-owly" id="cap-041" class="clip cap" data-start="60.860000" data-duration="1.880000">berputar, lalu menyentuh dinding</div><div data-hf-id="hf-f1pi" id="cap-042" class="clip cap" data-start="62.740000" data-duration="0.960000">cakram.</div><div data-hf-id="hf-sin5" id="cap-043" class="clip cap" data-start="63.700000" data-duration="2.040000">Sentuhan itu menimbulkan gesekan,</div><div data-hf-id="hf-nxue" id="cap-044" class="clip cap" data-start="65.740000" data-duration="1.520000">yang menahan laju mekanisme</div><div data-hf-id="hf-hmml" id="cap-045" class="clip cap" data-start="67.260000" data-duration="2.000000">agar tidak melesat bebas.</div><div data-hf-id="hf-8mri" id="cap-046" class="clip cap" data-start="69.260000" data-duration="2.360000">Jadi, governor mengatur laju.</div><div data-hf-id="hf-mr7i" id="cap-047" class="clip cap" data-start="71.620000" data-duration="1.240000">Pola pin memilih urutan</div><div data-hf-id="hf-rema" id="cap-048" class="clip cap" data-start="72.860000" data-duration="2.690000">petikan; sisir menghasilkan nadanya.</div><div data-hf-id="hf-p38r" id="cap-049" class="clip cap" data-start="75.820000" data-duration="2.240000">Selama lagu berjalan, pegas,</div><div data-hf-id="hf-n85o" id="cap-050" class="clip cap" data-start="78.060000" data-duration="1.920000">roda gigi, silinder, dan</div><div data-hf-id="hf-a8vf" id="cap-051" class="clip cap" data-start="79.980000" data-duration="2.000000">governor bekerja sebagai satu</div><div data-hf-id="hf-dg4l" id="cap-052" class="clip cap" data-start="81.980000" data-duration="0.690000">rangkaian.</div><div data-hf-id="hf-0v5u" id="cap-053" class="clip cap" data-start="83.002000" data-duration="1.908000">Tenaganya tersimpan di pegas.</div><div data-hf-id="hf-zz11" id="cap-054" class="clip cap" data-start="85.100000" data-duration="1.680000">Lagunya tersusun sebagai pola</div><div data-hf-id="hf-x5ei" id="cap-055" class="clip cap" data-start="86.780000" data-duration="1.440000">pin, yang dibaca lewat</div><div data-hf-id="hf-6x0c" id="cap-056" class="clip cap" data-start="88.220000" data-duration="1.090000">petikan logam.</div></div><script>window.__timelines['captions']=gsap.timeline({paused:true}).to({},{duration:90},0);</script></template>
