<template><style>@font-face{font-family:Newsreader;src:url('assets/fonts/newsreader.ttf')}@font-face{font-family:Newsreader;src:url('assets/fonts/newsreader-italic.ttf');font-style:italic}@font-face{font-family:'DM Sans';src:url('assets/fonts/dm-sans.ttf')}#root{position:absolute;inset:0;width:100%;height:100%;overflow:hidden}.cap{position:absolute;left:88px;top:1550px;width:848px;height:190px;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none}.cap>div{max-width:848px;padding:14px 22px;background:#F3EDE3;color:#302B28;font:500 46px/1.25 'DM Sans',sans-serif;text-align:center;box-sizing:border-box}
.cap{opacity:1}</style><div data-hf-id="hf-7c31" id="root" data-composition-id="captions" data-width="1080" data-height="1920" data-duration="86.1"><div data-hf-id="hf-op3m" id="caption-000" class="clip cap" data-start="0.36500000" data-duration="1.87928571" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-9gch" style="background:#F3EDE3;color:#302B28">Lo akhirnya dapat promosi.</div></div><div data-hf-id="hf-fgpf" id="caption-001" class="clip cap" data-start="2.40928571" data-duration="2.04428572" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-bcv4" style="background:#F3EDE3;color:#302B28">Hal pertama yang lo pengen: cerita ke</div></div><div data-hf-id="hf-7tgr" id="caption-002" class="clip cap" data-start="4.45357143" data-duration="2.37142857" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-sxte" style="background:#F3EDE3;color:#302B28">dia, orang yang tahu perjuangan lo.</div></div><div data-hf-id="hf-qwdm" id="caption-003" class="clip cap" data-start="7.14500000" data-duration="2.11525714" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-8c0g" style="background:#F3EDE3;color:#302B28">Dia jawab, oh, bagus.</div></div><div data-hf-id="hf-hg9u" id="caption-004" class="clip cap" data-start="9.26025714" data-duration="1.56685715" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-qitt" style="background:#F3EDE3;color:#302B28">Lalu lanjut melihat layar.</div></div><div data-hf-id="hf-pyht" id="caption-005" class="clip cap" data-start="10.82711429" data-duration="2.52862857" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-kdsn" style="background:#F3EDE3;color:#302B28">Lo ikut diam, padahal tadi pengen cerita</div></div><div data-hf-id="hf-16lm" id="caption-006" class="clip cap" data-start="13.41242857" data-duration="0.68757143" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-0n5l" style="background:#F3EDE3;color:#302B28">panjang.</div></div><div data-hf-id="hf-pair" id="caption-007" class="clip cap" data-start="14.41500000" data-duration="1.73185430" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3"><div data-hf-id="hf-pwh8" style="background:#302B28;color:#F3EDE3">Kabar baiknya tetap ada.</div></div><div data-hf-id="hf-c2qm" id="caption-008" class="clip cap" data-start="16.14685430" data-duration="1.95774835" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3"><div data-hf-id="hf-9p0v" style="background:#302B28;color:#F3EDE3">Tapi rasa senangnya bisa mengecil ketika</div></div><div data-hf-id="hf-63fi" id="caption-009" class="clip cap" data-start="18.10460265" data-duration="2.09539735" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#F3EDE3"><div data-hf-id="hf-eos5" style="background:#302B28;color:#F3EDE3">ceritanya seperti nggak mendapat tempat.</div></div><div data-hf-id="hf-pp68" id="caption-010" class="clip cap" data-start="20.49500000" data-duration="1.73948148" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-15jh" style="background:#F3EDE3;color:#302B28">Ini belum cukup buat menyimpulkan dia nggak</div></div><div data-hf-id="hf-vgko" id="caption-011" class="clip cap" data-start="22.23448148" data-duration="2.79829630" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-w1pu" style="background:#F3EDE3;color:#302B28">peduli. Mungkin dia terdistraksi; kita belum</div></div><div data-hf-id="hf-y47e" id="caption-012" class="clip cap" data-start="25.03277778" data-duration="0.66722222" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-8lw6" style="background:#F3EDE3;color:#302B28">tahu.</div></div><div data-hf-id="hf-16sg" id="caption-013" class="clip cap" data-start="25.95500000" data-duration="2.48844105" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-0qqb" style="background:#F3EDE3;color:#302B28">Dalam riset hubungan, berbagi kejadian positif</div></div><div data-hf-id="hf-7537" id="caption-014" class="clip cap" data-start="28.44344105" data-duration="2.99155895" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-6evy" style="background:#F3EDE3;color:#302B28">ke orang dekat dibahas sebagai capitalization.</div></div><div data-hf-id="hf-lwtf" id="caption-015" class="clip cap" data-start="31.66500000" data-duration="2.60774635" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-v6eo" style="background:#F3EDE3;color:#302B28">Kesempatan buat menikmati lagi kabar itu, sambil</div></div><div data-hf-id="hf-ly7m" id="caption-016" class="clip cap" data-start="34.27274635" data-duration="2.49225365" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-q7g0" style="background:#F3EDE3;color:#302B28">merasakan bagaimana orang dekat menyambutnya.</div></div><div data-hf-id="hf-afik" id="caption-017" class="clip cap" data-start="36.99500000" data-duration="1.97490835" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-hvgz" style="background:#F3EDE3;color:#302B28">Respons aktif-konstruktif menunjukkan</div></div><div data-hf-id="hf-2ksl" id="caption-018" class="clip cap" data-start="38.96990835" data-duration="3.03041548" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-hrt2" style="background:#F3EDE3;color:#302B28">keterlibatan dan antusiasme: ikut senang,</div></div><div data-hf-id="hf-yb42" id="caption-019" class="clip cap" data-start="42.00294162" data-duration="2.22205838" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-ul6g" style="background:#F3EDE3;color:#302B28">bertanya, memberi ruang buat cerita.</div></div><div data-hf-id="hf-46uh" id="caption-020" class="clip cap" data-start="44.40500000" data-duration="2.39960100" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-7ynp" style="background:#F3EDE3;color:#302B28">Fokusnya perhatian yang terasa, bukan harus</div></div><div data-hf-id="hf-j2op" id="caption-021" class="clip cap" data-start="46.80460100" data-duration="2.63182045" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-4v05" style="background:#F3EDE3;color:#302B28">heboh. Suara tenang pun bisa menunjukkan minat</div></div><div data-hf-id="hf-k25c" id="caption-022" class="clip cap" data-start="49.43642145" data-duration="0.88857855" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-hd02" style="background:#F3EDE3;color:#302B28">yang tulus.</div></div><div data-hf-id="hf-tfni" id="caption-023" class="clip cap" data-start="50.48500000" data-duration="2.28408100" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-4fmb" style="background:#F3EDE3;color:#302B28">Penelitian mengaitkan respons seperti ini dengan</div></div><div data-hf-id="hf-5n2v" id="caption-024" class="clip cap" data-start="52.76908100" data-duration="2.03464174" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-w433" style="background:#F3EDE3;color:#302B28">kedekatan dan kepuasan hubungan.</div></div><div data-hf-id="hf-wy5y" id="caption-025" class="clip cap" data-start="54.80372274" data-duration="2.06127726" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-kzqn" style="background:#F3EDE3;color:#302B28">Ada kaitan, bukan jaminan.</div></div><div data-hf-id="hf-4n6g" id="caption-026" class="clip cap" data-start="57.05500000" data-duration="2.17104478" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-2ak0" style="background:#F3EDE3;color:#302B28">Misalnya: wah, akhirnya!</div></div><div data-hf-id="hf-nlbf" id="caption-027" class="clip cap" data-start="59.22604478" data-duration="1.60211473" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-ttcq" style="background:#F3EDE3;color:#302B28">Bagian mana yang paling bikin lo senang?</div></div><div data-hf-id="hf-lsih" id="caption-028" class="clip cap" data-start="60.82815951" data-duration="1.52184049" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-wjd3" style="background:#F3EDE3;color:#302B28">Gue pengen denger ceritanya.</div></div><div data-hf-id="hf-gbbk" id="caption-029" class="clip cap" data-start="62.54500000" data-duration="2.37623921" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-aneu" style="background:#F3EDE3;color:#302B28">Lalu tanggapi usahanya: gue inget lo nyiapin</div></div><div data-hf-id="hf-ayr4" id="caption-030" class="clip cap" data-start="64.92123921" data-duration="2.52647482" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-7crt" style="background:#F3EDE3;color:#302B28">ini berbulan-bulan. Pasti berarti banget buat</div></div><div data-hf-id="hf-f1yz" id="caption-031" class="clip cap" data-start="67.57519604" data-duration="0.33980396" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-10mp" style="background:#F3EDE3;color:#302B28">lo.</div></div><div data-hf-id="hf-e5q8" id="caption-032" class="clip cap" data-start="68.13000000" data-duration="2.61208288" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-afgq" style="background:#F3EDE3;color:#302B28">Kalau ada kekhawatiran, itu bisa dibahas juga.</div></div><div data-hf-id="hf-i9ag" id="caption-033" class="clip cap" data-start="70.74208288" data-duration="2.54175105" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-cksu" style="background:#F3EDE3;color:#302B28">Beri kesempatan buat menikmati kabarnya sebelum</div></div><div data-hf-id="hf-ghpo" id="caption-034" class="clip cap" data-start="73.30198317" data-duration="1.24801683" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-6tyq" style="background:#F3EDE3;color:#302B28">masuk ke risikonya.</div></div><div data-hf-id="hf-x2dk" id="caption-035" class="clip cap" data-start="74.73000000" data-duration="2.16258342" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-8dot" style="background:#F3EDE3;color:#302B28">Kalau lo yang cerita, lo bisa bilang:</div></div><div data-hf-id="hf-vsqc" id="caption-036" class="clip cap" data-start="76.89258342" data-duration="1.80580962" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-iof8" style="background:#F3EDE3;color:#302B28">gue lagi senang, mau bagi momen ini</div></div><div data-hf-id="hf-p7ap" id="caption-037" class="clip cap" data-start="78.69839304" data-duration="0.79160696" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-u1ly" style="background:#F3EDE3;color:#302B28">sebentar.</div></div><div data-hf-id="hf-bizc" id="caption-038" class="clip cap" data-start="79.66000000" data-duration="2.59374087" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-rp16" style="background:#F3EDE3;color:#302B28">Saat pasangan membawa kabar baik, apa respons</div></div><div data-hf-id="hf-0li8" id="caption-039" class="clip cap" data-start="82.25374087" data-duration="2.36125913" data-track-index="0" data-layout-allow-caption-zone="true" style="color:#302B28"><div data-hf-id="hf-68xq" style="background:#F3EDE3;color:#302B28">lo memberi ruang buat ikut menikmatinya?</div></div></div><script>const tl=gsap.timeline({paused:true});tl.to({},{duration:86.1},0);window.__timelines.captions=tl;</script></template>
