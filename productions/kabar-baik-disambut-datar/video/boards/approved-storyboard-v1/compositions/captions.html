#captions-root .caption span{display:block;background:#F3EDE3;padding:4px 16px;max-width:100%;border-radius:5px}</style><div data-hf-id="hf-m7jr" id="captions-root" data-composition-id="captions" data-width="1080" data-height="1920" data-duration="90"><div data-hf-id="hf-2jjc" id="caption-01" class="caption clip" data-start="0" data-duration="4"><span data-hf-id="hf-fqqa">Bayangin, lo pulang</span><span data-hf-id="hf-b7u4">bawa kabar baik.</span></div><div data-hf-id="hf-ow4v" id="caption-02" class="caption clip" data-start="4" data-duration="4"><span data-hf-id="hf-i5h8">“Tadi presentasi gue</span><span data-hf-id="hf-t593">dipuji atasan.”</span></div><div data-hf-id="hf-919m" id="caption-03" class="caption clip" data-start="8" data-duration="4"><span data-hf-id="hf-dqnv">“Oh, bagus.”</span></div><div data-hf-id="hf-uhml" id="caption-04" class="caption clip" data-start="12" data-duration="9"><span data-hf-id="hf-mlq3">Semalam lo latihan</span><span data-hf-id="hf-z3y3">berkali-kali.</span></div><div data-hf-id="hf-cjfs" id="caption-05" class="caption clip" data-start="21" data-duration="7"><span data-hf-id="hf-ih7q">Jadi, pujian tadi</span><span data-hf-id="hf-43m5">terasa penting buat lo.</span></div><div data-hf-id="hf-98x0" id="caption-06" class="caption clip" data-start="28" data-duration="5"><span data-hf-id="hf-mvpz">“Ya udah.</span><span data-hf-id="hf-mgfa">Nggak usah cerita panjang.”</span></div><div data-hf-id="hf-2tpq" id="caption-07" class="caption clip" data-start="33" data-duration="6"><span data-hf-id="hf-6ftb">Berbagi kabar baik</span><span data-hf-id="hf-hr2e">dengan orang dekat.</span></div><div data-hf-id="hf-3n28" id="caption-08" class="caption clip" data-start="39" data-duration="9"><span data-hf-id="hf-inho">Respons yang antusias</span><span data-hf-id="hf-v1fj">dan terlibat.</span></div><div data-hf-id="hf-0ban" id="caption-09" class="caption clip" data-start="48" data-duration="3"><span data-hf-id="hf-8n3c">Di adegan tadi,</span><span data-hf-id="hf-p5t8">responsnya bisa begini:</span></div><div data-hf-id="hf-ah0v" id="caption-10" class="caption clip" data-start="51" data-duration="7"><span data-hf-id="hf-ec5f">“Ceritain, bagian mana</span><span data-hf-id="hf-gcrk">yang paling dipuji?”</span></div><div data-hf-id="hf-x3fb" id="caption-11" class="caption clip" data-start="58" data-duration="7"><span data-hf-id="hf-ei8z">Sekarang, detail yang tadinya</span><span data-hf-id="hf-qxor">ketahan punya tempat.</span></div><div data-hf-id="hf-ep9k" id="caption-12" class="caption clip" data-start="65" data-duration="7"><span data-hf-id="hf-lb81">Satu jawaban pendek</span><span data-hf-id="hf-n5pt">belum cukup buat menilai.</span></div><div data-hf-id="hf-0kd1" id="caption-13" class="caption clip" data-start="72" data-duration="10"><span data-hf-id="hf-qgtd">“Gue seneng dengernya.</span><span data-hf-id="hf-k5ok">Kasih gue sepuluh menit.”</span></div><div data-hf-id="hf-h7kc" id="caption-14" class="caption clip" data-start="82" data-duration="8"><span data-hf-id="hf-q7ff">Coba ingat kabar baik</span><span data-hf-id="hf-5yyz">terakhir yang dia bagi.</span></div></div><script>window.__timelines["captions"] = gsap.timeline({paused:true});</script></template></body></html>
