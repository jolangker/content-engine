3m" class="caption-line">minta orang lain yang maju.</span></div><div data-hf-id="hf-euqi" id="caption-10" class="caption" data-word-ids="w43 w44 w45"><span data-hf-id="hf-wtjl" class="caption-line">Jadi, pujian tadi</span></div><div data-hf-id="hf-h776" id="caption-11" class="caption" data-word-ids="w46 w47 w48 w49"><span data-hf-id="hf-ojoq" class="caption-line">terasa penting buat lo.</span></div><div data-hf-id="hf-a5jh" id="caption-12" class="caption" data-word-ids="w50 w51 w52 w53"><span data-hf-id="hf-5jj9" class="caption-line">Tapi sekarang lo mikir,</span></div><div data-hf-id="hf-wyxl" id="caption-13" class="caption" data-word-ids="w54 w55"><span data-hf-id="hf-agpo" class="caption-line">“Ya udah.</span></div><div data-hf-id="hf-1ob7" id="caption-14" class="caption" data-word-ids="w56 w57 w58 w59"><span data-hf-id="hf-e43x" class="caption-line">Nggak usah cerita panjang.”</span></div><div data-hf-id="hf-kyy0" id="caption-15" class="caption" data-word-ids="w60 w61 w62"><span data-hf-id="hf-vmam" class="caption-line">Dalam riset hubungan,</span></div><div data-hf-id="hf-pct2" id="caption-16" class="caption" data-word-ids="w63 w64 w65"><span data-hf-id="hf-f6g6" class="caption-line">berbagi kabar baik</span></div><div data-hf-id="hf-cduw" id="caption-17" class="caption" data-word-ids="w66 w67 w68"><span data-hf-id="hf-bv0d" class="caption-line">dengan orang dekat</span></div><div data-hf-id="hf-dbze" id="caption-18" class="caption" data-word-ids="w69 w70 w71"><span data-hf-id="hf-ksm0" class="caption-line">dikenal sebagai capitalization.</span></div><div data-hf-id="hf-7qri" id="caption-19" class="caption" data-word-ids="w72 w73 w74 w75 w76"><span data-hf-id="hf-luox" class="caption-line">Respons yang</span><span data-hf-id="hf-uvk6" class="caption-line">antusias dan terlibat</span></div><div data-hf-id="hf-bvid" id="caption-20" class="caption" data-word-ids="w77 w78"><span data-hf-id="hf-hwcs" class="caption-line">disebut aktif-konstruktif.</span></div><div
