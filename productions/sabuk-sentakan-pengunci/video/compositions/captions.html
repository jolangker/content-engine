<template><style>@font-face{font-family:Manrope;src:url('assets/fonts/manrope.ttf');font-weight:200 800}#root{position:absolute;inset:0;pointer-events:none}.cap{position:absolute;left:108px;top:1190px;width:790px;font:600 44px/1.25 Manrope,sans-serif;color:#172B3B;background:#ECEEE9;padding:4px 0}</style><div id="root" data-composition-id="captions" data-width="1080" data-height="1920"><div id="cap-000" class="clip cap" data-start="0.362037" data-duration="1.105000"><span>Ditarik pelan,</span></div><div id="cap-001" class="clip cap" data-start="1.633333" data-duration="1.463334"><span>sabuk ini memanjang.</span></div><div id="cap-002" class="clip cap" data-start="3.188889" data-duration="1.907778"><span>Disentak, malah mengunci.</span></div><div id="cap-003" class="clip cap" data-start="5.188889" data-duration="0.777778"><span>Apa yang berubah di</span></div><div id="cap-004" class="clip cap" data-start="5.966667" data-duration="0.611481"><span>dalamnya?</span></div><div id="cap-005" class="clip cap" data-start="6.880556" data-duration="1.086111"><span>Pita itu terhubung ke</span></div><div id="cap-006" class="clip cap" data-start="7.966667" data-duration="0.685555"><span>gulungan.</span></div><div id="cap-007" class="clip cap" data-start="8.818519" data-duration="1.629629"><span>Saat ditarik, gulungannya ikut</span></div><div id="cap-008" class="clip cap" data-start="10.448148" data-duration="0.796667"><span>berputar.</span></div><div id="cap-009" class="clip cap" data-start="11.337037" data-duration="1.222222"><span>Pegas di sisi gulungan</span></div><div id="cap-010" class="clip cap" data-start="12.559259" data-duration="1.370371"><span>menarik pita kembali saat</span></div><div id="cap-011" class="clip cap" data-start="13.929630" data-duration="1.204074"><span>tidak lagi ditahan.</span></div><div id="cap-012" class="clip cap" data-start="15.262963" data-duration="1.870741"><span>Sekarang buka sisi penguncinya.</span></div><div id="cap-013" class="clip cap" data-start="17.262963" data-duration="1.111111"><span>Kita lihat satu desain</span></div><div id="cap-014" class="clip cap" data-start="18.374074" data-duration="1.907778"><span>dengan roda inersia bergigi.</span></div><div id="cap-015" class="clip cap" data-start="20.374074" data-duration="1.463333"><span>Roda penggerak menempel pada</span></div><div id="cap-016" class="clip cap" data-start="21.855556" data-duration="1.055925"><span>poros gulungan.</span></div><div id="cap-017" class="clip cap" data-start="22.966667" data-duration="1.555555"><span>Giginya memutar roda kecil</span></div><div id="cap-018" class="clip cap" data-start="24.522222" data-duration="0.962963"><span>yang terhubung ke roda</span></div><div id="cap-019" class="clip cap" data-start="25.485185" data-duration="0.907778"><span>inersia.</span></div><div id="cap-020" class="clip cap" data-start="26.522222" data-duration="1.611482"><span>Saat tarikan normal, roda</span></div><div id="cap-021" class="clip cap" data-start="28.151852" data-duration="1.315185"><span>inersia ikut berputar.</span></div><div id="cap-022" class="clip cap" data-start="29.707407" data-duration="1.333334"><span>Pelat pembawanya tetap di</span></div><div id="cap-023" class="clip cap" data-start="31.040741" data-duration="0.500370"><span>tempat.</span></div><div id="cap-024" class="clip cap" data-start="31.781481" data-duration="1.389260"><span>Pegas kecil menahan pelat</span></div><div id="cap-025" class="clip cap" data-start="33.188889" data-duration="1.814815"><span>itu, sehingga pengunci masih</span></div><div id="cap-026" class="clip cap" data-start="35.003704" data-duration="1.574444"><span>berjarak dari gigi gulungan.</span></div><div id="cap-027" class="clip cap" data-start="36.892593" data-duration="2.000000"><span>Lalu, tarikan mendadak mempercepat</span></div><div id="cap-028" class="clip cap" data-start="38.892593" data-duration="0.574444"><span>gulungan.</span></div><div id="cap-029" class="clip cap" data-start="39.707407" data-duration="1.666667"><span>Tetapi roda inersia menolak</span></div><div id="cap-030" class="clip cap" data-start="41.374074" data-duration="1.685556"><span>perubahan putaran yang tiba-tiba.</span></div><div id="cap-031" class="clip cap" data-start="43.114815" data-duration="1.722592"><span>Hambatan inilah pemicunya.</span></div><div id="cap-032" class="clip cap" data-start="44.892593" data-duration="1.604629"><span>Dorongan antargigi kini bisa</span></div><div id="cap-033" class="clip cap" data-start="46.497222" data-duration="1.654630"><span>mengalahkan tarikan pegas penahan</span></div><div id="cap-034" class="clip cap" data-start="48.151852" data-duration="0.500370"><span>pelat.</span></div><div id="cap-035" class="clip cap" data-start="48.892593" data-duration="1.259259"><span>Roda kecil tidak cuma</span></div><div id="cap-036" class="clip cap" data-start="50.151852" data-duration="0.907778"><span>berputar.</span></div><div id="cap-037" class="clip cap" data-start="51.114815" data-duration="0.648518"><span>Porosnya</span></div><div id="cap-038" class="clip cap" data-start="51.818519" data-duration="1.666666"><span>bergerak mengitari roda penggerak,</span></div><div id="cap-039" class="clip cap" data-start="53.485185" data-duration="1.352222"><span>sambil membawa pelat.</span></div><div id="cap-040" class="clip cap" data-start="54.892593" data-duration="1.296296"><span>Pelat yang bergeser membawa</span></div><div id="cap-041" class="clip cap" data-start="56.188889" data-duration="0.537407"><span>lengan.</span></div><div id="cap-042" class="clip cap" data-start="56.966667" data-duration="1.333333"><span>Ujung lengan itu mendorong</span></div><div id="cap-043" class="clip cap" data-start="58.300000" data-duration="1.352222"><span>bagian belakang pengunci.</span></div><div id="cap-044" class="clip cap" data-start="59.707407" data-duration="1.481482"><span>Pengunci berayun masuk ke</span></div><div id="cap-045" class="clip cap" data-start="61.188889" data-duration="1.296296"><span>roda bergigi yang menyatu</span></div><div id="cap-046" class="clip cap" data-start="62.485185" data-duration="0.944815"><span>dengan gulungan.</span></div><div id="cap-047" class="clip cap" data-start="63.485185" data-duration="1.574445"><span>Perhatikan titik pertemuannya.</span></div><div id="cap-048" class="clip cap" data-start="65.188889" data-duration="2.037037"><span>Begitu giginya tertahan, gulungan</span></div><div id="cap-049" class="clip cap" data-start="67.225926" data-duration="1.278148"><span>berhenti melepas pita.</span></div><div id="cap-050" class="clip cap" data-start="68.670370" data-duration="1.407408"><span>Tarikan kini diteruskan ke</span></div><div id="cap-051" class="clip cap" data-start="70.077778" data-duration="1.426296"><span>rangka lewat pengunci.</span></div><div id="cap-052" class="clip cap" data-start="71.559259" data-duration="1.851852"><span>Jadi, roda inersia memicu</span></div><div id="cap-053" class="clip cap" data-start="73.411111" data-duration="0.722593"><span>gerakan.</span></div><div id="cap-054" class="clip cap" data-start="74.151852" data-duration="1.555555"><span>Pengunci dan roda bergigilah</span></div><div id="cap-055" class="clip cap" data-start="75.707407" data-duration="1.092963"><span>yang menahan gulungan.</span></div><div id="cap-056" class="clip cap" data-start="77.040741" data-duration="0.981852"><span>Bandingkan lagi.</span></div><div id="cap-057" class="clip cap" data-start="78.077778" data-duration="1.870741"><span>Tarikan halus memutar roda.</span></div><div id="cap-058" class="clip cap" data-start="80.003704" data-duration="1.925926"><span>Sentakan menggerakkan pelat, lalu</span></div><div id="cap-059" class="clip cap" data-start="81.929630" data-duration="0.870740"><span>pengunci masuk.</span></div><div id="cap-060" class="clip cap" data-start="83.025926" data-duration="1.348148"><span>Di desain ini, perubahan</span></div><div id="cap-061" class="clip cap" data-start="84.374074" data-duration="1.944815"><span>gerak pita memicu penguncian.</span></div><div id="cap-062" class="clip cap" data-start="86.374074" data-duration="1.555556"><span>Sensor gerak kendaraan memakai</span></div><div id="cap-063" class="clip cap" data-start="87.929630" data-duration="0.870740"><span>jalur lain.</span></div></div><script>window.__timelines['captions']=gsap.timeline({paused:true}).to({},{duration:90},0);</script></template>
