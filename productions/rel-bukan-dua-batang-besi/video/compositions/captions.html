<template><style>#root{position:absolute;inset:0;color:#173B42}.spoken{position:absolute;left:72px;top:1185px;width:max-content;max-width:825px;padding:17px 26px;border-radius:16px;background:#FFF5DE;font:700 58px/1.1 Barlow,sans-serif;letter-spacing:-.87px;white-space:normal}</style><div data-hf-id="hf-9a8e" id="root" data-composition-id="captions" data-width="1080" data-height="1920" data-duration="85.81"><div data-hf-id="hf-it0g" id="caption-group-0" class="clip" data-start="0.395000" data-duration="1.125000" data-track-index="3"><div data-hf-id="hf-p9ae" class="spoken">Kalau kamu mau bikin jalur</div></div><div data-hf-id="hf-8c51" id="caption-group-1" class="clip" data-start="1.530000" data-duration="2.030000" data-track-index="3"><div data-hf-id="hf-fj8s" class="spoken">kereta, taruh dua batang besi.</div></div><div data-hf-id="hf-6se7" id="caption-group-2" class="clip" data-start="3.690000" data-duration="0.630000" data-track-index="3"><div data-hf-id="hf-hpbw" class="spoken">Beres?</div></div><div data-hf-id="hf-zzsw" id="caption-group-3" class="clip" data-start="4.410000" data-duration="0.790000" data-track-index="3"><div data-hf-id="hf-9cdn" class="spoken">Belum.</div></div><div data-hf-id="hf-laks" id="caption-group-4" class="clip" data-start="5.442000" data-duration="1.718000" data-track-index="3"><div data-hf-id="hf-x28c" class="spoken">Kereta memberi beban besar.</div></div><div data-hf-id="hf-1z6c" id="caption-group-5" class="clip" data-start="7.290000" data-duration="1.910000" data-track-index="3"><div data-hf-id="hf-kk74" class="spoken">Kalau penopangnya lemah, jalurnya bisa</div></div><div data-hf-id="hf-5cbv" id="caption-group-6" class="clip" data-start="9.210000" data-duration="0.720000" data-track-index="3"><div data-hf-id="hf-88bc" class="spoken">turun.</div></div><div data-hf-id="hf-fie3" id="caption-group-7" class="clip" data-start="9.930000" data-duration="1.510000" data-track-index="3"><div data-hf-id="hf-e9o8" class="spoken">Jadi, kita lihat apa yang</div></div><div data-hf-id="hf-fzy2" id="caption-group-8" class="clip" data-start="11.450000" data-duration="1.280000" data-track-index="3"><div data-hf-id="hf-5crk" class="spoken">bekerja di bawahnya.</div></div><div data-hf-id="hf-codg" id="caption-group-9" class="clip" data-start="12.730000" data-duration="1.960000" data-track-index="3"><div data-hf-id="hf-231t" class="spoken">Bantalan menopang rel dan membantu</div></div><div data-hf-id="hf-h61y" id="caption-group-10" class="clip" data-start="14.690000" data-duration="1.600000" data-track-index="3"><div data-hf-id="hf-hxlm" class="spoken">menyebarkan beban ke lapisan di</div></div><div data-hf-id="hf-6t24" id="caption-group-11" class="clip" data-start="16.290000" data-duration="0.813000" data-track-index="3"><div data-hf-id="hf-iq63" class="spoken">bawahnya.</div></div><div data-hf-id="hf-c3oo" id="caption-group-12" class="clip" data-start="17.103000" data-duration="1.617000" data-track-index="3"><div data-hf-id="hf-a3kf" class="spoken">Tapi rel juga harus terikat</div></div><div data-hf-id="hf-ev87" id="caption-group-13" class="clip" data-start="18.730000" data-duration="1.030000" data-track-index="3"><div data-hf-id="hf-m473" class="spoken">ke bantalan.</div></div><div data-hf-id="hf-6t0n" id="caption-group-14" class="clip" data-start="19.770000" data-duration="1.920000" data-track-index="3"><div data-hf-id="hf-xqyf" class="spoken">Penambat menjepit kaki rel.</div></div><div data-hf-id="hf-zdz7" id="caption-group-15" class="clip" data-start="21.690000" data-duration="1.910000" data-track-index="3"><div data-hf-id="hf-th3l" class="spoken">Sekarang rel dan bantalan bekerja</div></div><div data-hf-id="hf-5z2v" id="caption-group-16" class="clip" data-start="23.610000" data-duration="2.240000" data-track-index="3"><div data-hf-id="hf-k6ro" class="spoken">bersama, bukan sekadar ditumpuk.</div></div><div data-hf-id="hf-qzpj" id="caption-group-17" class="clip" data-start="25.850000" data-duration="2.070000" data-track-index="3"><div data-hf-id="hf-tfga" class="spoken">Di bawahnya, kita butuh balas:</div></div><div data-hf-id="hf-mes4" id="caption-group-18" class="clip" data-start="27.970000" data-duration="1.373000" data-track-index="3"><div data-hf-id="hf-rxsd" class="spoken">batu pecah bersudut.</div></div><div data-hf-id="hf-7h2r" id="caption-group-19" class="clip" data-start="29.343000" data-duration="2.257000" data-track-index="3"><div data-hf-id="hf-6otx" class="spoken">Batu-batunya saling mengunci dan meneruskan</div></div><div data-hf-id="hf-f985" id="caption-group-20" class="clip" data-start="31.610000" data-duration="1.470000" data-track-index="3"><div data-hf-id="hf-spox" class="spoken">beban ke tanah dasar.</div></div><div data-hf-id="hf-o1yt" id="caption-group-21" class="clip" data-start="33.263000" data-duration="1.297000" data-track-index="3"><div data-hf-id="hf-gx7e" class="spoken">Balas juga mengisi sela dan</div></div><div data-hf-id="hf-5fg4" id="caption-group-22" class="clip" data-start="34.570000" data-duration="2.960000" data-track-index="3"><div data-hf-id="hf-dbeu" class="spoken">sisi bantalan, membantu menahan pergeseran.</div></div><div data-hf-id="hf-l4d9" id="caption-group-23" class="clip" data-start="37.530000" data-duration="2.396000" data-track-index="3"><div data-hf-id="hf-macc" class="spoken">Nah, kelihatannya sudah bisa santai.</div></div><div data-hf-id="hf-jx2h" id="caption-group-24" class="clip" data-start="40.330000" data-duration="1.040000" data-track-index="3"><div data-hf-id="hf-yxgi" class="spoken">Eh, kok basah?</div></div><div data-hf-id="hf-o78w" id="caption-group-25" class="clip" data-start="41.370000" data-duration="1.670000" data-track-index="3"><div data-hf-id="hf-4hra" class="spoken">Celah batu memang bisa melewatkan</div></div><div data-hf-id="hf-bi5g" id="caption-group-26" class="clip" data-start="43.050000" data-duration="2.040000" data-track-index="3"><div data-hf-id="hf-q3jy" class="spoken">air, tapi airnya tetap perlu</div></div><div data-hf-id="hf-x6pd" id="caption-group-27" class="clip" data-start="45.090000" data-duration="1.030000" data-track-index="3"><div data-hf-id="hf-4bjc" class="spoken">jalan keluar.</div></div><div data-hf-id="hf-ymsu" id="caption-group-28" class="clip" data-start="46.161000" data-duration="1.919000" data-track-index="3"><div data-hf-id="hf-4bis" class="spoken">Jadi, dasar jalur dan saluran</div></div><div data-hf-id="hf-p9bz" id="caption-group-29" class="clip" data-start="48.090000" data-duration="1.990000" data-track-index="3"><div data-hf-id="hf-3xzk" class="spoken">drainase perlu mengarahkan air ke</div></div><div data-hf-id="hf-961v" id="caption-group-30" class="clip" data-start="50.130000" data-duration="1.080000" data-track-index="3"><div data-hf-id="hf-1nxx" class="spoken">tempat pembuangan.</div></div><div data-hf-id="hf-odj2" id="caption-group-31" class="clip" data-start="51.210000" data-duration="1.750000" data-track-index="3"><div data-hf-id="hf-bd48" class="spoken">Bukan membiarkannya terjebak.</div></div><div data-hf-id="hf-0xdj" id="caption-group-32" class="clip" data-start="52.970000" data-duration="1.350000" data-track-index="3"><div data-hf-id="hf-eaca" class="spoken">Tanah yang jenuh air bisa</div></div><div data-hf-id="hf-jrax" id="caption-group-33" class="clip" data-start="54.330000" data-duration="1.430000" data-track-index="3"><div data-hf-id="hf-6w8h" class="spoken">kehilangan kekakuan.</div></div><div data-hf-id="hf-hwju" id="caption-group-34" class="clip" data-start="55.770000" data-duration="1.910000" data-track-index="3"><div data-hf-id="hf-smc9" class="spoken">Lapisan penyangga dan drainase harus</div></div><div data-hf-id="hf-2czx" id="caption-group-35" class="clip" data-start="57.690000" data-duration="2.310000" data-track-index="3"><div data-hf-id="hf-b31y" class="spoken">bekerja bersama, supaya tumpuannya tetap</div></div><div data-hf-id="hf-kr7q" id="caption-group-36" class="clip" data-start="60.010000" data-duration="0.640000" data-track-index="3"><div data-hf-id="hf-edlj" class="spoken">baik.</div></div><div data-hf-id="hf-ft0x" id="caption-group-37" class="clip" data-start="60.650000" data-duration="2.080000" data-track-index="3"><div data-hf-id="hf-u9aa" class="spoken">Lama-lama, balas bisa kotor.</div></div><div data-hf-id="hf-fe6b" id="caption-group-38" class="clip" data-start="62.730000" data-duration="2.053000" data-track-index="3"><div data-hf-id="hf-yy3v" class="spoken">Butiran halus mengisi celahnya.</div></div><div data-hf-id="hf-176p" id="caption-group-39" class="clip" data-start="64.783000" data-duration="2.320000" data-track-index="3"><div data-hf-id="hf-t4ah" class="spoken">Karena itu, balas perlu diperiksa,</div></div><div data-hf-id="hf-m7k0" id="caption-group-40" class="clip" data-start="67.103000" data-duration="1.947000" data-track-index="3"><div data-hf-id="hf-6r8f" class="spoken">dibersihkan, atau diganti.</div></div><div data-hf-id="hf-z7ib" id="caption-group-41" class="clip" data-start="69.050000" data-duration="2.150000" data-track-index="3"><div data-hf-id="hf-uq7p" class="spoken">Kalau tumpuan berubah, mesin tamping</div></div><div data-hf-id="hf-6mo4" id="caption-group-42" class="clip" data-start="71.210000" data-duration="1.910000" data-track-index="3"><div data-hf-id="hf-9am5" class="spoken">memadatkan balas di bawah bantalan</div></div><div data-hf-id="hf-11z4" id="caption-group-43" class="clip" data-start="73.130000" data-duration="2.634000" data-track-index="3"><div data-hf-id="hf-v26j" class="spoken">untuk membantu mengembalikan geometri jalur.</div></div><div data-hf-id="hf-s0vq" id="caption-group-44" class="clip" data-start="75.764000" data-duration="2.984000" data-track-index="3"><div data-hf-id="hf-5ag8" class="spoken">Pada jalur berbalas, rel, bantalan,</div></div><div data-hf-id="hf-urff" id="caption-group-45" class="clip" data-start="78.784000" data-duration="2.017000" data-track-index="3"><div data-hf-id="hf-k2ep" class="spoken">batu, tanah dasar, dan drainase</div></div><div data-hf-id="hf-r87h" id="caption-group-46" class="clip" data-start="80.811000" data-duration="1.440000" data-track-index="3"><div data-hf-id="hf-6q3r" class="spoken">adalah satu sistem.</div></div><div data-hf-id="hf-g5n1" id="caption-group-47" class="clip" data-start="82.251000" data-duration="2.310000" data-track-index="3"><div data-hf-id="hf-3zsp" class="spoken">Sekarang, kursinya boleh dipakai.</div></div></div><script>const tl=gsap.timeline({paused:true});window.__timelines['captions']=tl;</script></template>
